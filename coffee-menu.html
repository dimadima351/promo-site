<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню кав'ярні | Ваш ПАРТНЕР</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           БАЗОВІ НАЛАШТУВАННЯ (СЛАЙД НА ВЕСЬ ЕКРАН)
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;

            background: linear-gradient(rgba(18, 12, 8, 0.85), rgba(18, 12, 8, 0.85)),
                        url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?q=80&w=1920&auto=format&fit=crop') center/cover fixed no-repeat;
            display: flex;
            flex-direction: column;
        }

        /* ============================================================
           ЛОГОТИП — ПРОСТО ПЛАВАЄ В КУТІ, БЕЗ ШАПКИ
           ============================================================ */
        .header-logo {
            position: fixed;
            top: 2.5vh;
            left: 2vw;
            height: 8vh;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
            z-index: 10;
            pointer-events: none;
        }

        /* ============================================================
           ОСНОВНА СІТКА (3 КОЛОНКИ, НА ВСЮ ВИСОТУ)
           ============================================================ */
        .main-container {
            flex-grow: 1;
            height: 100vh;
            padding: 3vh 4vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 1fr;
            gap: 2.2vh 2.2vw;
            width: 100%;
            height: 100%;
        }

        /* 7-й елемент рівно по центру (в 2-гу колонку) */
        .menu-card:nth-child(7) {
            grid-column: 2;
        }

        /* ============================================================
           КАРТКА ТОВАРУ
           ============================================================ */
        .menu-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .menu-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        }

        /* ---- Фото + ціна поверх нього ---- */
        .card-img-wrapper {
            position: relative;      /* база для абсолютної ціни */
            flex: 1 1 auto;
            min-height: 0;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5vh 1vw;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ЦІНА — БЕЙДЖ У ПРАВОМУ ВЕРХНЬОМУ КУТІ КАРТИНКИ */
        .card-price {
            position: absolute;
            top: 1.2vh;
            right: 1.2vh;
            background: linear-gradient(135deg, #4e342e, #2b1a16);
            color: #ffd97a;
            font-size: clamp(1.6rem, 4.2vh, 3rem);   /* велика ціна */
            font-weight: 800;
            line-height: 1;
            padding: 1vh 1.6vh;
            border-radius: 40px;
            border: 2px solid #d4af37;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
            white-space: nowrap;
            letter-spacing: 0.02em;
        }

        /* ---- Назва під фото ---- */
        .card-info {
            flex: 0 0 auto;
            padding: 1.4vh 1.2vw 2vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card-title {
            font-size: clamp(0.95rem, 2.2vh, 1.5rem);
            font-weight: 800;
            color: #2c3e50;
            line-height: 1.25;
            word-wrap: break-word;
        }

        /* ============================================================
           АДАПТИВНІСТЬ
           ============================================================ */
        @media (max-width: 900px) {
            html, body { overflow: auto; height: auto; }
            .header-logo { height: 50px; top: 15px; left: 15px; }

            .main-container { height: auto; padding: 90px 20px 20px; }
            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                height: auto;
            }
            .menu-card:nth-child(7) { grid-column: auto; }
            .menu-card { min-height: 230px; }
            .card-price { font-size: 1.4rem; padding: 7px 14px; }
            .card-title { font-size: 1rem; }
        }

        @media (max-width: 500px) {
            .menu-grid { grid-template-columns: 1fr; }
            .card-price { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <!-- Логотип просто в куті, без коричневої шапки -->
    <img src="./image_site/0.png" alt="Логотип" class="header-logo" onerror="this.style.display='none';">

    <main class="main-container">
        <div class="menu-grid" id="menuGrid">
            <div style="grid-column: 1/-1; text-align: center; color: #fff; font-size: 1.5rem;">Завантаження меню...</div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('menuGrid');
            const PLACEHOLDER = './images/0.png';

            fetch('./data/promotions.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    let items = (data.items || []).filter(item =>
                        (item.category || '').includes('кав\'ярня') &&
                        item.visible !== false
                    );

                    items = items.slice(0, 7);

                    if (items.length === 0) {
                        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #fff;">У кав\'ярні поки що немає позицій</div>';
                        return;
                    }

                    grid.innerHTML = '';

                    items.forEach(item => {
                        const priceInt = Math.floor(item.price);
                        const priceStr = item.price % 1 === 0 ? priceInt : item.price;

                        const cardHTML = `
                            <div class="menu-card">
                                <div class="card-img-wrapper">
                                    <img src="${item.image}" alt="${item.name}" class="card-img"
                                         onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                                    <div class="card-price">${priceStr} ₴</div>
                                </div>
                                <div class="card-info">
                                    <div class="card-title">${item.name}</div>
                                </div>
                            </div>
                        `;

                        grid.insertAdjacentHTML('beforeend', cardHTML);
                    });
                })
                .catch(err => {
                    console.error(err);
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #e74c3c;">Помилка завантаження меню</div>';
                });
        });
    </script>
</body>
</html>
