<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Меню кав'ярні | Ваш ПАРТНЕР</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Manrope', sans-serif;

            background:
                linear-gradient(
                    rgba(35, 20, 12, 0.72),
                    rgba(35, 20, 12, 0.72)
                ),
                url('./images/coffee-beans.jpg')
                center center / cover no-repeat fixed;

            display: flex;
            flex-direction: column;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            height: 12vh;
            min-height: 80px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #4b2a18;

            border-bottom: 1px solid rgba(255,255,255,0.15);

            box-shadow:
                0 4px 20px rgba(0,0,0,0.35);

            position: relative;
            z-index: 10;
        }

        .header h1 {
            color: #ffffff;

            font-size: clamp(
                2rem,
                5vh,
                4rem
            );

            font-weight: 800;

            letter-spacing: 0.18em;

            text-transform: uppercase;
        }


        /* =========================================================
           MAIN
        ========================================================= */

        .main-container {
            flex: 1;

            min-height: 0;

            padding:
                2vh
                3vw
                2vh
                3vw;

            display: flex;
        }


        /* =========================================================
           GRID
           
           3 + 3 + 1
        ========================================================= */

        .menu-grid {

            width: 100%;
            height: 100%;

            display: grid;

            grid-template-columns:
                repeat(6, minmax(0, 1fr));

            grid-template-rows:
                repeat(3, minmax(0, 1fr));

            gap: 1.8vh 1.4vw;
        }


        /* =========================================================
           CARD
        ========================================================= */

        .menu-card {

            grid-column: span 2;

            min-width: 0;
            min-height: 0;

            background: #ffffff;

            border-radius: 18px;

            border: 1px solid rgba(0,0,0,0.08);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.25);

            display: flex;

            flex-direction: column;

            position: relative;

            overflow: hidden;

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .menu-card:hover {

            transform: translateY(-4px);

            box-shadow:
                0 14px 32px rgba(0,0,0,0.35);
        }


        /* =========================================================
           TOP ACCENT
        ========================================================= */

        .menu-card::before {

            content: "";

            position: absolute;

            left: 0;
            right: 0;
            top: 0;

            height: 5px;

            background: #5a321d;

            z-index: 2;
        }


        /* =========================================================
           PHOTO
        ========================================================= */

        .card-img-wrapper {

            flex: 1;

            min-height: 0;

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                1vh
                1vw
                0.5vh;
        }

        .card-img {

            width: 100%;
            height: 100%;

            max-width: 280px;
            max-height: 220px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 12px 12px
                    rgba(0,0,0,0.20)
                );

            transition:
                transform .25s ease;
        }

        .menu-card:hover .card-img {

            transform: scale(1.045);
        }


        /* =========================================================
           INFO
        ========================================================= */

        .card-info {

            width: 100%;

            flex-shrink: 0;

            padding:
                0
                1vw
                1.1vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }


        /* =========================================================
           NAME
        ========================================================= */

        .card-title {

            width: 100%;

            color: #24150e;

            font-size:
                clamp(
                    1rem,
                    2.2vh,
                    1.65rem
                );

            font-weight: 800;

            line-height: 1.15;

            margin-bottom: 0.9vh;

            word-break: break-word;
        }


        /* =========================================================
           PRICE
        ========================================================= */

        .card-price {

            color: #ffffff;

            background: #542f1a;

            padding:
                0.55vh
                1.4vw;

            min-width: 115px;

            border-radius: 9px;

            font-size:
                clamp(
                    1.1rem,
                    2.6vh,
                    2rem
                );

            font-weight: 800;

            line-height: 1;

            box-shadow:
                0 4px 10px
                rgba(84,47,26,0.25);
        }


        /* =========================================================
           7-Й ЕЛЕМЕНТ
           
           Широкий по центру
        ========================================================= */

        .menu-card:nth-child(7) {

            grid-column:
                2 / span 4;

        }


        /* =========================================================
           MESSAGE
        ========================================================= */

        .message {

            grid-column: 1 / -1;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #ffffff;

            font-size: 1.2rem;
        }


        /* =========================================================
           SMALL DESKTOP
        ========================================================= */

        @media
        (min-width: 901px)
        and (max-height: 750px) {

            .header {
                height: 11vh;
            }

            .main-container {
                padding-top: 1.5vh;
                padding-bottom: 1.5vh;
            }

            .menu-grid {
                gap: 1.3vh 1.2vw;
            }

            .card-img {
                max-height: 185px;
            }

            .card-title {
                margin-bottom: 0.5vh;
            }

            .card-price {
                padding-top: 0.45vh;
                padding-bottom: 0.45vh;
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 900px) {

            html,
            body {
                height: auto;
                overflow: auto;
            }

            .header {
                height: 90px;
            }

            .main-container {
                padding: 15px;
            }

            .menu-grid {

                height: auto;

                grid-template-columns: 1fr;

                grid-template-rows: auto;

                gap: 18px;
            }

            .menu-card {

                grid-column: auto !important;

                min-height: 430px;
            }

            .card-img {
                max-width: 320px;
                max-height: 300px;
            }
        }

    </style>
</head>


<body>


<header class="header">

    <h1>МЕНЮ</h1>

</header>


<main class="main-container">

    <div
        class="menu-grid"
        id="menuGrid"
    >

        <div class="message">
            Завантаження меню...
        </div>

    </div>

</main>


<script>

document.addEventListener(
    'DOMContentLoaded',
    () => {

        const grid =
            document.getElementById(
                'menuGrid'
            );


        const PLACEHOLDER =
            './images/0.png';


        fetch(
            './data/promotions.json?t='
            + Date.now()
        )

        .then(
            res => res.json()
        )

        .then(
            data => {

                let items =
                    (data.items || [])
                    .filter(
                        item =>
                            (item.category || '')
                            .includes('кав\'ярня')
                            &&
                            item.visible !== false
                    );


                /*
                 * БЕРЕМО САМЕ 7 ПОЗИЦІЙ
                 */

                items =
                    items.slice(0, 7);


                if (items.length === 0) {

                    grid.innerHTML = `
                        <div class="message">
                            У кав'ярні поки що немає позицій
                        </div>
                    `;

                    return;
                }


                /*
                 * СТВОРЕННЯ КАРТКИ
                 */

                const createCard =
                    (item) => {

                        const price =
                            Number(item.price);


                        const priceStr =
                            Number.isInteger(price)
                                ? price
                                : price.toFixed(2);


                        return `

                            <div class="menu-card">

                                <div class="card-img-wrapper">

                                    <img
                                        src="${item.image}"
                                        alt="${item.name}"
                                        class="card-img"

                                        onerror="
                                            this.onerror=null;
                                            this.src='${PLACEHOLDER}';
                                        "
                                    >

                                </div>


                                <div class="card-info">

                                    <div class="card-title">
                                        ${item.name}
                                    </div>


                                    <div class="card-price">
                                        ${priceStr} ₴
                                    </div>

                                </div>

                            </div>

                        `;
                    };


                /*
                 * РЕНДЕРИМО ВСІ 7
                 */

                grid.innerHTML =
                    items
                    .map(createCard)
                    .join('');

            }
        )


        .catch(
            err => {

                console.error(err);

                grid.innerHTML = `
                    <div class="message">
                        Помилка завантаження меню
                    </div>
                `;
            }
        );

    }
);

</script>


</body>
</html>
