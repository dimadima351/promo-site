<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню кав'ярні | Ваш ПАРТНЕР</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(rgba(18, 12, 8, 0.85), rgba(18, 12, 8, 0.85)),
                        url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?q=80&w=1920&auto=format&fit=crop') center/cover fixed no-repeat;
            display: flex;
            flex-direction: column;
        }

        /* ============================================================
           ВІДЕО-ІНТРО
           ============================================================ */
        .intro-video {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            overflow: hidden;
            transition: opacity 1s ease;
        }
        .intro-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .intro-video::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent 40%);
            pointer-events: none;
        }
        .skip-btn {
            position: absolute;
            bottom: 4vh;
            right: 3vw;
            z-index: 2;
            background: rgba(0, 0, 0, 0.55);
            color: #f5ebe0;
            border: 1.5px solid rgba(212, 175, 55, 0.6);
            padding: 1.1vh 2.2vh;
            border-radius: 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.85rem, 1.6vh, 1.05rem);
            font-weight: 600;
            letter-spacing: 0.08em;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
        }
        .skip-btn:hover {
            background: rgba(212, 175, 55, 0.3);
            border-color: #d4af37;
            transform: translateX(4px);
        }
        body.intro-done .intro-video {
            opacity: 0;
            pointer-events: none;
        }

        /* ============================================================
           ЛОГОТИП
           ============================================================ */
        .header-logo {
            position: fixed;
            top: 2.5vh;
            left: 2vw;
            height: 8vh;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
            z-index: 10;
            opacity: 0;
            animation: logoIn 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards paused;
            pointer-events: none;
        }
        body.intro-done .header-logo { animation-play-state: running; }
        @keyframes logoIn {
            0%   { opacity: 0; transform: translateX(-40px) rotate(-12deg); }
            100% { opacity: 1; transform: translateX(0) rotate(0deg); }
        }

        /* ============================================================
           ЗАГОЛОВОК "МЕНЮ"
           ============================================================ */
        .title {
            position: fixed;
            top: 2vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 6.5vh, 4.5rem);
            text-transform: uppercase;
            color: #f5ebe0;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 40px rgba(212, 175, 55, 0.25);
            transition: text-shadow 0.5s ease;
        }
        .title span {
            display: inline-block;
            padding-left: 0.25em;
            opacity: 0;
            animation: titleIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s forwards paused;
        }
        body.intro-done .title span { animation-play-state: running; }
        @keyframes titleIn {
            0%   { opacity: 0; transform: translateY(-40px); letter-spacing: 0.4em; }
            100% { opacity: 1; transform: translateY(0); letter-spacing: 0.25em; }
        }
        .title.pulse {
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7),
                         0 0 60px rgba(212, 175, 55, 0.85),
                         0 0 100px rgba(212, 175, 55, 0.5);
        }

        /* ============================================================
           СІТКА
           ============================================================ */
        .main-container {
            flex-grow: 1;
            height: 100vh;
            padding: 13vh 4vw 3vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-auto-rows: 1fr;
            gap: 2.2vh 2.2vw;
            width: 100%;
            height: 100%;
        }

        /* ============================================================
           КАРТКА
           ============================================================ */
        .menu-card {
            grid-column: span 2;
            --scale: 1;
            --lift: 0px;
            position: relative;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
            transform: translateY(var(--lift)) scale(var(--scale));
            opacity: 0;
            animation: cardIn 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards paused;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.4s ease;
        }
        body.intro-done .menu-card { animation-play-state: running; }
        @keyframes cardIn {
            0%   { opacity: 0; transform: translateY(50px) scale(0.85); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .menu-card.appeared {
            animation: none;
            opacity: 1;
        }
        .menu-card:hover {
            --lift: -8px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        }
        .menu-card.pulse {
            --scale: 1.05;
            z-index: 2;
            box-shadow: 0 22px 50px rgba(212, 175, 55, 0.55),
                        0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* Центрування залишку останнього ряду */
        .menu-card.center-single     { grid-column: 3 / span 2; }
        .menu-card.center-pair-left  { grid-column: 2 / span 2; }
        .menu-card.center-pair-right { grid-column: 4 / span 2; }

        /* ---- Фото ---- */
        .card-img-wrapper {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5vh 1vw;
            overflow: hidden;
        }
        .card-img { width: 100%; height: 100%; object-fit: contain; }

        /* ---- ЦІНА ---- */
        .card-price {
            --price-scale: 1;
            position: absolute;
            top: 1.2vh;
            right: 1.2vh;
            background: linear-gradient(135deg, #4e342e, #2b1a16);
            color: #ffd97a;
            font-size: clamp(1.6rem, 4.2vh, 2.8rem);
            font-weight: 800;
            line-height: 1;
            padding: 1vh 1.6vh;
            border-radius: 40px;
            border: 2px solid #d4af37;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
            white-space: nowrap;
            letter-spacing: 0.02em;
            transform: scale(var(--price-scale));
            transform-origin: top right;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background 0.4s ease, color 0.4s ease,
                        box-shadow 0.4s ease, border-color 0.4s ease;
        }
        .card-price.pulse-price {
            --price-scale: 1.4;
            background: linear-gradient(135deg, #f5d76e, #d4af37);
            color: #2b1a16;
            border-color: #fff8e1;
            box-shadow: 0 8px 25px rgba(245, 215, 110, 0.9),
                        0 0 35px rgba(212, 175, 55, 0.7);
        }

        /* ---- Назва ---- */
        .card-info {
            flex: 0 0 auto;
            padding: 1.4vh 1.2vw 2vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .card-title {
            font-size: clamp(0.95rem, 2.2vh, 1.5rem);
            font-weight: 800;
            color: #2c3e50;
            line-height: 1.25;
            word-wrap: break-word;
            transition: color 0.4s ease;
        }
        .menu-card.pulse .card-title { color: #b8860b; }

        /* ============================================================
           АДАПТИВНІСТЬ
           ============================================================ */
        @media (max-width: 900px) {
            html, body { overflow: auto; height: auto; }
            .header-logo { height: 50px; top: 15px; left: 15px; }
            .title { top: 12px; font-size: 2rem; }
            .skip-btn { bottom: 20px; right: 20px; padding: 10px 18px; font-size: 0.9rem; }

            .main-container { height: auto; padding: 90px 20px 20px; }
            .menu-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 15px;
                height: auto;
            }
            .menu-card.center-single,
            .menu-card.center-pair-left,
            .menu-card.center-pair-right { grid-column: span 2; }
            .menu-card { min-height: 230px; }
            .card-price { font-size: 1.4rem; padding: 7px 14px; }
            .card-title { font-size: 1rem; }
        }
        @media (max-width: 500px) {
            .menu-grid { grid-template-columns: repeat(2, 1fr); }
            .card-price { font-size: 1.3rem; }
            .title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <!-- ============ ВІДЕО-ІНТРО (файл лежить у ./image_site/_000.mp4) ============ -->
    <div class="intro-video" id="introVideo">
        <video src="./image_site/_000.mp4" autoplay muted playsinline preload="auto"></video>
        <button class="skip-btn" id="skipBtn">Пропустити →</button>
    </div>

    <!-- ============ МЕНЮ ============ -->
    <img src="./image_site/0.png" alt="Логотип" class="header-logo" onerror="this.style.display='none';">
    <h1 class="title"><span>МЕНЮ</span></h1>

    <main class="main-container">
        <div class="menu-grid" id="menuGrid">
            <div style="grid-column: 1/-1; text-align: center; color: #fff; font-size: 1.5rem;">Завантаження меню...</div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid        = document.getElementById('menuGrid');
            const title       = document.querySelector('.title');
            const introVideo  = document.getElementById('introVideo');
            const videoEl     = introVideo.querySelector('video');
            const skipBtn     = document.getElementById('skipBtn');
            const PLACEHOLDER = './images/0.png';

            let menuReady = false;
            let videoDone = false;
            let introDone = false;
            let cards     = [];

            /* ---- Показати меню, коли готові ОБИДВІ умови ---- */
            function tryShowMenu() {
                if (introDone || !menuReady || !videoDone) return;
                introDone = true;

                document.body.classList.add('intro-done');

                const entranceEndMs = (0.85 + (cards.length - 1) * 0.15 + 0.75) * 1000 + 100;
                setTimeout(() => {
                    cards.forEach(card => card.classList.add('appeared'));
                    startPulseLoop(cards, title);
                }, entranceEndMs);
            }

            /* ---- Завершення відео ---- */
            function finishVideo() {
                if (videoDone) return;
                videoDone = true;
                tryShowMenu();
            }
            videoEl.addEventListener('ended', finishVideo);
            videoEl.addEventListener('error', finishVideo);
            skipBtn.addEventListener('click', finishVideo);
            setTimeout(finishVideo, 12000); // запобіжник: 12 с макс (для 10-сек відео)

            videoEl.play().catch(() => {});

            /* ---- Завантаження меню ---- */
            fetch('./data/promotions.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    let items = (data.items || []).filter(item =>
                        (item.category || '').includes('кав\'ярня') &&
                        item.visible !== false
                    ).slice(0, 9);

                    if (items.length === 0) {
                        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #fff;">У кав\'ярні поки що немає позицій</div>';
                        menuReady = true;
                        tryShowMenu();
                        return;
                    }

                    grid.innerHTML = '';

                    items.forEach((item, index) => {
                        const priceInt = Math.floor(item.price);
                        const priceStr = item.price % 1 === 0 ? priceInt : item.price;
                        const delay = 0.85 + index * 0.15;

                        const cardHTML = `
                            <div class="menu-card" style="animation-delay: ${delay}s">
                                <div class="card-img-wrapper">
                                    <img src="${item.image}" alt="${item.name}" class="card-img"
                                         onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                                    <div class="card-price">${priceStr} ₴</div>
                                </div>
                                <div class="card-info">
                                    <div class="card-title">${item.name}</div>
                                </div>
                            </div>
                        `;
                        grid.insertAdjacentHTML('beforeend', cardHTML);
                    });

                    cards = Array.from(document.querySelectorAll('.menu-card'));

                    // Центрування залишку останнього ряду
                    const total = cards.length;
                    const remainder = total % 3;
                    if (remainder === 1 && total > 1) {
                        cards[total - 1].classList.add('center-single');
                    } else if (remainder === 2) {
                        cards[total - 2].classList.add('center-pair-left');
                        cards[total - 1].classList.add('center-pair-right');
                    }

                    menuReady = true;
                    tryShowMenu();
                })
                .catch(err => {
                    console.error(err);
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #e74c3c;">Помилка завантаження меню</div>';
                    menuReady = true;
                    tryShowMenu();
                });

            /* ============================================================
               ПУЛЬС-АНИМАЦІЯ (кожні 10 секунд)
               ============================================================ */
            function startPulseLoop(cards, title) {
                const PER_CARD_DELAY = 180;
                const PULSE_DURATION = 900;
                const INTERVAL       = 10000;

                function runPulse() {
                    title.classList.add('pulse');

                    cards.forEach((card, i) => {
                        setTimeout(() => {
                            card.classList.add('pulse');
                            const price = card.querySelector('.card-price');
                            if (price) price.classList.add('pulse-price');
                        }, i * PER_CARD_DELAY);
                    });

                    const totalTime = (cards.length - 1) * PER_CARD_DELAY + PULSE_DURATION;
                    setTimeout(() => {
                        title.classList.remove('pulse');
                        cards.forEach(card => {
                            card.classList.remove('pulse');
                            const price = card.querySelector('.card-price');
                            if (price) price.classList.remove('pulse-price');
                        });
                    }, totalTime);
                }

                setTimeout(() => {
                    runPulse();
                    setInterval(runPulse, INTERVAL);
                }, 900);
            }
        });
    </script>
</body>
</html>
