<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню кав'ярні</title>
    
    <!-- Сучасні шрифти: Playfair Display для заголовка та Montserrat для тексту -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           БАЗОВІ НАЛАШТУВАННЯ ТА КАВОВИЙ ФОН
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Без скролу */
            /* Текстурний фон з кавовими зернами + темне затемнення */
            background: linear-gradient(rgba(20, 12, 8, 0.75), rgba(20, 12, 8, 0.85)), 
                        url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            color: #ffffff;
        }

        /* ОСНОВНИЙ КОНТЕЙНЕР */
        .main-container {
            flex-grow: 1;
            height: 100vh;
            padding: 3vh 4vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ============================================================
           СУЧАСНИЙ ЗАГОЛОВОК (БЕЗ ШАПКИ-БЛОКУ)
           ============================================================ */
        .menu-title {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vh, 4rem);
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            /* Стильний коричнево-золотистий градієнт для тексту */
            background: linear-gradient(135deg, #e6c8a0 0%, #c89666 50%, #9e6b38 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1vh;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* ============================================================
           СІТКА 3 ПО ГОРИЗОНТАЛІ
           ============================================================ */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 2.5vh 2.5vw;
            height: 68%;
        }

        /* 7-й елемент по центру знизу */
        .menu-bottom {
            height: 22%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .menu-bottom .menu-card {
            width: 32%; /* Ширина відповідає одній колонці сітки з 3-х */
        }

        /* ============================================================
           КАРТКА ТОВАРУ (ЗБІЛЬШЕНІ ФОТО, ЧИСТИЙ ДИЗАЙН)
           ============================================================ */
        .menu-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 1.5vh 1.5vw;
            gap: 1.5vw;
            height: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            background: #ffffff;
        }

        /* БІЛЬШІ ФОТОГРАФІЇ */
        .card-img {
            width: 22vh;
            height: 22vh;
            min-width: 130px;
            min-height: 130px;
            object-fit: contain;
            border-radius: 12px;
            background-color: transparent;
            padding: 2px;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        /* Текстовий блок */
        .card-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 1vh 0;
            min-width: 0;
        }

        /* Назва */
        .card-title {
            font-size: clamp(1.1rem, 2.4vh, 1.8rem);
            font-weight: 800;
            color: #2c1a0e;
            line-height: 1.25;
            word-wrap: break-word;
            white-space: normal;
        }

        /* Акцентна ціна */
        .card-price {
            background: linear-gradient(135deg, #4a2c11, #2d1808);
            color: #f1d5a5;
            font-size: clamp(1.2rem, 3vh, 2.2rem);
            font-weight: 800;
            padding: 0.6vh 1.4vw;
            border-radius: 10px;
            align-self: flex-start;
            box-shadow: 0 4px 12px rgba(45, 24, 8, 0.4);
        }

        /* ============================================================
           АДАПТИВНІСТЬ ДЛЯ МОБІЛЬНИХ ПРИСТРОЇВ
           ============================================================ */
        @media (max-width: 1024px) {
            html, body { 
                overflow: auto; 
                height: auto; 
            }
            .main-container { 
                height: auto; 
                padding: 20px 15px; 
            }
            .menu-grid { 
                grid-template-columns: 1fr; 
                grid-template-rows: auto; 
                height: auto; 
                gap: 15px; 
            }
            .menu-bottom { 
                height: auto; 
                margin-top: 15px; 
            }
            .menu-bottom .menu-card { 
                width: 100%; 
            }
            .menu-card { 
                flex-direction: column; 
                text-align: center; 
                padding: 20px; 
                height: auto; 
            }
            .card-img { 
                width: 160px; 
                height: 160px; 
            }
            .card-info {
                align-items: center;
                gap: 15px;
            }
            .card-price { 
                align-self: center; 
            }
        }
    </style>
</head>
<body>

    <main class="main-container">
        <!-- Оформлений заголовок меню -->
        <h1 class="menu-title">МЕНЮ</h1>

        <!-- Перші 6 карток (3 в ряд х 2 ряди) -->
        <div class="menu-grid" id="menuGrid">
            <div style="grid-column: 1/-1; text-align: center; color: #e6c8a0; padding: 20px; font-size: 1.2rem;">
                Завантаження меню...
            </div>
        </div>

        <!-- 7-ма картка (по центру знизу) -->
        <div class="menu-bottom" id="menuBottom">
            <!-- JS заповнить -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('menuGrid');
            const bottom = document.getElementById('menuBottom');
            const PLACEHOLDER = './images/0.png'; 

            fetch('./data/promotions.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    let items = (data.items || []).filter(item => 
                        (item.category || '').includes('кав\'ярня') && 
                        item.visible !== false
                    );

                    items = items.slice(0, 7);

                    if (items.length === 0) {
                        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #e6c8a0; font-size: 1.2rem;">У кав\'ярні поки що немає позицій</div>';
                        return;
                    }

                    // Шаблон картки без виробника та з більшим фото
                    const createCard = (item) => {
                        const priceInt = Math.floor(item.price);
                        const priceStr = item.price % 1 === 0 ? priceInt : item.price;

                        return `
                            <div class="menu-card">
                                <img src="${item.image}" alt="${item.name}" class="card-img" onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                                <div class="card-info">
                                    <div class="card-title">${item.name}</div>
                                    <div class="card-price">${priceStr} ₴</div>
                                </div>
                            </div>
                        `;
                    };

                    // Перші 6 позицій у сітку (3х2)
                    const topItems = items.slice(0, 6);
                    grid.innerHTML = topItems.map(item => createCard(item)).join('');

                    // 7-ма позиція по центру
                    if (items.length === 7) {
                        bottom.innerHTML = createCard(items[6]);
                    }
                })
                .catch(err => {
                    console.error(err);
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ff6b6b; font-size: 1.2rem;">Помилка завантаження меню</div>';
                });
        });
    </script>
</body>
</html>
