<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню кав'ярні | Ваш ПАРТНЕР</title>
    
    <!-- Шрифти -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           СКИДАННЯ ТА БАЗОВІ СТИЛІ (БЕЗ СКРОЛУ)
           ============================================================ */
        :root {
            --bg: #120c08;         /* Глибокий еспресо */
            --text: #f5ebe0;       /* Топлене молоко */
            --muted: #a68a75;
            --accent: #d4af37;     /* Золото */
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(212, 175, 55, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Забороняємо скрол */
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* ============================================================
           ЗАГОЛОВОК
           ============================================================ */
        header {
            height: 15vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, rgba(18, 12, 8, 0.8), var(--bg));
            flex-shrink: 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 6vh, 5rem);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text);
            line-height: 1;
            text-shadow: 0 5px 20px rgba(0,0,0,0.8);
            margin-bottom: 5px;
        }

        header p {
            font-size: clamp(0.7rem, 1.5vh, 1rem);
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.3em;
        }

        /* ============================================================
           КОНТЕЙНЕР МЕНЮ
           ============================================================ */
        main {
            flex-grow: 1;
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2vh 4vw;
            background: radial-gradient(circle at center, #1c130e 0%, #120c08 100%);
        }

        .menu-grid {
            display: grid;
            width: 100%;
            height: 100%;
            gap: 2vh 3vw;
            align-content: center;
            /* Колонки задаються через JS залежно від кількості товарів */
        }

        /* ============================================================
           КАРТКА ТОВАРУ
           ============================================================ */
        .menu-item {
            display: flex;
            align-items: center;
            gap: 1.5vw;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.5vh;
            padding: 1.5vh 2vw;
            transition: all 0.3s ease;
            min-height: 0; /* Щоб не розтягувало контейнер */
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .menu-img {
            height: 12vh;
            width: 12vh;
            min-height: 60px;
            min-width: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(212, 175, 55, 0.4);
            background-color: #222;
        }

        .menu-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .menu-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 0.5vh;
        }

        .menu-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1rem, 2.5vh, 1.6rem);
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .menu-dots {
            flex-grow: 1;
            border-bottom: 2px dotted rgba(212, 175, 55, 0.2);
            margin: 0 10px;
            position: relative;
            top: -5px;
        }

        .menu-price {
            font-size: clamp(1rem, 2.5vh, 1.6rem);
            font-weight: 600;
            color: var(--accent);
            white-space: nowrap;
        }

        .menu-desc {
            font-size: clamp(0.7rem, 1.5vh, 0.9rem);
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ============================================================
           АДАПТИВНІСТЬ
           ============================================================ */
        @media (max-width: 900px) {
            html, body { overflow: auto; } /* На мобільних дозволяємо скрол, якщо не влізе */
            main { height: auto; min-height: 85vh; padding: 20px; }
            .menu-grid { grid-template-columns: 1fr !important; gap: 15px; }
            .menu-item { padding: 15px; gap: 15px; }
            .menu-img { height: 70px; width: 70px; }
            h1 { font-size: 2.5rem; }
            .menu-name, .menu-price { font-size: 1.2rem; }
            .menu-dots { display: none; }
            .menu-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <header>
        <h1>МЕНЮ</h1>
        <p>Кава та авторські напої</p>
    </header>

    <main>
        <div class="menu-grid" id="menuGrid">
            <!-- Сюди JS вставить картки -->
            <div style="text-align:center; width:100%; color:var(--accent);">Завантаження меню...</div>
        </div>
    </main>

    <script>
        // Заглушка, якщо картинки немає
        const FALLBACK_IMG = "https://images.unsplash.com/photo-1497935586351-b67a49e012bf?q=80&w=300&auto=format&fit=crop";

        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('menuGrid');

            // Беремо дані з вашої бази
            fetch('./data/promotions.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    // Фільтруємо тільки кав'ярню і тільки ті, що показуються
                    const items = (data.items || []).filter(item => 
                        (item.category || '').includes('кав\'ярня') && 
                        item.visible !== false
                    );

                    if (items.length === 0) {
                        grid.innerHTML = '<div style="color:#fff; text-align:center; width:100%;">У кав\'ярні поки що немає позицій</div>';
                        return;
                    }

                    // --- РОЗУМНА СІТКА ---
                    // Якщо товарів мало (до 6) — 2 колонки (великі картки)
                    // Якщо середньо (до 12) — 3 колонки
                    // Якщо багато — 4 колонки (щоб все влізло в екран)
                    if (items.length <= 6) {
                        grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
                    } else if (items.length <= 12) {
                        grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
                    } else {
                        grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
                    }

                    grid.innerHTML = ''; // Очищаємо

                    items.forEach(item => {
                        // Використовуємо картинку з бази, якщо є, інакше - заглушку
                        const imgSrc = item.image ? item.image : FALLBACK_IMG;
                        
                        // Форматуємо ціну (прибираємо .00)
                        const priceInt = Math.floor(item.price);
                        const priceStr = item.price % 1 === 0 ? priceInt : item.price;

                        const card = document.createElement('div');
                        card.className = 'menu-item';
                        card.innerHTML = `
                            <img src="${imgSrc}" alt="${item.name}" class="menu-img" onerror="this.onerror=null; this.src='${FALLBACK_IMG}';">
                            <div class="menu-info">
                                <div class="menu-header">
                                    <span class="menu-name">${item.name}</span>
                                    <span class="menu-dots"></span>
                                    <span class="menu-price">${priceStr} ₴</span>
                                </div>
                                <p class="menu-desc">${item.manufacturer ? item.manufacturer : 'Свіжозварений напій'}</p>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error(err);
                    grid.innerHTML = '<div style="color:#e74c3c; text-align:center; width:100%;">Помилка завантаження бази даних</div>';
                });
        });
    </script>
</body>
</html>
