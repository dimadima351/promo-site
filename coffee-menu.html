<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню кав'ярні | Ваш ПАРТНЕР</title>

    <!-- Шрифти -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background:
                linear-gradient(
                    rgba(45, 25, 12, 0.78),
                    rgba(45, 25, 12, 0.78)
                ),
                url('./images/coffee-beans.jpg') center center / cover no-repeat fixed;

            display: flex;
            flex-direction: column;
        }

        /* ============================================================
           ШАПКА
           ============================================================ */

        .header {
            height: 14vh;
            min-height: 90px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #2b170d 0%,
                    #5a321d 50%,
                    #32190e 100%
                );

            border-bottom: 3px solid #c89b6d;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.45);

            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .header::before,
        .header::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 2px;
            background: #d7b08a;
            top: 50%;
            transform: translateY(-50%);
        }

        .header::before {
            left: 7%;
        }

        .header::after {
            right: 7%;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 6vh, 5rem);
            font-weight: 800;
            color: #fff7ed;

            letter-spacing: 0.18em;
            text-transform: uppercase;

            text-shadow:
                0 3px 8px rgba(0, 0, 0, 0.45);

            position: relative;
        }

        /* маленький декоративний елемент */
        .header h1::before,
        .header h1::after {
            content: "✦";
            font-family: Arial, sans-serif;
            font-size: 0.35em;
            color: #d7b08a;
            vertical-align: middle;
            margin: 0 20px;
        }

        /* ============================================================
           ОСНОВА
           ============================================================ */

        .main-container {
            flex: 1;
            min-height: 0;

            padding: 3vh 3vw;

            display: flex;
            flex-direction: column;
        }

        /* ============================================================
           СІТКА 3 Х 2
           ============================================================ */

        .menu-grid {
            width: 100%;
            height: 100%;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            grid-template-rows:
                repeat(2, minmax(0, 1fr));

            gap: 2.5vh 2vw;
        }

        /* ============================================================
           КАРТКА
           ============================================================ */

        .menu-card {
            min-width: 0;
            min-height: 0;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 252, 248, 0.98),
                    rgba(246, 235, 223, 0.98)
                );

            border-radius: 22px;

            border: 2px solid rgba(200, 155, 109, 0.65);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.30),
                inset 0 1px 0 rgba(255,255,255,0.8);

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: space-between;

            padding: 1.5vh 1.2vw;

            position: relative;
            overflow: hidden;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .menu-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 6px;

            background:
                linear-gradient(
                    90deg,
                    #4a2816,
                    #9b6339,
                    #4a2816
                );
        }

        .menu-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 14px 35px rgba(0, 0, 0, 0.38);
        }

        /* ============================================================
           ФОТО
           ============================================================ */

        .card-img-wrapper {
            width: 100%;
            flex: 1;

            min-height: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 1vh 0 0;
        }

        .card-img {
            width: 100%;
            height: 100%;

            max-width: 260px;
            max-height: 250px;

            object-fit: contain;

            filter:
                drop-shadow(0 12px 12px rgba(0,0,0,0.25));

            transition: transform 0.25s ease;
        }

        .menu-card:hover .card-img {
            transform: scale(1.04);
        }

        /* ============================================================
           ІНФОРМАЦІЯ
           ============================================================ */

        .card-info {
            width: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;

            text-align: center;

            flex-shrink: 0;

            padding: 0 0.5vw 0.8vh;
        }

        .card-title {
            width: 100%;

            font-family: 'Playfair Display', serif;

            font-size: clamp(1.1rem, 2.4vh, 2rem);

            font-weight: 800;

            line-height: 1.15;

            color: #3a2113;

            margin-bottom: 1vh;

            word-break: break-word;
        }

        /* ============================================================
           ЦІНА
           ============================================================ */

        .card-price {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 120px;

            padding: 0.7vh 1.5vw;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #4a2816,
                    #704426
                );

            color: #fff;

            font-size: clamp(1.2rem, 3vh, 2.3rem);

            font-weight: 800;

            box-shadow:
                0 5px 12px rgba(74, 40, 22, 0.35);

            border: 1px solid rgba(255,255,255,0.12);
        }

        /* ============================================================
           ПОВІДОМЛЕННЯ
           ============================================================ */

        .message {
            grid-column: 1 / -1;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #fff;

            font-size: 1.4rem;

            text-align: center;
        }

        /* ============================================================
           МОБІЛЬНА ВЕРСІЯ
           ============================================================ */

        @media (max-width: 900px) {

            html,
            body {
                height: auto;
                overflow: auto;
            }

            .header {
                height: 100px;
            }

            .header::before,
            .header::after,
            .header h1::before,
            .header h1::after {
                display: none;
            }

            .main-container {
                padding: 20px;
            }

            .menu-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                gap: 20px;
            }

            .menu-card {
                min-height: 420px;
            }

            .card-img {
                max-width: 300px;
                max-height: 300px;
            }
        }

        @media (min-width: 901px) and (max-height: 750px) {

            .header {
                height: 12vh;
            }

            .main-container {
                padding-top: 2vh;
                padding-bottom: 2vh;
            }

            .menu-grid {
                gap: 1.5vh 1.5vw;
            }

            .card-title {
                margin-bottom: 0.5vh;
            }

            .card-price {
                padding-top: 0.4vh;
                padding-bottom: 0.4vh;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>МЕНЮ</h1>
    </header>

    <main class="main-container">

        <div class="menu-grid" id="menuGrid">

            <div class="message">
                Завантаження меню...
            </div>

        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const grid = document.getElementById('menuGrid');

            const PLACEHOLDER = './images/0.png';

            fetch('./data/promotions.json?t=' + Date.now())

                .then(res => res.json())

                .then(data => {

                    let items = (data.items || [])
                        .filter(item =>
                            (item.category || '').includes('кав\'ярня') &&
                            item.visible !== false
                        );

                    /*
                     * Максимум 6 позицій:
                     * 3 по горизонталі × 2 ряди
                     */
                    items = items.slice(0, 6);

                    if (items.length === 0) {

                        grid.innerHTML = `
                            <div class="message">
                                У кав'ярні поки що немає позицій
                            </div>
                        `;

                        return;
                    }

                    const createCard = (item) => {

                        const price = Number(item.price);

                        const priceStr =
                            Number.isInteger(price)
                                ? price
                                : price.toFixed(2);

                        return `
                            <div class="menu-card">

                                <div class="card-img-wrapper">

                                    <img
                                        src="${item.image}"
                                        alt="${item.name}"
                                        class="card-img"

                                        onerror="
                                            this.onerror=null;
                                            this.src='${PLACEHOLDER}';
                                        "
                                    >

                                </div>

                                <div class="card-info">

                                    <div class="card-title">
                                        ${item.name}
                                    </div>

                                    <div class="card-price">
                                        ${priceStr} ₴
                                    </div>

                                </div>

                            </div>
                        `;
                    };

                    grid.innerHTML =
                        items.map(createCard).join('');

                })

                .catch(err => {

                    console.error(err);

                    grid.innerHTML = `
                        <div class="message">
                            Помилка завантаження меню
                        </div>
                    `;

                });

        });
    </script>

</body>
</html>
