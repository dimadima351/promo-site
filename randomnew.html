            </div>

            <!-- ГОДИННИК (тільки ГГ:ХХ) -->
            <div class="promo-clock">
                <div class="promo-clock-time" id="clockTime">--:--</div>
            </div>

            <div class="promo-dates" id="promoDates">Акційна пропозиція діє...</div>
        </header>

        <main class="random-main">
            <div class="random-container" id="randomContainer">
                <p class="random-loading">Завантаження...</p>
            </div>
        </main>

        <div class="fullscreen-hint" id="fullscreenHint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
            <span>Клікніть будь-де для повного екрану</span>
        </div>
    </div>

    <!-- ФАЗА 2: ВІДЕО КАВА -->
    <div class="phase phase-video" id="phaseVideo">
        <video id="introVideoEl" src="./image_site/_000.mp4" autoplay muted playsinline preload="auto"></video>
        <button class="skip-btn" id="skipVideoBtn">Пропустити →</button>
    </div>

    <!-- ФАЗА 3: КАВ'ЯРНЯ-МЕНЮ -->
    <div class="phase phase-menu" id="phaseMenu">
        <img src="./image_site/0.png" alt="Логотип" class="header-logo" onerror="this.style.display='none';">
        <h1 class="title"><span>МЕНЮ</span></h1>
        <main class="main-container">
            <div class="menu-grid" id="menuGrid"></div>
        </main>
    </div>

    <!-- ФАЗА 4: ВІДЕО site.mp4 -->
    <div class="phase phase-video" id="phaseVideo2">
        <video id="siteVideoEl" src="./image_site/site.mp4" autoplay muted playsinline preload="auto"></video>
    </div>

    <!-- ОВЕРЛЕЙ: ХВИЛИНА МОВЧАННЯ -->
    <div class="silence-overlay" id="silenceOverlay">
        <div class="silence-inner">
            <div class="silence-badge">09:00</div>
            <div class="silence-title">Національна хвилина мовчання</div>
            <div class="silence-subtitle">Схилімо голови у скорботі</div>
            <div class="silence-progress">
                <div class="silence-progress-bar" id="silenceBar"></div>
            </div>
            <div class="silence-countdown"><span id="silenceSeconds">180</span> секунд</div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        /* ============================================================
           КОНСТАНТИ
           ============================================================ */
        const PLACEHOLDER = './images/0.png';
        const KYIV_TZ = 'Europe/Kyiv';

        const PHASE_PROMO  = 'promo';
        const PHASE_VIDEO  = 'video';
        const PHASE_MENU   = 'menu';
        const PHASE_VIDEO2 = 'video2';

        const PROMO_SEQUENCE = [
            'single', 'double', 'grid', 'pair', 'singleBest',
            'single', 'single', 'doubleRandom', 'doubleRandom',
            'mega'   // ← НОВИЙ слайд "МЕГА ЦІНА" (останній)
        ];

        const PROMO_SLIDE_DURATION = 10000;
        const PROMO_TOTAL_SLIDES   = PROMO_SEQUENCE.length;
        const MENU_DURATION        = 20000;

        /* ---- ХВИЛИНА МОВЧАННЯ: 08:59 → 09:02 (3 хвилини) ---- */
        const SILENCE_START_HOUR   = 8;
        const SILENCE_START_MINUTE = 59;
        const SILENCE_DURATION_MS  = 180000; // 3 хвилини = 180 секунд

        let currentPhase = null;
        let promoSlideIndex = 0;

        let allItems    = [];
        let bestItems   = [];
        let coffeeItems = [];
        let dataLoaded  = false;
        let dataError   = false;

        let usedIds = new Set();
        let lastSingleId = null;

        let promoRotationId      = null;
        let videoFallbackTimeout = null;
        let video2FallbackTimeout = null;
        let menuEntranceTimeout  = null;
        let menuExitTimeout      = null;
        let pulseStartTimeout    = null;
        let pulseIntervalId      = null;
        let bounceTimer1 = null;
        let bounceTimer2 = null;

        /* ============================================================
           ЧАСОВІ ПОЯСИ / DST / ГОДИННИК
           ============================================================ */
        function getKyivParts(date) {
            date = date || new Date();
            const fmt = new Intl.DateTimeFormat('en-GB', {
                timeZone: KYIV_TZ,
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: false
            });
            const parts = fmt.formatToParts(date);
            const g = t => parts.find(p => p.type === t)?.value || '0';
            return {
                year:   parseInt(g('year'), 10),
                month:  parseInt(g('month'), 10),
                day:    parseInt(g('day'), 10),
                hour:   parseInt(g('hour'), 10) % 24,
                minute: parseInt(g('minute'), 10),
                second: parseInt(g('second'), 10)
            };
        }

        function getKyivOffsetHours(date) {
            date = date || new Date();
            const k = getKyivParts(date);
            const asUTC = Date.UTC(k.year, k.month - 1, k.day, k.hour, k.minute, k.second);
            return Math.round((asUTC - date.getTime()) / 3600000);
        }

        /* Годинник — тільки ГГ:ХХ, оновлюється при зміні хвилини */
        let lastClockStr = '';

        function updateClock() {
            const k = getKyivParts();
            const pad = n => String(n).padStart(2, '0');
            const timeStr = `${pad(k.hour)}:${pad(k.minute)}`;

            if (timeStr !== lastClockStr) {
                lastClockStr = timeStr;
                const timeEl = document.getElementById('clockTime');
                if (timeEl) timeEl.textContent = timeStr;
            }
        }

        function tickClock() {
            updateClock();
            const now = new Date();
            const k = getKyivParts(now);
            const msToNextMinute = (60 - k.second) * 1000 - (now.getMilliseconds());
            setTimeout(tickClock, Math.max(500, msToNextMinute));
        }

        /* ============================================================
           ХВИЛИНА МОВЧАННЯ: 08:59 → 09:02
           ============================================================ */
        function msUntilNextSilenceStart() {
            const now = new Date();
            const k = getKyivParts(now);
            const offset = getKyivOffsetHours(now);

            let targetMs = Date.UTC(
                k.year, k.month - 1, k.day,
                SILENCE_START_HOUR, SILENCE_START_MINUTE, 0
            ) - offset * 3600000;

            const kTarget = getKyivParts(new Date(targetMs));
            if (kTarget.hour !== SILENCE_START_HOUR || kTarget.minute !== SILENCE_START_MINUTE) {
                for (const adj of [-3600000, 3600000]) {
                    const t = getKyivParts(new Date(targetMs + adj));
                    if (t.hour === SILENCE_START_HOUR && t.minute === SILENCE_START_MINUTE) {
                        targetMs += adj;
                        break;
                    }
                }
            }

            let diff = targetMs - now.getTime();
            if (diff <= 0) diff += 24 * 3600000;
            return diff;
        }

        function showSilence(durationMs) {
            const overlay = document.getElementById('silenceOverlay');
            if (!overlay) return;

            const secondsEl = document.getElementById('silenceSeconds');
            const barEl = document.getElementById('silenceBar');

            let remaining = Math.ceil(durationMs / 1000);
            if (secondsEl) secondsEl.textContent = Math.max(0, remaining);

            if (barEl) {
                barEl.style.animation = 'none';
                void barEl.offsetWidth;
                barEl.style.animationName = 'silenceProgress';
                barEl.style.animationDuration = (durationMs / 1000) + 's';
                barEl.style.animationTimingFunction = 'linear';
                barEl.style.animationFillMode = 'forwards';
            }

            overlay.classList.add('active');

            const tickId = setInterval(() => {
                remaining--;
                if (secondsEl) secondsEl.textContent = Math.max(0, remaining);
                if (remaining <= 0) {
                    clearInterval(tickId);
                    overlay.classList.remove('active');
                }
            }, 1000);
        }

        function scheduleNextSilence() {
            const ms = msUntilNextSilenceStart();
            setTimeout(() => {
                showSilence(SILENCE_DURATION_MS);
                scheduleNextSilence();
            }, ms);
        }

        function initSilence() {
            const k = getKyivParts();
            const nowMin = k.hour * 60 + k.minute;
            const startMin = SILENCE_START_HOUR * 60 + SILENCE_START_MINUTE;
            const endMin = startMin + 3;

            if (nowMin >= startMin && nowMin < endMin) {
                const elapsedMs = (nowMin - startMin) * 60000 + k.second * 1000;
                const remaining = SILENCE_DURATION_MS - elapsedMs;
                if (remaining > 0) showSilence(remaining);
            }
            scheduleNextSilence();
        }

        /* ============================================================
           УТИЛІТИ
           ============================================================ */
        function noCache(url) {
            const sep = url.includes('?') ? '&' : '?';
            return url + sep + 't=' + Date.now();
        }

        function isDesktop() { return window.innerWidth > 900; }

        function formatDates() {
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth();
            const start = new Date(y, m, 1);
            const end = new Date(y, m + 1, 0);
            const pad = n => String(n).padStart(2, '0');
            const fmt = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
            return `з ${fmt(start)} - ${fmt(end)}`;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function priceParts(raw) {
            const num = Number(raw ?? 0);
            const int = Math.floor(num);
            const cents = Math.round((num - int) * 100).toString().padStart(2, '0');
            return { int, cents };
        }

        function isChampagneFraGuli(item) {
            const name = (item.name || '').toLowerCase();
            const man  = (item.manufacturer || '').toLowerCase();
            const both = name + ' ' + man;
            if (both.includes('шампанськ')) return true;
            if (both.includes('фра') && both.includes('гулі')) return true;
            if (both.includes('fra') && both.includes('guli')) return true;
            if (both.includes('fra') && both.includes('gouli')) return true;
            return false;
        }

        function markUsed(items) {
            items.forEach(it => usedIds.add(it.id));
        }

        function pickItemsPreferUnused(pool, count) {
            if (pool.length === 0) return [];

            let unused = pool.filter(it => !usedIds.has(it.id));
            if (unused.length === 0) {
                usedIds.clear();
                unused = [...pool];
            }

            const shuffledUnused = shuffle(unused);
            const shuffledUsed = shuffle(pool.filter(it => usedIds.has(it.id)));

            const picked = [];
            for (const it of shuffledUnused) {
                if (picked.length >= count) break;
                picked.push(it);
            }
            for (const it of shuffledUsed) {
                if (picked.length >= count) break;
                picked.push(it);
            }

            markUsed(picked);
            return picked;
        }

        function pickSingleForPromo() {
            if (allItems.length === 0) return null;
            let candidates = allItems.filter(it => !usedIds.has(it.id));
            if (candidates.length === 0) {
                usedIds.clear();
                candidates = [...allItems];
            }
            if (candidates.length > 1 && lastSingleId !== null) {
                const filtered = candidates.filter(it => it.id !== lastSingleId);
                if (filtered.length > 0) candidates = filtered;
            }
            const item = candidates[Math.floor(Math.random() * candidates.length)];
            usedIds.add(item.id);
            lastSingleId = item.id;
            return item;
        }

        function pickSingleBest() {
            if (bestItems.length === 0) return null;
            let candidates = bestItems.filter(it => !usedIds.has(it.id));
            if (candidates.length === 0) candidates = [...bestItems];
            const item = candidates[Math.floor(Math.random() * candidates.length)];
            usedIds.add(item.id);
            return item;
        }

        function pickSameCategory2() {
            const groups = {};
            allItems.forEach(it => {
                const cat = it.category || 'Інше';
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(it);
            });
            const validCats = shuffle(Object.keys(groups).filter(c => groups[c].length >= 2));
            if (validCats.length === 0) return pickItemsPreferUnused(allItems, 2);

            for (const cat of validCats) {
                const unused = groups[cat].filter(it => !usedIds.has(it.id));
                if (unused.length >= 2) {
                    const picked = shuffle(unused).slice(0, 2);
                    markUsed(picked);
                    return picked;
                }
            }
            return pickItemsPreferUnused(allItems, 2);
        }

        function pickSameCategory4() {
            const groups = {};
            allItems.forEach(it => {
                const cat = it.category || 'Інше';
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(it);
            });
            const validCats = shuffle(Object.keys(groups).filter(c => groups[c].length >= 4));
            if (validCats.length === 0) return pickItemsPreferUnused(allItems, 4);

            for (const cat of validCats) {
                const unused = groups[cat].filter(it => !usedIds.has(it.id));
                if (unused.length >= 4) {
                    const picked = shuffle(unused).slice(0, 4);
                    markUsed(picked);
                    return picked;
                }
            }
            for (const cat of validCats) {
                const picked = pickItemsPreferUnused(groups[cat], 4);
                if (picked.length === 4) return picked;
            }
            return pickItemsPreferUnused(allItems, 4);
        }

        function pickPairSameNameOrManufacturer() {
            const byName = {};
            allItems.forEach(it => {
                const key = (it.name || '').trim().toLowerCase();
                if (!key) return;
                if (!byName[key]) byName[key] = [];
                byName[key].push(it);
            });
            const nameGroups = shuffle(Object.values(byName).filter(g => g.length >= 2));
            for (const group of nameGroups) {
                const unused = group.filter(it => !usedIds.has(it.id));
                if (unused.length >= 2) {
                    const picked = shuffle(unused).slice(0, 2);
                    markUsed(picked);
                    return picked;
                }
            }

            const byMan = {};
            allItems.forEach(it => {
                const key = (it.manufacturer || '').trim().toLowerCase();
                if (!key) return;
                if (!byMan[key]) byMan[key] = [];
                byMan[key].push(it);
            });
            const manGroups = shuffle(Object.values(byMan).filter(g => g.length >= 2));
            for (const group of manGroups) {
                const unused = group.filter(it => !usedIds.has(it.id));
                if (unused.length >= 2) {
                    const picked = shuffle(unused).slice(0, 2);
                    markUsed(picked);
                    return picked;
                }
            }
            return pickItemsPreferUnused(allItems, 2);
        }

        function pickRandom2() {
            return pickItemsPreferUnused(allItems, 2);
        }

        /* Для MEGA — пріоритет bestPrice, потім звичайні */
        function pickMegaItem() {
            let pool = bestItems.length > 0 ? bestItems : allItems;
            if (pool.length === 0) return null;
            let candidates = pool.filter(it => !usedIds.has(it.id));
            if (candidates.length === 0) {
                usedIds.clear();
                candidates = [...pool];
            }
            const item = candidates[Math.floor(Math.random() * candidates.length)];
            usedIds.add(item.id);
            return item;
        }

        /* ============================================================
           ТАЙМЕРИ
           ============================================================ */
        function clearPhaseTimers() {
            if (promoRotationId)      { clearInterval(promoRotationId); promoRotationId = null; }
            if (videoFallbackTimeout) { clearTimeout(videoFallbackTimeout); videoFallbackTimeout = null; }
            if (video2FallbackTimeout){ clearTimeout(video2FallbackTimeout); video2FallbackTimeout = null; }
            if (menuEntranceTimeout)  { clearTimeout(menuEntranceTimeout); menuEntranceTimeout = null; }
            if (menuExitTimeout)      { clearTimeout(menuExitTimeout); menuExitTimeout = null; }
            if (pulseStartTimeout)    { clearTimeout(pulseStartTimeout); pulseStartTimeout = null; }
            if (pulseIntervalId)      { clearInterval(pulseIntervalId); pulseIntervalId = null; }
            if (bounceTimer1)         { clearTimeout(bounceTimer1); bounceTimer1 = null; }
            if (bounceTimer2)         { clearTimeout(bounceTimer2); bounceTimer2 = null; }

            const title = document.querySelector('.phase-menu .title');
            if (title) title.classList.remove('pulse');
        }

        /* ============================================================
           ПЕРЕМИКАННЯ ФАЗ
           ============================================================ */
        function switchToPhase(phase) {
            if (currentPhase === phase) return;

            if (currentPhase === PHASE_VIDEO) {
                const v = document.getElementById('introVideoEl');
                if (v) { try { v.pause(); v.currentTime = 0; } catch (e) {} }
            }
            if (currentPhase === PHASE_VIDEO2) {
                const v = document.getElementById('siteVideoEl');
                if (v) { try { v.pause(); v.currentTime = 0; } catch (e) {} }
            }

            clearPhaseTimers();

            document.querySelectorAll('.phase').forEach(p => p.classList.remove('active'));
            currentPhase = phase;

            if (phase === PHASE_PROMO) {
                document.getElementById('phasePromo').classList.add('active');
                enterPromoPhase();
            } else if (phase === PHASE_VIDEO) {
                document.getElementById('phaseVideo').classList.add('active');
                enterVideoPhase();
            } else if (phase === PHASE_MENU) {
                enterMenuPhase();
            } else if (phase === PHASE_VIDEO2) {
                document.getElementById('phaseVideo2').classList.add('active');
                enterVideo2Phase();
            }
        }

        /* ============================================================
           ФАЗА 1: ПРОМО
           ============================================================ */
        function enterPromoPhase() {
            promoSlideIndex = 0;
            lastSingleId = null;

            renderPromoSlide(promoSlideIndex);

            promoRotationId = setInterval(() => {
                promoSlideIndex++;
                if (promoSlideIndex >= PROMO_TOTAL_SLIDES) {
                    switchToPhase(PHASE_VIDEO);
                    return;
                }
                renderPromoSlide(promoSlideIndex);
            }, PROMO_SLIDE_DURATION);
        }

        function renderPromoSlide(index) {
            const container = document.getElementById('randomContainer');
            const phasePromo = document.getElementById('phasePromo');
            const mode = PROMO_SEQUENCE[index];

            if (!dataLoaded) {
                if (container.querySelector('.random-loading')) return;
                container.innerHTML = '<p class="random-loading">Завантаження...</p>';
                return;
            }
            if (dataError) {
                container.innerHTML = '<p class="random-loading">Помилка завантаження</p>';
                return;
            }
            if (allItems.length === 0 && bestItems.length === 0) {
                container.innerHTML = '<p class="random-loading">Немає товарів</p>';
                return;
            }

            let html = '';

            if (mode === 'single') {
                const item = pickSingleForPromo();
                if (item) html = renderSingle(item);
            } else if (mode === 'double') {
                const items = pickSameCategory2();
                if (items.length) html = renderDouble(items);
            } else if (mode === 'grid') {
                const items = pickSameCategory4();
                if (items.length) html = renderGrid(items);
            } else if (mode === 'pair') {
                const items = pickPairSameNameOrManufacturer();
                if (items.length) html = renderDouble(items);
            } else if (mode === 'singleBest') {
                const item = pickSingleBest();
                if (item) html = renderSingle(item);
                else {
                    const fb = pickSingleForPromo();
                    if (fb) html = renderSingle(fb);
                }
            } else if (mode === 'doubleRandom') {
                const items = pickRandom2();
                if (items.length) html = renderDouble(items);
            } else if (mode === 'mega') {
                html = renderMega();
            }

            container.innerHTML = html;

            // Клас mega-mode для повноекранного показу
            if (mode === 'mega') {
                phasePromo.classList.add('mega-mode');
                container.classList.remove('fade-in');
            } else {
                phasePromo.classList.remove('mega-mode');
                container.classList.remove('fade-in');
                void container.offsetWidth;
                container.classList.add('fade-in');
            }

            scheduleBounce();
        }

        function renderSingle(item) {
            const { int, cents } = priceParts(item.price);
            const oldPrice = item.oldPrice ? Math.round(Number(item.oldPrice)) : '';
            const imgSrc = noCache(item.image);
            return `
                <div class="mode-single">
                    <div class="img-wrap">
                        ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
                        ${item.bestPrice ? `<img src="./image_site/photo.png" alt="Найспрайс" class="best-price-icon" onerror="this.style.display='none';">` : ''}
                        <img src="${imgSrc}" alt="${item.name}" class="main-img" onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                    </div>
                    <div class="info">
                        ${item.manufacturer ? `<div class="manufacturer">${item.manufacturer}</div>` : ''}
                        <h1 class="name">${item.name}</h1>
                        <div class="prices">
                            ${oldPrice ? `<div class="old-price">${oldPrice} ₴</div>` : ''}
                            <div class="new-price">
                                <span class="price-int">${int}</span>
                                <span class="price-cents-wrap">
                                    <span class="price-cents">${cents}</span>
                                    <span class="price-unit">грн/шт</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDouble(items) {
            return `<div class="mode-double">${items.map(item => {
                const { int, cents } = priceParts(item.price);
                const oldPrice = item.oldPrice ? Math.round(Number(item.oldPrice)) : '';
                const imgSrc = noCache(item.image);
                return `
                    <div class="double-card">
                        <div class="img-wrap">
                            ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
                            ${item.bestPrice ? `<img src="./image_site/photo.png" alt="Найспрайс" class="best-price-icon" onerror="this.style.display='none';">` : ''}
                            <img src="${imgSrc}" alt="${item.name}" class="main-img" onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                        </div>
                        <div class="info">
                            ${item.manufacturer ? `<div class="manufacturer">${item.manufacturer}</div>` : ''}
                            <div class="name">${item.name}</div>
                            <div class="prices">
                                ${oldPrice ? `<div class="old-price">${oldPrice} ₴</div>` : ''}
                                <div class="new-price">
                                    <span class="price-int">${int}</span>
                                    <span class="price-cents-wrap">
                                        <span class="price-cents">${cents}</span>
                                        <span class="price-unit">грн/шт</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('')}</div>`;
        }

        function renderGrid(items) {
            return `<div class="mode-grid">${items.map(item => {
                const { int, cents } = priceParts(item.price);
                const oldPrice = item.oldPrice ? Math.round(Number(item.oldPrice)) : '';
                const imgSrc = noCache(item.image);
                return `
                    <div class="grid-card">
                        <div class="img-wrap">
                            ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
                            ${item.bestPrice ? `<img src="./image_site/photo.png" alt="Найспрайс" class="best-price-icon" onerror="this.style.display='none';">` : ''}
                            <img src="${imgSrc}" alt="${item.name}" class="main-img" onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                        </div>
                        <div class="info">
                            ${item.manufacturer ? `<div class="manufacturer">${item.manufacturer}</div>` : ''}
                            <div class="name">${item.name}</div>
                            <div class="prices">
                                ${oldPrice ? `<div class="old-price">${oldPrice} ₴</div>` : ''}
                                <div class="new-price">
                                    <span class="price-int">${int}</span>
                                    <span class="price-cents-wrap">
                                        <span class="price-cents">${cents}</span>
                                        <span class="price-unit">грн/шт</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('')}</div>`;
        }

        /* ============================================================
           MEGA СЛАЙД
           ============================================================ */
        function renderMega() {
            const item = pickMegaItem();
            if (!item) return '<p class="random-loading">Немає товарів</p>';

            const { int, cents } = priceParts(item.price);
            const oldPriceNum = item.oldPrice ? Number(item.oldPrice) : 0;
            const newPriceNum = Number(item.price || 0);
            const imgSrc = noCache(item.image);

            let discountPercent = 0;
            if (item.discount != null && item.discount !== '') {
                const d = Math.abs(Number(item.discount));
                if (!isNaN(d) && d > 0 && d <= 100) discountPercent = Math.round(d);
            }
            if (discountPercent === 0 && oldPriceNum > newPriceNum && newPriceNum > 0) {
                discountPercent = Math.round((1 - newPriceNum / oldPriceNum) * 100);
            }

            const hasOldPrice = oldPriceNum > newPriceNum && oldPriceNum > 0;
            const oldPriceHtml = hasOldPrice
                ? `<div class="mega-old-price">${Math.round(oldPriceNum)} ₴</div>`
                : '';
            const discountHtml = discountPercent > 0
                ? `<div class="mega-discount-badge">−${discountPercent}%<span class="label">ЗНИЖКА</span></div>`
                : '';
            const manufacturerHtml = item.manufacturer
                ? `<div class="mega-manufacturer">${item.manufacturer}</div>`
                : '';

            return `
                <div class="mega-slide">
                    <div class="mega-left">
                        <div class="mega-product-area">
                            <div class="mega-product-wrap">
                                <div class="mega-product-square">
                                    <img src="${imgSrc}" alt="${item.name}" class="mega-product-img"
                                         onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                                </div>
                            </div>
                            ${discountHtml}
                        </div>
                    </div>
                    <div class="mega-right">
                        <div class="mega-top">
                            <div class="mega-title">МЕГА ЦІНА</div>
                            ${manufacturerHtml}
                            <div class="mega-name">${item.name}</div>
                        </div>
                        <div class="mega-bottom">
                            ${oldPriceHtml}
                            <div class="mega-new-price">
                                <span class="mega-price-int">${int}</span>
                                <span class="mega-price-cents-wrap">
                                    <span class="mega-price-cents">${cents}</span>
                                    <span class="mega-price-unit">грн/шт</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function triggerPriceBounce() {
            if (currentPhase !== PHASE_PROMO) return;
            document.querySelectorAll('.new-price').forEach(el => {
                el.classList.remove('bounce-animate');
                void el.offsetWidth;
                el.classList.add('bounce-animate');
            });
        }

        function scheduleBounce() {
            if (bounceTimer1) clearTimeout(bounceTimer1);
            if (bounceTimer2) clearTimeout(bounceTimer2);
            bounceTimer1 = setTimeout(triggerPriceBounce, 3000);
            bounceTimer2 = setTimeout(triggerPriceBounce, 7000);
        }

        /* ============================================================
           ФАЗА 2: ВІДЕО КАВА
           ============================================================ */
        function enterVideoPhase() {
            const video = document.getElementById('introVideoEl');
            if (!video) { switchToPhase(PHASE_MENU); return; }

            try { video.currentTime = 0; } catch (e) {}
            video.muted = true;

            const onEnded = () => {
                video.removeEventListener('ended', onEnded);
                if (currentPhase === PHASE_VIDEO) switchToPhase(PHASE_MENU);
            };
            video.addEventListener('ended', onEnded);

            videoFallbackTimeout = setTimeout(() => {
                if (currentPhase === PHASE_VIDEO) switchToPhase(PHASE_MENU);
            }, 15000);

            video.play().catch(() => {});
        }

        /* ============================================================
           ФАЗА 3: МЕНЮ
           ============================================================ */
        function enterMenuPhase() {
            const phaseMenu = document.getElementById('phaseMenu');
            const grid = document.getElementById('menuGrid');

            phaseMenu.classList.remove('active');
            grid.innerHTML = '';

            if (coffeeItems.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #fff; padding: 40px; font-size: 1.4rem;">У кав\'ярні поки що немає позицій</div>';
                phaseMenu.classList.add('active');
                menuExitTimeout = setTimeout(() => switchToPhase(PHASE_VIDEO2), MENU_DURATION);
                return;
            }

            coffeeItems.forEach((item, index) => {
                const priceInt = Math.floor(item.price);
                const priceStr = item.price % 1 === 0 ? priceInt : item.price;
                const delay = 0.85 + index * 0.15;
                const imgSrc = noCache(item.image);

                const cardHTML = `
                    <div class="menu-card" style="animation-delay: ${delay}s">
                        <div class="card-img-wrapper">
                            <img src="${imgSrc}" alt="${item.name}" class="card-img"
                                 onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                            <div class="card-price">${priceStr} ₴</div>
                        </div>
                        <div class="card-info">
                            <div class="card-title">${item.name}</div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });

            const cards = Array.from(grid.querySelectorAll('.menu-card'));

            const total = cards.length;
            const remainder = total % 3;
            if (remainder === 1 && total > 1) {
                cards[total - 1].classList.add('center-single');
            } else if (remainder === 2) {
                cards[total - 2].classList.add('center-pair-left');
                cards[total - 1].classList.add('center-pair-right');
            }

            void phaseMenu.offsetWidth;
            phaseMenu.classList.add('active');

            const entranceEndMs = (0.85 + (total - 1) * 0.15 + 0.75) * 1000 + 100;
            menuEntranceTimeout = setTimeout(() => {
                cards.forEach(c => c.classList.add('appeared'));
                startMenuPulseLoop(cards);
            }, entranceEndMs);

            menuExitTimeout = setTimeout(() => switchToPhase(PHASE_VIDEO2), MENU_DURATION);
        }

        function startMenuPulseLoop(cards) {
            const title = document.querySelector('.phase-menu .title');
            const PER_CARD_DELAY = 180;
            const PULSE_DURATION = 900;

            function runPulse() {
                if (currentPhase !== PHASE_MENU) return;
                if (title) title.classList.add('pulse');
                cards.forEach((card, i) => {
                    setTimeout(() => {
                        if (currentPhase !== PHASE_MENU) return;
                        card.classList.add('pulse');
                        const price = card.querySelector('.card-price');
                        if (price) price.classList.add('pulse-price');
                    }, i * PER_CARD_DELAY);
                });
                const totalTime = (cards.length - 1) * PER_CARD_DELAY + PULSE_DURATION;
                setTimeout(() => {
                    if (title) title.classList.remove('pulse');
                    cards.forEach(card => {
                        card.classList.remove('pulse');
                        const price = card.querySelector('.card-price');
                        if (price) price.classList.remove('pulse-price');
                    });
                }, totalTime);
            }

            pulseStartTimeout = setTimeout(() => {
                if (currentPhase !== PHASE_MENU) return;
                runPulse();
                pulseIntervalId = setInterval(runPulse, 10000);
            }, 900);
        }

        /* ============================================================
           ФАЗА 4: ВІДЕО site.mp4
           ============================================================ */
        function enterVideo2Phase() {
            const video = document.getElementById('siteVideoEl');
            if (!video) { switchToPhase(PHASE_PROMO); return; }

            try { video.currentTime = 0; } catch (e) {}
            video.muted = true;

            const onEnded = () => {
                video.removeEventListener('ended', onEnded);
                if (currentPhase === PHASE_VIDEO2) switchToPhase(PHASE_PROMO);
            };
            video.addEventListener('ended', onEnded);

            video2FallbackTimeout = setTimeout(() => {
                if (currentPhase === PHASE_VIDEO2) switchToPhase(PHASE_PROMO);
            }, 20000);

            video.play().catch(() => {});
        }

        /* ============================================================
           FULLSCREEN
           ============================================================ */
        function toggleFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement) {
                const req = el.requestFullscreen
                    || el.webkitRequestFullscreen
                    || el.mozRequestFullScreen
                    || el.msRequestFullscreen;
                if (req) {
                    req.call(el).then(() => {
                        document.getElementById('fullscreenHint').classList.add('hidden');
                    }).catch(() => {});
                }
            }
        }

        if (isDesktop()) {
            document.addEventListener('click', function handleFirstClick(e) {
                if (document.fullscreenElement) return;
                if (e.target && e.target.id === 'skipVideoBtn') return;
                toggleFullscreen();
                document.removeEventListener('click', handleFirstClick);
            }, { once: true });
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.getElementById('fullscreenHint').classList.remove('hidden');
            }
        });

        document.getElementById('skipVideoBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentPhase === PHASE_VIDEO) switchToPhase(PHASE_MENU);
        });

        /* ============================================================
           ІНІЦІАЛІЗАЦІЯ
           ============================================================ */
        document.getElementById('promoDates').textContent =
            'Акційна пропозиція діє ' + formatDates();

        tickClock();
        initSilence();
        switchToPhase(PHASE_PROMO);

        fetch(noCache('./data/promotions.json'))
            .then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
            .then(data => {
                const raw = (data.items || []).filter(it => {
                    if (it.visible === false) return false;
                    if (it.outOfStock === true) return false;
                    if (isChampagneFraGuli(it)) return false;
                    return true;
                });

                coffeeItems = raw.filter(it =>
                    (it.category || '').includes('кав\'ярня')
                ).slice(0, 9);

                allItems = raw.filter(it => {
                    const cat = (it.category || '').toLowerCase();
                    if (cat.includes('ярня')) return false;
                    return true;
                });
                bestItems = allItems.filter(it => it.bestPrice === true);

                dataLoaded = true;

                if (currentPhase === PHASE_PROMO) {
                    renderPromoSlide(promoSlideIndex);
                }
            })
            .catch(err => {
                console.error('Помилка завантаження:', err);
                dataLoaded = true;
                dataError = true;
                if (currentPhase === PHASE_PROMO) renderPromoSlide(promoSlideIndex);
            });

    })();
    </script>
</body>
</html>
