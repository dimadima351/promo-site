<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ваш ПАРТНЕР | Слайд-шоу</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #333;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            cursor: pointer;
        }

        /* ============================================================
           ФАЗИ
           ============================================================ */
        .phase {
            position: fixed;
            inset: 0;
            display: none;
            overflow: hidden;
        }
        .phase.active {
            display: flex;
            flex-direction: column;
        }
        .phase-video { background: #000; }
        .phase-promo { background: #fff; cursor: pointer; }
        .phase-menu  {
            background: linear-gradient(rgba(18, 12, 8, 0.85), rgba(18, 12, 8, 0.85)),
                        url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?q=80&w=1920&auto=format&fit=crop') center/cover fixed no-repeat;
            cursor: default;
        }

        /* ============================================================
           ФАЗА 1: ПРОМО + ГОДИННИК
           ============================================================ */
        .promo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: clamp(10px, 1.5vh, 20px);
            padding: clamp(8px, 1.2vh, 14px) clamp(20px, 2.5vw, 40px);
            background: linear-gradient(135deg, #ff2b2b, #d90000);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255, 11, 11, 0.25);
            z-index: 100;
            flex-shrink: 0;
        }
        .promo-logo { display: flex; align-items: center; gap: clamp(8px, 1vw, 14px); flex-shrink: 1; min-width: 0; }
        .promo-logo img { height: clamp(30px, 4.5vh, 54px); width: auto; object-fit: contain; display: block; flex-shrink: 0; }
        .promo-logo-text {
            font-size: clamp(16px, 3vh, 28px);
            font-weight: 800;
            letter-spacing: clamp(0.5px, 0.15vw, 2px);
            text-transform: uppercase;
            line-height: 1;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* ---- ГОДИННИК (компактний, тільки ГГ:ХХ) ---- */
        .promo-clock {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.15);
            padding: clamp(4px, 0.7vh, 8px) clamp(14px, 1.8vw, 26px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(6px);
            flex-shrink: 0;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
        }
        .promo-clock-time {
            font-size: clamp(20px, 3.4vh, 34px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0.06em;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
        }

        .promo-dates {
            font-size: clamp(11px, 1.6vh, 15px);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.18);
            padding: clamp(5px, 0.9vh, 9px) clamp(10px, 1.4vw, 20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .random-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: clamp(6px, 1vh, 16px) clamp(14px, 1.8vw, 32px) clamp(8px, 1.2vh, 20px);
        }
        .random-container {
            width: 100%;
            max-width: 1700px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .random-container.fade-in { animation: fadeInCard 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes fadeInCard {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); filter: blur(8px); }
            60% { opacity: 1; filter: blur(0); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .random-loading { text-align: center; color: #888; font-size: clamp(14px, 2.5vh, 20px); }

        @keyframes priceBounce {
            0%   { transform: scale(1); }
            30%  { transform: scale(1.18); }
            50%  { transform: scale(1.10); }
            70%  { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        @keyframes priceBounceSmall {
            0%   { transform: scale(1); }
            30%  { transform: scale(1.12); }
            50%  { transform: scale(1.06); }
            70%  { transform: scale(1.10); }
            100% { transform: scale(1); }
        }
        .new-price.bounce-animate {
            animation: priceBounce 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: left bottom;
        }
        .grid-card .new-price.bounce-animate {
            animation: priceBounceSmall 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: left bottom;
        }

        /* ============================================================
           SINGLE
           ============================================================ */
        .mode-single {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(14px, 2.5vh, 36px);
            align-items: center;
            width: 100%;
            height: 100%;
            max-height: 100%;
            background: #fff;
            border: 2px solid #f0f0f0;
            border-radius: clamp(14px, 2vh, 24px);
            padding: clamp(12px, 2vh, 28px) clamp(16px, 2.2vw, 36px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            overflow: visible;
        }
        .mode-single .img-wrap {
            position: relative;
            aspect-ratio: 1 / 1;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(4px, 0.8vh, 12px);
            overflow: visible;
        }
        .mode-single .img-wrap img.main-img {
            width: 100%; height: 100%; object-fit: contain;
            animation: imageBreath 6s ease-in-out infinite;
        }
        @keyframes imageBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

        /* БЕЙДЖ — збільшено на одиночних слайдах */
        .badge {
            position: absolute;
            top: 0; left: 0;
            width: clamp(90px, 16vh, 170px);
            height: clamp(90px, 16vh, 170px);
            border-radius: 50%;
            background: linear-gradient(135deg, #ff2b2b, #d90000);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(22px, 4.2vh, 46px);
            font-weight: 800;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(255, 11, 11, 0.5), inset 0 -5px 12px rgba(0, 0, 0, 0.15);
            letter-spacing: -1px;
            animation: badgePop 0.5s ease-out 0.3s backwards,
                       badgePulse 2.4s ease-in-out 0.8s infinite;
            will-change: transform;
        }
        @keyframes badgePop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            70% { transform: scale(1.15) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }
        @keyframes badgePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        .best-price-icon {
            position: absolute;
            top: -10px; right: -10px;
            width: clamp(120px, 20vh, 225px);
            height: clamp(120px, 20vh, 225px);
            object-fit: contain;
            z-index: 5;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.2));
            animation: bestSpin 0.7s ease-out 0.5s backwards;
        }
        @keyframes bestSpin {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            70% { transform: scale(1.1) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .mode-single .info { display: flex; flex-direction: column; gap: clamp(4px, 0.8vh, 12px); min-width: 0; overflow: visible; }
        .manufacturer {
            font-size: clamp(18px, 2.9vh, 36px);
            color: #999;
            text-transform: uppercase;
            letter-spacing: clamp(1px, 0.2vw, 3px);
            font-weight: 500;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* SINGLE name — тепер до 3 рядків */
        .name {
            font-size: clamp(40px, 8.8vh, 108px);
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.05;
            letter-spacing: -1px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .prices { display: flex; flex-direction: column; align-items: flex-start; margin-top: clamp(2px, 0.5vh, 8px); overflow: visible; }
        .old-price {
            font-size: clamp(32px, 5.6vh, 76px);
            color: #b0b0b0;
            text-decoration: line-through;
            margin-bottom: 2px;
            font-weight: 400;
        }
        .new-price { display: flex; align-items: flex-end; line-height: 1; color: #ff0b0b; gap: clamp(2px, 0.4vw, 8px); will-change: transform; }
        .new-price .price-int { font-size: clamp(105px, 27vh, 300px); font-weight: 800; line-height: 0.85; letter-spacing: -5px; text-shadow: 0 4px 20px rgba(255, 11, 11, 0.15); }
        .new-price .price-cents-wrap { display: flex; flex-direction: column; align-items: flex-start; padding-bottom: clamp(10px, 2vh, 22px); }
        .new-price .price-cents { font-size: clamp(52px, 12vh, 128px); font-weight: 600; line-height: 1; }
        .new-price .price-unit { font-size: clamp(15px, 2.5vh, 30px); font-weight: 400; color: #999; margin-top: 4px; }

        /* ============================================================
           DOUBLE / PAIR
           ============================================================ */
        .mode-double { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(10px, 1.8vh, 24px); max-height: 100%; }
        .double-card {
            display: grid;
            grid-template-rows: 1.15fr 1fr;
            gap: clamp(6px, 1vh, 14px);
            align-items: center;
            background: #fff;
            border: 2px solid #f0f0f0;
            border-radius: clamp(14px, 2vh, 24px);
            padding: clamp(12px, 1.8vh, 24px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            overflow: visible;
            min-height: 0;
        }
        .double-card .img-wrap { position: relative; width: 100%; height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; padding: clamp(2px, 0.6vh, 8px); overflow: visible; }
        .double-card .img-wrap img.main-img { width: 100%; height: 100%; object-fit: contain; }
        .double-card .badge { width: clamp(56px, 9vh, 100px); height: clamp(56px, 9vh, 100px); font-size: clamp(15px, 2.5vh, 26px); top: -4px; left: -4px; }
        .double-card .best-price-icon { top: -8px; right: -8px; width: clamp(110px, 17.5vh, 195px); height: clamp(110px, 17.5vh, 195px); }
        .double-card .info { display: flex; flex-direction: column; gap: clamp(2px, 0.5vh, 8px); min-width: 0; overflow: visible; align-items: flex-start; justify-content: center; }
        .double-card .manufacturer { font-size: clamp(13px, 2vh, 22px); letter-spacing: clamp(0.8px, 0.18vw, 2.5px); color: #999; text-transform: uppercase; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .double-card .name {
            font-size: clamp(24px, 4.6vh, 56px);
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.1;
            letter-spacing: -0.8px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .double-card .prices { display: flex; flex-direction: column; align-items: flex-start; margin-top: clamp(2px, 0.4vh, 6px); overflow: visible; }
        .double-card .old-price { font-size: clamp(26px, 4.4vh, 58px); color: #b0b0b0; text-decoration: line-through; margin-bottom: 2px; font-weight: 400; }
        .double-card .new-price { display: flex; align-items: flex-end; line-height: 1; color: #ff0b0b; gap: clamp(2px, 0.35vw, 6px); will-change: transform; }
        .double-card .new-price .price-int { font-size: clamp(92px, 19vh, 220px); font-weight: 800; line-height: 0.85; letter-spacing: -4px; text-shadow: 0 4px 20px rgba(255, 11, 11, 0.15); }
        .double-card .new-price .price-cents-wrap { display: flex; flex-direction: column; align-items: flex-start; padding-bottom: clamp(8px, 1.6vh, 18px); }
        .double-card .new-price .price-cents { font-size: clamp(44px, 9.5vh, 104px); font-weight: 600; line-height: 1; }
        .double-card .new-price .price-unit { font-size: clamp(13px, 2.1vh, 24px); font-weight: 400; color: #999; margin-top: 3px; }
        .double-card .new-price.bounce-animate { animation: priceBounce 1.2s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: left bottom; }

        /* ============================================================
           GRID
           ============================================================ */
        .mode-grid { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: clamp(8px, 1.2vh, 16px); max-height: 100%; }
        .grid-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(6px, 0.9vw, 14px);
            align-items: center;
            background: #fff;
            border: 2px solid #f0f0f0;
            border-radius: clamp(10px, 1.6vh, 18px);
            padding: clamp(6px, 1.2vh, 14px) clamp(8px, 1.2vw, 18px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            min-height: 0;
            overflow: visible;
        }
        .grid-card .img-wrap { position: relative; aspect-ratio: 1 / 1; max-height: 100%; display: flex; align-items: center; justify-content: center; padding: 2px; overflow: visible; }
        .grid-card .img-wrap img.main-img { width: 100%; height: 100%; object-fit: contain; }
        /* БЕЙДЖ — збільшено на 4-блочних (регулярних) слайдах */
        .grid-card .badge {
            width: clamp(60px, 9.5vh, 100px);
            height: clamp(60px, 9.5vh, 100px);
            font-size: clamp(16px, 2.6vh, 28px);
            top: -10px;
            left: -10px;
        }
        .grid-card .best-price-icon { width: clamp(32px, 5vh, 52px); height: clamp(32px, 5vh, 52px); top: -4px; right: -4px; }
        .grid-card .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: visible; }
        .grid-card .manufacturer { font-size: clamp(10px, 1.3vh, 15px); letter-spacing: clamp(0.5px, 0.15vw, 1.5px); color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .grid-card .name {
            font-size: clamp(24px, 5.2vh, 60px);
            font-weight: 800;
            color: #2c3e50;
            line-height: 1.05;
            letter-spacing: -0.8px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .grid-card .prices { display: flex; flex-direction: column; align-items: flex-start; margin-top: 2px; overflow: visible; }
        .grid-card .old-price { font-size: clamp(22px, 4.2vh, 50px); color: #b0b0b0; text-decoration: line-through; margin-bottom: 1px; }
        .grid-card .new-price { display: flex; align-items: flex-end; line-height: 1; color: #ff0b0b; gap: 2px; will-change: transform; }
        .grid-card .new-price .price-int { font-size: clamp(95px, 18vh, 210px); font-weight: 800; line-height: 0.85; letter-spacing: -3px; }
        .grid-card .new-price .price-cents-wrap { display: flex; flex-direction: column; align-items: flex-start; padding-bottom: clamp(4px, 1.2vh, 14px); }
        .grid-card .new-price .price-cents { font-size: clamp(42px, 8.5vh, 96px); font-weight: 600; line-height: 1; }
        .grid-card .new-price .price-unit { font-size: clamp(12px, 1.8vh, 22px); font-weight: 400; color: #999; margin-top: 1px; }

        /* ============================================================
           MEGA СЛАЙД (останній, жовтий)
           ============================================================ */
        .phase-promo.mega-mode .random-main { padding: 0; }
        .phase-promo.mega-mode .random-container { max-width: none; }

        .mega-slide {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 25% 20%, rgba(255, 255, 255, 0.32), transparent 55%),
                radial-gradient(ellipse at 80% 85%, rgba(255, 210, 0, 0.35), transparent 60%),
                linear-gradient(135deg, #FFC91A 0%, #FFA800 55%, #E68400 100%);
            animation: megaSlideIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, transform;
        }
        @keyframes megaSlideIn {
            0%   { opacity: 0; transform: scale(1.06); }
            100% { opacity: 1; transform: scale(1); }
        }
        .mega-slide::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-conic-gradient(
                from -20deg at 100% 50%,
                rgba(255, 255, 255, 0.06) 0deg 5deg,
                transparent 5deg 14deg
            );
            pointer-events: none;
            z-index: 1;
        }

        /* ЛІВО */
        .mega-left {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3vh 2vw;
            position: relative;
            z-index: 2;
        }
        .mega-product-area {
            width: min(96%, 96vh);
            aspect-ratio: 1 / 1;
            position: relative;
        }
        .mega-product-wrap {
            width: 100%;
            height: 100%;
            position: relative;
            animation: megaRock 7s ease-in-out 0.9s infinite;
            transform-origin: center 80%;
            will-change: transform;
        }
        @keyframes megaRock {
            0%, 100% { transform: rotate(-2.5deg); }
            50%      { transform: rotate(2.5deg); }
        }
        .mega-product-square {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: clamp(16px, 2.5vh, 32px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4%;
            position: relative;
            box-shadow:
                0 20px 60px rgba(120, 60, 0, 0.4),
                0 8px 25px rgba(0, 0, 0, 0.25),
                inset 0 0 0 3px rgba(255, 220, 100, 0.55);
            animation: megaProductIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
            will-change: transform, opacity;
        }
        @keyframes megaProductIn {
            0%   { opacity: 0; transform: scale(0.7) rotate(-8deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        .mega-product-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: megaBreath 5s ease-in-out 0.8s infinite;
            will-change: transform;
        }
        @keyframes megaBreath {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.04); }
        }

        .mega-discount-badge {
            position: absolute;
            top: -3%;
            right: -3%;
            display: inline-flex;
            align-items: center;
            gap: 0.7vw;
            background: #FF0A00;
            color: #ffffff;
            padding: 1.1vh 2.2vw;
            border-radius: 60px;
            font-size: clamp(20px, 3.4vh, 44px);
            font-weight: 900;
            letter-spacing: 0.02em;
            white-space: nowrap;
            z-index: 20;
            box-shadow:
                0 12px 32px rgba(200, 0, 0, 0.7),
                0 5px 14px rgba(0, 0, 0, 0.35),
                inset 0 -3px 8px rgba(0, 0, 0, 0.25),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);
            animation: megaDiscountIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s both,
                       megaDiscountBounce 3s ease-in-out 2.2s infinite;
            will-change: transform, opacity;
        }
        @keyframes megaDiscountIn {
            0%   { opacity: 0; transform: scale(0.3) rotate(-15deg); }
            60%  { opacity: 1; transform: scale(1.18) rotate(4deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes megaDiscountBounce {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50%      { transform: scale(1.07) rotate(-2deg); }
        }
        .mega-discount-badge .label {
            font-size: 0.58em;
            font-weight: 700;
            letter-spacing: 0.18em;
            opacity: 0.95;
            padding-left: 0.2em;
        }

        /* ПРАВО */
        .mega-right {
            display: grid;
            grid-template-rows: 1fr 1fr;
            padding: 3vh 3vw 5vh 1.5vw;
            position: relative;
            z-index: 2;
        }
        .mega-top {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            text-align: left;
            gap: clamp(6px, 1vh, 12px);
            padding: 1vh 2%;
            overflow: hidden;
        }
        .mega-title {
            font-size: clamp(48px, 7.5vw, 240px);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: 0.01em;
            text-transform: uppercase;
            color: #ffffff;
            white-space: nowrap;
            width: 100%;
            text-shadow:
                0 8px 26px rgba(100, 40, 0, 0.8),
                0 3px 8px rgba(0, 0, 0, 0.55),
                0 0 80px rgba(255, 240, 180, 0.55);
            animation: megaTitleIn 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s both;
            will-change: transform, opacity, letter-spacing;
        }
        @keyframes megaTitleIn {
            0%   { opacity: 0; transform: scale(0.4) translateY(30px); letter-spacing: 0.35em; }
            100% { opacity: 1; transform: scale(1) translateY(0);     letter-spacing: 0.01em; }
        }
        .mega-manufacturer {
            font-size: clamp(13px, 1.9vh, 22px);
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 2px 6px rgba(80, 30, 0, 0.75), 0 1px 2px rgba(0, 0, 0, 0.4);
            text-align: left;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            animation: megaFadeUp 0.6s ease-out 0.35s both;
        }
        .mega-name {
            font-size: clamp(40px, 8.5vh, 100px);
            font-weight: 700;
            line-height: 1.02;
            color: #ffffff;
            text-shadow: 0 3px 10px rgba(80, 30, 0, 0.75), 0 1px 3px rgba(0, 0, 0, 0.45);
            width: 100%;
            text-align: left;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: megaFadeUp 0.7s ease-out 0.55s both;
        }

        .mega-bottom {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            text-align: left;
            gap: clamp(4px, 0.8vh, 12px);
            padding: 1vh 2%;
            position: relative;
        }
        .mega-old-price {
            font-size: clamp(36px, 6.5vh, 100px);
            font-weight: 600;
            color: rgba(80, 30, 0, 0.65);
            text-decoration: line-through;
            text-decoration-thickness: clamp(4px, 0.7vh, 8px);
            text-decoration-color: rgba(80, 30, 0, 0.8);
            letter-spacing: 0.01em;
            line-height: 1;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);
            animation: megaFadeUp 0.5s ease-out 0.35s both;
        }
        .mega-new-price {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            flex-wrap: nowrap;
            line-height: 0.85;
            color: #FF0A00;
            white-space: nowrap;
            animation:
                megaPriceIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s both,
                megaPriceJump 10s ease-in-out 1.5s infinite;
            will-change: transform, opacity;
            transform-origin: left center;
        }
        @keyframes megaPriceIn {
            0%   { opacity: 0; transform: scale(0.4) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes megaPriceJump {
            0%, 8%    { transform: scale(1) rotate(0deg); }
            9%        { transform: scale(1.14) rotate(-1deg); }
            11%       { transform: scale(1.04) rotate(0.5deg); }
            13%       { transform: scale(1.1) rotate(-0.5deg); }
            15%, 48%  { transform: scale(1) rotate(0deg); }
            49%       { transform: scale(1.14) rotate(-1deg); }
            51%       { transform: scale(1.04) rotate(0.5deg); }
            53%       { transform: scale(1.1) rotate(-0.5deg); }
            55%, 100% { transform: scale(1) rotate(0deg); }
        }
        .mega-price-int {
            font-size: clamp(120px, min(18vw, 38vh), 800px);
            font-weight: 900;
            letter-spacing: -0.055em;
            text-shadow:
                0 4px 14px rgba(200, 0, 0, 0.6),
                0 0 50px rgba(255, 240, 200, 0.65),
                0 0 20px rgba(255, 20, 10, 0.4);
        }
        .mega-price-cents-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-top: clamp(8px, 1.6vh, 26px);
            padding-left: 0.4vw;
        }
        .mega-price-cents {
            font-size: clamp(52px, min(7vw, 15vh), 300px);
            font-weight: 800;
            line-height: 1;
            text-shadow:
                0 3px 10px rgba(200, 0, 0, 0.55),
                0 0 25px rgba(255, 240, 200, 0.5),
                0 0 12px rgba(255, 20, 10, 0.35);
        }
        .mega-price-unit {
            font-size: clamp(12px, 1.9vh, 22px);
            font-weight: 700;
            color: rgba(160, 10, 10, 0.9);
            margin-top: 0.6vh;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        @keyframes megaFadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .fullscreen-hint {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.9);
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: clamp(10px, 1.4vh, 13px);
            font-weight: 500;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            animation: hintPulse 2s ease-in-out infinite;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        @keyframes hintPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }
        .fullscreen-hint.hidden { opacity: 0; }
        .fullscreen-hint svg { width: 14px; height: 14px; }

        /* ============================================================
           ФАЗА 2: ВІДЕО КАВА
           ============================================================ */
        .phase-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #phaseVideo::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent 40%);
            pointer-events: none;
        }
        .skip-btn {
            position: absolute;
            bottom: 4vh;
            right: 3vw;
            z-index: 2;
            background: rgba(0, 0, 0, 0.55);
            color: #f5ebe0;
            border: 1.5px solid rgba(212, 175, 55, 0.6);
            padding: 1.1vh 2.2vh;
            border-radius: 40px;
            font-family: inherit;
            font-size: clamp(0.85rem, 1.6vh, 1.05rem);
            font-weight: 600;
            letter-spacing: 0.08em;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
        }
        .skip-btn:hover {
            background: rgba(212, 175, 55, 0.3);
            border-color: #d4af37;
            transform: translateX(4px);
        }

        /* ============================================================
           ФАЗА 3: КАВ'ЯРНЯ-МЕНЮ
           ============================================================ */
        .phase-menu .header-logo {
            position: fixed;
            top: 2.5vh;
            left: 2vw;
            height: 8vh;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
            z-index: 10;
            opacity: 0;
            pointer-events: none;
        }
        .phase-menu.active .header-logo {
            animation: logoIn 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
        }
        @keyframes logoIn {
            0%   { opacity: 0; transform: translateX(-40px) rotate(-12deg); }
            100% { opacity: 1; transform: translateX(0) rotate(0deg); }
        }

        .phase-menu .title {
            position: fixed;
            top: 2vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 6.5vh, 4.5rem);
            text-transform: uppercase;
            color: #f5ebe0;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 40px rgba(212, 175, 55, 0.25);
            transition: text-shadow 0.5s ease;
        }
        .phase-menu .title span {
            display: inline-block;
            padding-left: 0.25em;
            opacity: 0;
        }
        .phase-menu.active .title span {
            animation: titleIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s forwards;
        }
        @keyframes titleIn {
            0%   { opacity: 0; transform: translateY(-40px); letter-spacing: 0.4em; }
            100% { opacity: 1; transform: translateY(0); letter-spacing: 0.25em; }
        }
        .phase-menu .title.pulse {
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7),
                         0 0 60px rgba(212, 175, 55, 0.85),
                         0 0 100px rgba(212, 175, 55, 0.5);
        }

        .phase-menu .main-container {
            flex-grow: 1;
            height: 100vh;
            padding: 13vh 4vw 3vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .phase-menu .menu-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-auto-rows: 1fr;
            gap: 2.2vh 2.2vw;
            width: 100%;
            height: 100%;
        }

        .menu-card {
            grid-column: span 2;
            --scale: 1;
            --lift: 0px;
            position: relative;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
            opacity: 0;
            transform: translateY(50px) scale(0.85);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.4s ease;
        }
        .phase-menu.active .menu-card {
            animation: cardIn 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes cardIn {
            0%   { opacity: 0; transform: translateY(50px) scale(0.85); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .phase-menu.active .menu-card.appeared {
            animation: none;
            opacity: 1;
            transform: translateY(var(--lift)) scale(var(--scale));
        }
        .menu-card:hover {
            --lift: -8px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        }
        .menu-card.pulse {
            --scale: 1.05;
            z-index: 2;
            box-shadow: 0 22px 50px rgba(212, 175, 55, 0.55),
                        0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .menu-card.center-single     { grid-column: 3 / span 2; }
        .menu-card.center-pair-left  { grid-column: 2 / span 2; }
        .menu-card.center-pair-right { grid-column: 4 / span 2; }

        .card-img-wrapper {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5vh 1vw;
            overflow: hidden;
        }
        .card-img { width: 100%; height: 100%; object-fit: contain; }

        .card-price {
            --price-scale: 1;
            position: absolute;
            top: 1.2vh;
            right: 1.2vh;
            background: linear-gradient(135deg, #4e342e, #2b1a16);
            color: #ffd97a;
            font-size: clamp(1.6rem, 4.2vh, 2.8rem);
            font-weight: 800;
            line-height: 1;
            padding: 1vh 1.6vh;
            border-radius: 40px;
            border: 2px solid #d4af37;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
            white-space: nowrap;
            letter-spacing: 0.02em;
            transform: scale(var(--price-scale));
            transform-origin: top right;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background 0.4s ease, color 0.4s ease,
                        box-shadow 0.4s ease, border-color 0.4s ease;
        }
        .card-price.pulse-price {
            --price-scale: 1.4;
            background: linear-gradient(135deg, #f5d76e, #d4af37);
            color: #2b1a16;
            border-color: #fff8e1;
            box-shadow: 0 8px 25px rgba(245, 215, 110, 0.9),
                        0 0 35px rgba(212, 175, 55, 0.7);
        }

        .card-info {
            flex: 0 0 auto;
            padding: 1.4vh 1.2vw 2vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .card-title {
            font-size: clamp(0.95rem, 2.2vh, 1.5rem);
            font-weight: 800;
            color: #2c3e50;
            line-height: 1.25;
            word-wrap: break-word;
            transition: color 0.4s ease;
        }
        .menu-card.pulse .card-title { color: #b8860b; }

        /* ============================================================
           ОВЕРЛЕЙ "ХВИЛИНА МОВЧАННЯ"
           ============================================================ */
        .silence-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: radial-gradient(ellipse at center, #1a0f08 0%, #000 100%);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            animation: silenceFadeIn 0.9s ease;
            text-align: center;
        }
        .silence-overlay.active { display: flex; }
        @keyframes silenceFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .silence-inner {
            padding: 4vh 4vw;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3vh;
        }

        .silence-badge {
            font-family: 'Playfair Display', serif;
            font-size: clamp(160px, 38vh, 480px);
            font-weight: 700;
            color: #ffd97a;
            line-height: 0.9;
            letter-spacing: 0.03em;
            text-shadow:
                0 0 60px rgba(212, 175, 55, 0.7),
                0 0 120px rgba(212, 175, 55, 0.35),
                0 4px 20px rgba(0, 0, 0, 0.6);
            animation: silenceGlow 3s ease-in-out infinite;
            font-variant-numeric: tabular-nums;
        }
        @keyframes silenceGlow {
            0%, 100% {
                text-shadow:
                    0 0 60px rgba(212, 175, 55, 0.7),
                    0 0 120px rgba(212, 175, 55, 0.35),
                    0 4px 20px rgba(0, 0, 0, 0.6);
            }
            50% {
                text-shadow:
                    0 0 100px rgba(212, 175, 55, 1),
                    0 0 180px rgba(212, 175, 55, 0.6),
                    0 4px 20px rgba(0, 0, 0, 0.6);
            }
        }

        .silence-title {
            font-size: clamp(22px, 4.8vh, 62px);
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #f5ebe0;
            line-height: 1.25;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
            padding-left: 0.18em;
        }

        .silence-subtitle {
            font-size: clamp(13px, 2.2vh, 26px);
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #a8a8a8;
            padding-left: 0.2em;
        }

        .silence-progress {
            width: min(64vw, 780px);
            height: 5px;
            background: rgba(255, 217, 122, 0.12);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 2vh;
        }
        .silence-progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #d4af37, #ffd97a);
            border-radius: 3px;
            transform-origin: left center;
            transform: scaleX(1);
        }
        @keyframes silenceProgress {
            from { transform: scaleX(1); }
            to   { transform: scaleX(0); }
        }

        .silence-countdown {
            font-size: clamp(11px, 1.8vh, 18px);
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #888;
            font-variant-numeric: tabular-nums;
        }
        .silence-countdown span {
            color: #ffd97a;
            font-size: 1.4em;
        }

        /* ============================================================
           АДАПТИВНІСТЬ
           ============================================================ */
        @media (min-width: 1600px) { .random-container { max-width: 1800px; } }

        @media (max-height: 700px) {
            .name { font-size: clamp(28px, 6vh, 64px); }
            .new-price .price-int { font-size: clamp(80px, 20vh, 200px); }
            .new-price .price-cents { font-size: clamp(38px, 9vh, 92px); }
            .old-price { font-size: clamp(24px, 4.2vh, 52px); }
            .manufacturer { font-size: clamp(14px, 2.2vh, 26px); }
            .best-price-icon { width: clamp(100px, 16vh, 175px); height: clamp(100px, 16vh, 175px); }
            .double-card .name { font-size: clamp(20px, 3.6vh, 40px); }
            .double-card .new-price .price-int { font-size: clamp(70px, 15vh, 155px); }
            .double-card .new-price .price-cents { font-size: clamp(34px, 7.5vh, 74px); }
            .double-card .old-price { font-size: clamp(20px, 3.4vh, 42px); }
            .grid-card .name { font-size: clamp(20px, 4vh, 42px); }
            .grid-card .new-price .price-int { font-size: clamp(72px, 13vh, 150px); }
            .grid-card .new-price .price-cents { font-size: clamp(32px, 6.5vh, 72px); }

            .mega-title { font-size: clamp(36px, 6.5vw, 140px); }
            .mega-name { font-size: clamp(28px, 6vh, 64px); }
            .mega-old-price { font-size: clamp(24px, 4.5vh, 60px); }
            .mega-price-int { font-size: clamp(80px, min(16vw, 30vh), 400px); }
            .mega-price-cents { font-size: clamp(36px, min(6vw, 12vh), 160px); }
            .mega-discount-badge { font-size: clamp(18px, 2.8vh, 34px); }
        }

        @media (max-width: 900px) {
            html, body { overflow: hidden; cursor: default; }

            .phase-promo.active { overflow-y: auto; }
            .promo-header { flex-direction: column; align-items: flex-start; gap: 8px; padding: 10px 14px; }
            .promo-logo img { height: 32px; }
            .promo-logo-text { font-size: 18px; letter-spacing: 1px; white-space: normal; }
            .promo-clock { padding: 6px 14px; }
            .promo-clock-time { font-size: 20px; }
            .promo-dates { font-size: 11px; padding: 6px 10px; }
            .random-main { padding: 12px 12px 16px; align-items: flex-start; overflow: visible; }
            .mode-single { grid-template-columns: 1fr; gap: 14px; padding: 14px; border-radius: 14px; max-height: none; height: auto; }
            .mode-single .img-wrap { padding: 8px; max-height: 40vh; }
            .mode-single .img-wrap img.main-img { animation: none; }
            .mode-single .name { font-size: 30px; }
            .mode-single .manufacturer { font-size: 15px; letter-spacing: 1.5px; }
            .mode-single .old-price { font-size: 26px; }
            .mode-single .new-price .price-int { font-size: 96px; letter-spacing: -3px; }
            .mode-single .new-price .price-cents { font-size: 42px; }
            .mode-single .new-price .price-unit { font-size: 13px; }
            .mode-single .badge { width: 90px; height: 90px; font-size: 22px; }
            .best-price-icon { width: 90px; height: 90px; top: -4px; right: -4px; }
            .mode-double { grid-template-columns: 1fr; grid-template-rows: auto auto; gap: 14px; height: auto; }
            .double-card { grid-template-rows: auto auto; padding: 14px; border-radius: 14px; gap: 10px; }
            .double-card .name { font-size: 22px; }
            .double-card .new-price .price-int { font-size: 72px; }
            .double-card .new-price .price-cents { font-size: 32px; }
            .double-card .old-price { font-size: 20px; }
            .double-card .best-price-icon { width: 80px; height: 80px; }
            .mode-grid { grid-template-columns: 1fr; grid-template-rows: repeat(4, auto); gap: 12px; height: auto; }
            .grid-card { grid-template-columns: 1fr 1fr; padding: 10px 12px; gap: 10px; border-radius: 12px; min-height: 130px; }
            .grid-card .name { font-size: 22px; }
            .grid-card .new-price .price-int { font-size: 78px; letter-spacing: -2px; }
            .grid-card .new-price .price-cents { font-size: 34px; }
            .grid-card .old-price { font-size: 18px; }
            .grid-card .badge { width: 64px; height: 64px; font-size: 18px; }
            .grid-card .best-price-icon { width: 36px; height: 36px; }
            .fullscreen-hint { display: none; }

            .phase-menu.active { overflow-y: auto; }
            .phase-menu .header-logo { height: 50px; top: 15px; left: 15px; }
            .phase-menu .title { top: 12px; font-size: 2rem; }
            .phase-menu .main-container { height: auto; padding: 90px 20px 20px; }
            .phase-menu .menu-grid { grid-template-columns: repeat(4, 1fr); gap: 15px; height: auto; }
            .menu-card.center-single,
            .menu-card.center-pair-left,
            .menu-card.center-pair-right { grid-column: span 2; }
            .menu-card { min-height: 230px; }
            .card-price { font-size: 1.4rem; padding: 7px 14px; }
            .card-title { font-size: 1rem; }

            .skip-btn { bottom: 20px; right: 20px; padding: 10px 18px; font-size: 0.9rem; }

            .silence-badge { font-size: 90px; }
            .silence-title { font-size: 20px; letter-spacing: 0.12em; }
            .silence-subtitle { font-size: 12px; letter-spacing: 0.15em; }

            /* MEGA — мобільний: вертикально */
            .mega-slide {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
            .mega-left { padding: 2vh 5vw; }
            .mega-product-area { width: min(85%, 40vh); }
            .mega-right { padding: 1vh 5vw 6vh; }
            .mega-title { font-size: clamp(36px, 9vw, 90px); }
            .mega-name { font-size: clamp(28px, 6vh, 56px); -webkit-line-clamp: 3; }
            .mega-old-price { font-size: clamp(28px, 5vh, 64px); }
            .mega-price-int { font-size: min(22vw, 20vh); }
            .mega-price-cents { font-size: min(9vw, 8vh); }
            .mega-price-unit { font-size: clamp(10px, 1.5vh, 15px); }
            .mega-discount-badge {
                top: -2.5%;
                right: -2.5%;
                font-size: clamp(16px, 2.6vh, 32px);
                padding: 0.8vh 3.5vw;
            }
        }

        @media (max-width: 500px) {
            .phase-menu .menu-grid { grid-template-columns: repeat(2, 1fr); }
            .card-price { font-size: 1.3rem; }
            .phase-menu .title { font-size: 1.6rem; }
            .mode-single .name { font-size: 26px; }
            .mode-single .new-price .price-int { font-size: 80px; }
            .mode-single .new-price .price-cents { font-size: 36px; }
            .double-card .name { font-size: 19px; }
            .double-card .new-price .price-int { font-size: 60px; }
            .double-card .new-price .price-cents { font-size: 26px; }
            .grid-card .name { font-size: 18px; }
            .grid-card .new-price .price-int { font-size: 62px; }
            .grid-card .new-price .price-cents { font-size: 28px; }

            .mega-title { font-size: clamp(28px, 8.5vw, 52px); }
            .mega-price-int { font-size: min(24vw, 18vh); }
            .mega-price-cents { font-size: min(10vw, 7vh); }
            .mega-name { font-size: clamp(24px, 5vh, 42px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .badge, .best-price-icon,
            .mode-single .img-wrap img.main-img,
            .new-price, .silence-badge { animation: none !important; }

            .mega-product-wrap, .mega-new-price { animation: none !important; }
        }
    </style>
</head>
<body>

    <!-- ФАЗА 1: ПРОМО -->
    <div class="phase phase-promo" id="phasePromo">
        <header class="promo-header">
            <div class="promo-logo">
                <img src="./image_site/_22.png" alt="Логотип" onerror="this.style.display='none';">
