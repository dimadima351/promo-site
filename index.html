<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Головна | Ваш ПАРТНЕР</title>
    <link rel="stylesheet" href="style.css?v=16">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <img src="./image_site/_2.jpg" alt="Логотип" onerror="this.onerror=null; this.style.display='none'; this.parentElement.innerHTML='Ваш<span>ПАРТНЕР</span>';">
            </a>

            <button class="burger" id="burgerBtn" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav" id="mainNav">
                <a href="/">Головна</a>
                <a href="promo.html">Акції</a>
                <a href="#">Контакти</a>
            </nav>
        </div>
    </header>

    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Блок-банер "Акції цього місяця" -->
    <section class="hero-banner">
        <div class="container">
            <a href="promo.html" class="hero-banner-link">
                <span class="hero-banner-text">АКЦІЇ ЦЬОГО МІСЯЦЯ</span>
                <span class="hero-banner-arrow" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </span>
            </a>
        </div>
    </section>

    <!-- Карусель з випадковими товарами -->
    <section class="carousel-section">
        <div class="container">
            <h2 class="section-title">Популярні акції</h2>

            <div class="carousel-wrap">
                <button class="carousel-btn carousel-btn-prev" id="carouselPrev" aria-label="Назад">‹</button>

                <div class="carousel" id="carousel">
                    <p class="carousel-loading">Завантаження...</p>
                </div>

                <button class="carousel-btn carousel-btn-next" id="carouselNext" aria-label="Вперед">›</button>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Ваш ПАРТНЕР. Усі права захищено.</p>
        </div>
    </footer>

    <script>
        const PLACEHOLDER = './images/0.png';

        function noCache(url) {
            const separator = url.includes('?') ? '&' : '?';
            return url + separator + 't=' + Date.now();
        }

        // ====== БУРГЕР-МЕНЮ ======
        const burgerBtn = document.getElementById('burgerBtn');
        const mainNav = document.getElementById('mainNav');
        const menuOverlay = document.getElementById('menuOverlay');

        function toggleMenu() {
            burgerBtn.classList.toggle('active');
            mainNav.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            document.body.classList.toggle('menu-open');
        }

        function closeMenu() {
            burgerBtn.classList.remove('active');
            mainNav.classList.remove('active');
            menuOverlay.classList.remove('active');
            document.body.classList.remove('menu-open');
        }

        burgerBtn.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', closeMenu);
        mainNav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', closeMenu);
        });

        // ====== КАРУСЕЛЬ ======
        const carousel = document.getElementById('carousel');

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function makeCard(item) {
            const card = document.createElement('div');
            card.className = 'card';

            const newPrice = item.price ?? item.newPrice ?? '';
            const oldPrice = item.oldPrice ?? '';
            const imgSrc = noCache(item.image);

            card.innerHTML = `
                ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
                <div class="card-image">
                    <img src="${imgSrc}" alt="${item.name}" loading="lazy"
                         onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                </div>
                <div class="card-body">
                    <div class="prices">
                        ${oldPrice ? `<span class="old-price">${oldPrice} ₴</span>` : ''}
                        <span class="new-price">${newPrice} <span class="unit">грн/шт</span></span>
                    </div>
                    <h3>${item.name}</h3>
                    ${item.validUntil ? `<p class="valid-until">Акція діє до ${item.validUntil}</p>` : ''}
                </div>
            `;
            return card;
        }

        function makeGoCard() {
            const card = document.createElement('a');
            card.href = 'promo.html';
            card.className = 'card card-go';
            card.innerHTML = `
                <div class="card-go-inner">
                    <div class="card-go-arrow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </div>
                    <span>Перейти до всіх акцій</span>
                </div>
            `;
            return card;
        }

        document.getElementById('carouselPrev').addEventListener('click', () => {
            carousel.scrollBy({ left: -300, behavior: 'smooth' });
        });
        document.getElementById('carouselNext').addEventListener('click', () => {
            carousel.scrollBy({ left: 300, behavior: 'smooth' });
        });

        // ====== ЗАВАНТАЖЕННЯ ТОВАРІВ ======
        fetch(noCache('./data/promotions.json'))
            .then(r => r.ok ? r.json() : Promise.reject('Помилка завантаження'))
            .then(data => {
                let items = (data.items || []).filter(it => it.visible !== false);

                items = shuffle(items).slice(0, 6);

                carousel.innerHTML = '';

                if (items.length === 0) {
                    carousel.innerHTML = '<p class="carousel-loading">Акцій поки що немає</p>';
                    return;
                }

                items.forEach(it => carousel.appendChild(makeCard(it)));
                carousel.appendChild(makeGoCard());
            })
            .catch(err => {
                console.error(err);
                carousel.innerHTML = '<p class="carousel-loading">Не вдалося завантажити акції</p>';
            });
    </script>

</body>
</html>
