<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Акції | PromoSite</title>
    <link rel="stylesheet" href="style.css?v=6">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>

    <header class="header">
        <div class="container">
            <h1 class="logo">Promo<span>Site</span></h1>
            <nav>
                <a href="#">Головна</a>
                <a href="#promo">Акції</a>
                <a href="#">Контакти</a>
            </nav>
        </div>
    </header>

    <!-- Банер з картинкою -->
    <section class="page-title">
        <div class="container">
            <h2 id="page-title">Акції</h2>
            <p>Найкращі пропозиції цього місяця — встигніть придбати!</p>

            <div class="countdown" id="countdown">
                <p class="countdown-label">До кінця акції залишилось:</p>
                <div class="countdown-grid">
                    <div class="countdown-item">
                        <span class="countdown-number" id="cd-days">0</span>
                        <span class="countdown-unit">днів</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-number" id="cd-hours">0</span>
                        <span class="countdown-unit">годин</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-number" id="cd-minutes">0</span>
                        <span class="countdown-unit">хвилин</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Панель сортування -->
    <section class="sort-panel">
        <div class="container">
            <div class="sort-wrapper">
                <div class="sort-group">
                    <label for="sort-category">Категорія:</label>
                    <select id="sort-category">
                        <option value="">Усі категорії</option>
                    </select>
                </div>

                <div class="sort-group">
                    <label for="sort-name">Назва:</label>
                    <select id="sort-name">
                        <option value="">За замовчуванням</option>
                        <option value="name-asc">А → Я</option>
                        <option value="name-desc">Я → А</option>
                    </select>
                </div>

                <div class="sort-group">
                    <label for="sort-price">Ціна:</label>
                    <select id="sort-price">
                        <option value="">За замовчуванням</option>
                        <option value="price-asc">Від дешевшої</option>
                        <option value="price-desc">Від дорожчої</option>
                    </select>
                </div>

                <button id="reset-filters" class="reset-btn">Скинути</button>
            </div>
        </div>
    </section>

    <main class="container" id="promo">
        <div class="grid" id="promo-container">
            <p class="loading">Завантаження акцій...</p>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 PromoSite. Усі права захищено.</p>
        </div>
    </footer>

    <script>
        const PLACEHOLDER = './images/0.png';
        let allItems = []; // усі товари з JSON

        function noCache(url) {
            const separator = url.includes('?') ? '&' : '?';
            return url + separator + 't=' + Date.now();
        }

        // ====== ТАЙМЕР ======
        function getEndOfMonth() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
        }

        function updateCountdown() {
            const now = new Date();
            const end = getEndOfMonth();
            const diff = end - now;

            const countdownEl = document.getElementById('countdown');
            const daysEl = document.getElementById('cd-days');
            const hoursEl = document.getElementById('cd-hours');
            const minutesEl = document.getElementById('cd-minutes');

            if (!countdownEl || !daysEl) return;

            if (diff <= 0) {
                countdownEl.innerHTML = '<p class="countdown-label">Акція завершена</p>';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            daysEl.textContent = days;
            hoursEl.textContent = String(hours).padStart(2, '0');
            minutesEl.textContent = String(minutes).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 5 * 60 * 1000);

        // ====== РЕНДЕР КАРТОК ======
        function renderItems(items) {
            const container = document.getElementById('promo-container');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<p class="loading">Нічого не знайдено</p>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                const newPrice = item.price ?? item.newPrice ?? '';
                const oldPrice = item.oldPrice ?? '';
                const imgSrc = noCache(item.image);

                card.innerHTML = `
                    ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
                    <div class="card-image">
                        <img src="${imgSrc}" alt="${item.name}"
                             loading="lazy"
                             onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                    </div>
                    <div class="card-body">
                        <div class="prices">
                            ${oldPrice ? `<span class="old-price">${oldPrice} ₴</span>` : ''}
                            <span class="new-price">${newPrice} <span class="unit">грн/шт</span></span>
                        </div>
                        <h3>${item.name}</h3>
                        ${item.validUntil ? `<p class="valid-until">Акція діє до ${item.validUntil}</p>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ====== ЗАСТОСУВАННЯ ФІЛЬТРІВ І СОРТУВАННЯ ======
        function applyFilters() {
            const category = document.getElementById('sort-category').value;
            const nameSort = document.getElementById('sort-name').value;
            const priceSort = document.getElementById('sort-price').value;

            let filtered = [...allItems];

            // Фільтр за категорією
            if (category) {
                filtered = filtered.filter(it => it.category === category);
            }

            // Сортування
            if (nameSort === 'name-asc') {
                filtered.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'uk'));
            } else if (nameSort === 'name-desc') {
                filtered.sort((a, b) => (b.name || '').localeCompare(a.name || '', 'uk'));
            } else if (priceSort === 'price-asc') {
                filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
            } else if (priceSort === 'price-desc') {
                filtered.sort((a, b) => (b.price || 0) - (a.price || 0));
            }

            renderItems(filtered);
        }

        // ====== ЗАВАНТАЖЕННЯ ТОВАРІВ ======
        fetch(noCache('./data/promotions.json'))
            .then(response => {
                if (!response.ok) throw new Error('Не вдалося завантажити акції');
                return response.json();
            })
            .then(data => {
                document.getElementById('page-title').textContent = 'Акції ' + data.month;
                document.title = 'Акції ' + data.month + ' | PromoSite';

                allItems = data.items || [];

                // Заповнюємо список категорій
                const categories = [...new Set(allItems.map(it => it.category).filter(Boolean))];
                categories.sort((a, b) => a.localeCompare(b, 'uk'));

                const catSelect = document.getElementById('sort-category');
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat;
                    catSelect.appendChild(opt);
                });

                renderItems(allItems);
            })
            .catch(error => {
                console.error('Помилка:', error);
                document.getElementById('promo-container').innerHTML =
                    '<p class="error">Не вдалося завантажити акції. Спробуйте пізніше.</p>';
            });

        // ====== СЛУХАЧІ ПОДІЙ ======
        document.getElementById('sort-category').addEventListener('change', applyFilters);
        document.getElementById('sort-name').addEventListener('change', applyFilters);
        document.getElementById('sort-price').addEventListener('change', applyFilters);

        document.getElementById('reset-filters').addEventListener('click', () => {
            document.getElementById('sort-category').value = '';
            document.getElementById('sort-name').value = '';
            document.getElementById('sort-price').value = '';
            renderItems(allItems);
        });
    </script>

</body>
</html>
