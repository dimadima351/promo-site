<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Акції | PromoSite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка -->
    <header class="header">
        <div class="container">
            <h1 class="logo">Promo<span>Site</span></h1>
            <nav>
                <a href="#">Головна</a>
                <a href="#promo">Акції</a>
                <a href="#">Контакти</a>
            </nav>
        </div>
    </header>

    <!-- Заголовок сторінки -->
    <section class="page-title">
        <div class="container">
            <h2 id="page-title">Акції</h2>
            <p>Найкращі пропозиції цього місяця — встигніть придбати!</p>
        </div>
    </section>

    <!-- Сітка з товарами -->
    <main class="container" id="promo">
        <div class="grid" id="promo-container">
            <p class="loading">Завантаження акцій...</p>
        </div>
    </main>

    <!-- Підвал -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 PromoSite. Усі права захищено.</p>
        </div>
    </footer>

    <!-- Скрипт для завантаження акцій -->
    <script>
        fetch('./data/promotions.json')
            .then(response => {
                if (!response.ok) throw new Error('Не вдалося завантажити акції');
                return response.json();
            })
            .then(data => {
                // Оновлюємо заголовок місяця
                document.getElementById('page-title').textContent = 'Акції ' + data.month;
                document.title = 'Акції ' + data.month + ' | PromoSite';

                const container = document.getElementById('promo-container');
                container.innerHTML = ''; // Очищаємо "Завантаження..."

                // Створюємо картки товарів
                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
                        <img src="${item.image}" alt="${item.name}" loading="lazy">
                        <div class="card-body">
                            <h3>${item.name}</h3>
                            <div class="prices">
                                ${item.oldPrice ? `<span class="old-price">${item.oldPrice} ₴</span>` : ''}
                                <span class="new-price">${item.newPrice} ₴</span>
                            </div>
                            <a href="${item.link || '#'}" class="btn">Купити</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Помилка:', error);
                document.getElementById('promo-container').innerHTML =
                    '<p class="error">Не вдалося завантажити акції. Спробуйте пізніше.</p>';
            });
    </script>

</body>
</html>
