<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наші акції | Promo Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка сайту -->
    <header class="header">
        <div class="container">
            <h1 class="logo">Promo<span>Site</span></h1>
            <nav>
                <a href="#">Головна</a>
                <a href="#">Акції</a>
                <a href="#">Контакти</a>
            </nav>
        </div>
    </header>

    <!-- Заголовок сторінки -->
    <section class="page-title">
        <div class="container">
            <h2>Акції вересня 2026</h2>
            <p>Найкращі пропозиції цього місяця — встигніть придбати!</p>
        </div>
    </section>

    <!-- Сітка з товарами -->
    <main class="container">
        <div class="grid">

            <!-- Картка 1 -->
            <div class="card">
                <div class="badge">-30%</div>
                <img src="https://via.placeholder.com/300x200?text=Кава+Lavazza" alt="Кава Lavazza">
                <div class="card-body">
                    <h3>Кава Lavazza</h3>
                    <div class="prices">
                        <span class="old-price">450 ₴</span>
                        <span class="new-price">320 ₴</span>
                    </div>
                    <button class="btn">Купити</button>
                </div>
            </div>

            <!-- Картка 2 -->
            <div class="card">
                <div class="badge">-25%</div>
                <img src="https://via.placeholder.com/300x200?text=Чай+Greenfield" alt="Чай Greenfield">
                <div class="card-body">
                    <h3>Чай Greenfield</h3>
                    <div class="prices">
                        <span class="old-price">200 ₴</span>
                        <span class="new-price">150 ₴</span>
                    </div>
                    <button class="btn">Купити</button>
                </div>
            </div>

            <!-- Картка 3 -->
            <div class="card">
                <div class="badge">-15%</div>
                <img src="https://via.placeholder.com/300x200?text=Шоколад+Milka" alt="Шоколад Milka">
                <div class="card-body">
                    <h3>Шоколад Milka</h3>
                    <div class="prices">
                        <span class="old-price">120 ₴</span>
                        <span class="new-price">102 ₴</span>
                    </div>
                    <button class="btn">Купити</button>
                </div>
            </div>

            <!-- Картка 4 -->
            <div class="card">
                <div class="badge">-40%</div>
                <img src="https://via.placeholder.com/300x200?text=Печиво+Oreo" alt="Печиво Oreo">
                <div class="card-body">
                    <h3>Печиво Oreo</h3>
                    <div class="prices">
                        <span class="old-price">80 ₴</span>
                        <span class="new-price">48 ₴</span>
                    </div>
                    <button class="btn">Купити</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Підвал -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 PromoSite. Усі права захищено.</p>
        </div>
    </footer>

</body>
</html>
