<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Головна | Ваш ПАРТНЕР</title>
    <link rel="canonical" href="https://vashpartner.pp.ua/index.html">
    <!-- Основне -->
    <meta name="description" content="Акції цього місяця в магазині Ваш Партнер. Знижки на продукти, алкоголь, напої. Оновлюється щомісяця.">
    <meta name="keywords" content="Ваш Партнер, акції, знижки, продукти, алкоголь, акції місяця">
    <meta name="author" content="Ваш Партнер">
    <meta name="robots" content="index, follow">

    <!-- Open Graph (для соцмереж і Google) -->
    <meta property="og:title" content="Ваш Партнер — Акції цього місяця">
    <meta property="og:description" content="Найкращі пропозиції та знижки на продукти й алкоголь.">
    <meta property="og:image" content="https://vashpartner.pp.ua/image_site/_2.jpg">
    <meta property="og:url" content="https://vashpartner.pp.ua/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="uk_UA">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Ваш Партнер — Акції цього місяця">
    <meta name="twitter:description" content="Найкращі пропозиції та знижки.">
    <meta name="twitter:image" content="https://vashpartner.pp.ua/image_site/_2.jpg">
    <link rel="stylesheet" href="style.css?v=19">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <img src="./image_site/_2.jpg" alt="Логотип" onerror="this.onerror=null; this.style.display='none'; this.parentElement.innerHTML='Ваш<span>ПАРТНЕР</span>';">
            </a>

            <button class="burger" id="burgerBtn" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav" id="mainNav">
                <a href="/">Головна</a>
                <a href="promo.html">Акції</a>
                <a href="alcohol.html">Алкоголь</a>
                <a href="#">Контакти</a>
            </nav>
        </div>
    </header>

    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- БАНЕР-КАРУСЕЛЬ -->
    <section class="banner-carousel" id="bannerCarousel">
        <img src="./image_site/banner1.jpg" alt="" class="banner-slide active" onerror="this.style.opacity=0.3">
        <img src="./image_site/banner2.jpg" alt="" class="banner-slide" onerror="this.style.opacity=0.3">
        <img src="./image_site/banner3.jpg" alt="" class="banner-slide" onerror="this.style.opacity=0.3">
        <img src="./image_site/banner4.jpg" alt="" class="banner-slide" onerror="this.style.opacity=0.3">
        <img src="./image_site/banner5.jpg" alt="" class="banner-slide" onerror="this.style.opacity=0.3">

        <div class="banner-dots">
            <span class="dot active" data-slide="0"></span>
            <span class="dot" data-slide="1"></span>
            <span class="dot" data-slide="2"></span>
            <span class="dot" data-slide="3"></span>
            <span class="dot" data-slide="4"></span>
        </div>
    </section>

    <!-- БЛОК 1: Акції цього місяця -->
    <section class="hero-banner">
        <div class="container">
            <a href="promo.html" class="hero-banner-link">
                <span class="hero-banner-text">АКЦІЇ ЦЬОГО МІСЯЦЯ</span>
                <span class="hero-banner-arrow" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </span>
            </a>
        </div>
    </section>

    <!-- Карусель 1: Популярні акції -->
    <section class="carousel-section">
        <div class="container">
            <h2 class="section-title">Популярні акції</h2>

            <div class="carousel-wrap">
                <button class="carousel-btn carousel-btn-prev" id="carouselPrev" aria-label="Назад">‹</button>
                <div class="carousel" id="carousel">
                    <p class="carousel-loading">Завантаження...</p>
                </div>
                <button class="carousel-btn carousel-btn-next" id="carouselNext" aria-label="Вперед">›</button>
            </div>
        </div>
    </section>

    <!-- БЛОК 2: Обирай свій смак (алкоголь) -->
    <section class="hero-banner hero-banner-alcohol">
        <div class="container">
            <a href="alcohol.html" class="hero-banner-link hero-banner-link-alcohol">
                <span class="hero-banner-text">ОБИРАЙ СВІЙ СМАК</span>
                <span class="hero-banner-arrow" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </span>
            </a>
        </div>
    </section>

    <!-- Карусель 2: Алкоголь -->
    <section class="carousel-section">
        <div class="container">
            <h2 class="section-title">Алкогольні та слабоалкогольні напої за супер ціною</h2>

            <div class="carousel-wrap">
                <button class="carousel-btn carousel-btn-prev" id="alcoholPrev" aria-label="Назад">‹</button>
                <div class="carousel" id="alcoholCarousel">
                    <p class="carousel-loading">Завантаження...</p>
                </div>
                <button class="carousel-btn carousel-btn-next" id="alcoholNext" aria-label="Вперед">›</button>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Ваш ПАРТНЕР. Усі права захищено.</p>
        </div>
    </footer>

    <script>
        const PLACEHOLDER = './images/0.png';

        function noCache(url) {
            const separator = url.includes('?') ? '&' : '?';
            return url + separator + 't=' + Date.now();
        }

        // ====== БУРГЕР-МЕНЮ ======
        const burgerBtn = document.getElementById('burgerBtn');
        const mainNav = document.getElementById('mainNav');
        const menuOverlay = document.getElementById('menuOverlay');

        function toggleMenu() {
            burgerBtn.classList.toggle('active');
            mainNav.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            document.body.classList.toggle('menu-open');
        }
        function closeMenu() {
            burgerBtn.classList.remove('active');
            mainNav.classList.remove('active');
            menuOverlay.classList.remove('active');
            document.body.classList.remove('menu-open');
        }
        burgerBtn.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', closeMenu);
        mainNav.querySelectorAll('a').forEach(l => l.addEventListener('click', closeMenu));

        // ====== БАНЕР-КАРУСЕЛЬ ======
        const bannerSlides = document.querySelectorAll('.banner-slide');
        const bannerDots = document.querySelectorAll('.banner-dots .dot');
        let currentSlide = 0;
        let bannerInterval = null;

        function showSlide(index) {
            bannerSlides.forEach((slide, i) => slide.classList.toggle('active', i === index));
            bannerDots.forEach((dot, i) => dot.classList.toggle('active', i === index));
            currentSlide = index;
        }
        function nextSlide() {
            showSlide((currentSlide + 1) % bannerSlides.length);
        }
        function startBannerAuto() {
            stopBannerAuto();
            bannerInterval = setInterval(nextSlide, 5000);
        }
        function stopBannerAuto() {
            if (bannerInterval) { clearInterval(bannerInterval); bannerInterval = null; }
        }
        if (bannerSlides.length > 0) { showSlide(0); startBannerAuto(); }
        bannerDots.forEach(dot => {
            dot.addEventListener('click', () => {
                showSlide(parseInt(dot.dataset.slide));
                startBannerAuto();
            });
        });
        const bannerEl = document.getElementById('bannerCarousel');
        if (bannerEl) {
            bannerEl.addEventListener('mouseenter', stopBannerAuto);
            bannerEl.addEventListener('mouseleave', startBannerAuto);
        }

        // ====== ЗАГАЛЬНІ ФУНКЦІЇ КАРУСЕЛІ ======
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function makeCard(item) {
            const card = document.createElement('div');
            card.className = 'card';
        
            const priceRaw = Number(item.price ?? item.newPrice ?? 0);
            const priceInt = Math.floor(priceRaw);
            const priceCents = Math.round((priceRaw - priceInt) * 100)
                .toString().padStart(2, '0');
        
            const oldPrice = item.oldPrice ? Math.round(Number(item.oldPrice)) : '';
            const imgSrc = noCache(item.image);
        
            card.innerHTML = `
                ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
                <div class="card-image">
                    <img src="${imgSrc}" alt="${item.name}" loading="lazy"
                         onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                </div>
                <div class="card-body">
                    ${oldPrice ? `<div class="old-price">${oldPrice} ₴</div>` : ''}
                    <div class="new-price">
                        <span class="price-int">${priceInt}</span>
                        <span class="price-cents-wrap">
                            <span class="price-cents">${priceCents}</span>
                            <span class="price-unit">грн/шт</span>
                        </span>
                    </div>
                    <h3>${item.name}</h3>
                    ${item.validUntil ? `<p class="valid-until">Акція діє до ${item.validUntil}</p>` : ''}
                </div>
            `;
            return card;
        }

        function makeGoCard(href, text) {
            const card = document.createElement('a');
            card.href = href;
            card.className = 'card card-go';
            card.innerHTML = `
                <div class="card-go-inner">
                    <div class="card-go-arrow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </div>
                    <span>${text}</span>
                </div>
            `;
            return card;
        }

        function setupCarouselArrows(carouselId, prevId, nextId) {
            const el = document.getElementById(carouselId);
            document.getElementById(prevId).addEventListener('click', () => {
                el.scrollBy({ left: -300, behavior: 'smooth' });
            });
            document.getElementById(nextId).addEventListener('click', () => {
                el.scrollBy({ left: 300, behavior: 'smooth' });
            });
        }

        // Прокрутка
        setupCarouselArrows('carousel', 'carouselPrev', 'carouselNext');
        setupCarouselArrows('alcoholCarousel', 'alcoholPrev', 'alcoholNext');

        // ====== ЗАВАНТАЖЕННЯ ТОВАРІВ ======
        fetch(noCache('./data/promotions.json'))
            .then(r => r.ok ? r.json() : Promise.reject('Помилка'))
            .then(data => {
                const items = (data.items || []).filter(it => it.visible !== false);

                // ====== КАРУСЕЛЬ 1: Популярні акції ======
                const carousel = document.getElementById('carousel');
                const popular = shuffle(items).slice(0, 6);
                carousel.innerHTML = '';
                if (popular.length === 0) {
                    carousel.innerHTML = '<p class="carousel-loading">Акцій поки що немає</p>';
                } else {
                    popular.forEach(it => carousel.appendChild(makeCard(it)));
                    carousel.appendChild(makeGoCard('promo.html', 'Перейти до всіх акцій'));
                }

                // ====== КАРУСЕЛЬ 2: Алкоголь ======
                const alcoholCarousel = document.getElementById('alcoholCarousel');
                const alcoholItems = items.filter(it =>
                    (it.category || '').toLowerCase().includes('алкоголь')
                );
                const alcoholRandom = shuffle(alcoholItems).slice(0, 6);

                alcoholCarousel.innerHTML = '';
                if (alcoholRandom.length === 0) {
                    alcoholCarousel.innerHTML = '<p class="carousel-loading">Алкогольних акцій поки що немає</p>';
                } else {
                    alcoholRandom.forEach(it => alcoholCarousel.appendChild(makeCard(it)));
                    alcoholCarousel.appendChild(makeGoCard('alcohol.html', 'Перейти до алкоголю'));
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('carousel').innerHTML =
                    '<p class="carousel-loading">Не вдалося завантажити</p>';
                document.getElementById('alcoholCarousel').innerHTML =
                    '<p class="carousel-loading">Не вдалося завантажити</p>';
            });
    </script>

</body>
</html>
