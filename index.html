<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Головна | Ваш ПАРТНЕР</title>
    <link rel="stylesheet" href="style.css?v=10">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <img src="./image_site/_2.jpg" alt="Логотип" onerror="this.onerror=null; this.style.display='none'; this.parentElement.innerHTML='Ваш<span>ПАРТНЕР</span>';">
            </a>

            <button class="burger" id="burgerBtn" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav" id="mainNav">
                <a href="/">Головна</a>
                <a href="promo.html">Акції</a>
                <a href="#">Контакти</a>
            </nav>
        </div>
    </header>

    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Головний блок з кнопкою -->
    <section class="hero">
        <div class="container">
            <h1 class="hero-title">Ласкаво просимо!</h1>
            <p class="hero-subtitle">Найкращі пропозиції та акції для вас</p>

            <a href="promo.html" class="hero-btn">
                АКЦІЇ ЦЬОГО МІСЯЦЯ
            </a>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Ваш ПАРТНЕР. Усі права захищено.</p>
        </div>
    </footer>

    <script>
        // ====== БУРГЕР-МЕНЮ ======
        const burgerBtn = document.getElementById('burgerBtn');
        const mainNav = document.getElementById('mainNav');
        const menuOverlay = document.getElementById('menuOverlay');

        function toggleMenu() {
            burgerBtn.classList.toggle('active');
            mainNav.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            document.body.classList.toggle('menu-open');
        }

        function closeMenu() {
            burgerBtn.classList.remove('active');
            mainNav.classList.remove('active');
            menuOverlay.classList.remove('active');
            document.body.classList.remove('menu-open');
        }

        burgerBtn.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', closeMenu);
        mainNav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', closeMenu);
        });
    </script>

</body>
</html>
