<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МЕГА ЦІНА | Ваш ПАРТНЕР</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: #fff;
        }

        /* ============================================================
           СЛАЙД: 50 / 50
           ============================================================ */
        .mega-slide {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(ellipse at 25% 20%, rgba(255, 255, 255, 0.32), transparent 55%),
                radial-gradient(ellipse at 80% 85%, rgba(255, 210, 0, 0.35), transparent 60%),
                linear-gradient(135deg, #FFC91A 0%, #FFA800 55%, #E68400 100%);

            animation: slideIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, transform;
        }

        @keyframes slideIn {
            0%   { opacity: 0; transform: scale(1.06); }
            100% { opacity: 1; transform: scale(1); }
        }

        .mega-slide::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-conic-gradient(
                from -20deg at 100% 50%,
                rgba(255, 255, 255, 0.06) 0deg 5deg,
                transparent 5deg 14deg
            );
            pointer-events: none;
            z-index: 1;
        }

        /* ============================================================
           ЛІВО — білий квадрат з товаром
           ============================================================ */
        .left-half {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3vh 2vw;
            position: relative;
            z-index: 2;
        }

        /* .product-area — статична зона (для позиціонування бейджа) */
        .product-area {
            width: min(96%, 96vh);
            aspect-ratio: 1 / 1;
            position: relative;
        }

        /* .product-wrap — гойдається */
        .product-wrap {
            width: 100%;
            height: 100%;
            position: relative;
            animation: rock 7s ease-in-out 0.9s infinite;
            transform-origin: center 80%;
            will-change: transform;
        }

        @keyframes rock {
            0%, 100% { transform: rotate(-2.5deg); }
            50%      { transform: rotate(2.5deg); }
        }

        /* .product-square — вхід, тінь, рамка */
        .product-square {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: clamp(16px, 2.5vh, 32px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4%;
            position: relative;
            box-shadow:
                0 20px 60px rgba(120, 60, 0, 0.4),
                0 8px 25px rgba(0, 0, 0, 0.25),
                inset 0 0 0 3px rgba(255, 220, 100, 0.55);
            animation: productIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
            will-change: transform, opacity;
        }

        @keyframes productIn {
            0%   { opacity: 0; transform: scale(0.7) rotate(-8deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: productBreath 5s ease-in-out 0.8s infinite;
            will-change: transform;
        }

        @keyframes productBreath {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.04); }
        }

        /* ============================================================
           БЕЙДЖ ЗНИЖКИ — правий верхній кут, статичний (не гойдається)
           ============================================================ */
        .discount-badge {
            position: absolute;
            top: -3%;
            right: -3%;
            display: inline-flex;
            align-items: center;
            gap: 0.7vw;
            background: #FF0A00;
            color: #ffffff;
            padding: 1.1vh 2.2vw;
            border-radius: 60px;
            font-size: clamp(20px, 3.4vh, 44px);
            font-weight: 900;
            letter-spacing: 0.02em;
            white-space: nowrap;
            z-index: 20;
            box-shadow:
                0 12px 32px rgba(200, 0, 0, 0.7),
                0 5px 14px rgba(0, 0, 0, 0.35),
                inset 0 -3px 8px rgba(0, 0, 0, 0.25),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);
            animation: discountIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s both,
                       discountBounce 3s ease-in-out 2.2s infinite;
            will-change: transform, opacity;
        }

        @keyframes discountIn {
            0%   { opacity: 0; transform: scale(0.3) rotate(-15deg); }
            60%  { opacity: 1; transform: scale(1.18) rotate(4deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes discountBounce {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50%      { transform: scale(1.07) rotate(-2deg); }
        }

        .discount-badge .label {
            font-size: 0.58em;
            font-weight: 700;
            letter-spacing: 0.18em;
            opacity: 0.95;
            padding-left: 0.2em;
        }

        .discount-badge.hidden { display: none; }

        /* ============================================================
           ПРАВО — 50/50
           ============================================================ */
        .right-half {
            display: grid;
            grid-template-rows: 1fr 1fr;
            padding: 3vh 3vw 5vh 1.5vw;
            position: relative;
            z-index: 2;
        }

        /* ---------- ВЕРХНІЙ КВАДРАТ ---------- */
        .top-square {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            text-align: left;
            gap: clamp(6px, 1vh, 12px);
            padding: 1vh 2%;
            overflow: hidden;
        }

        .mega-title {
            font-size: clamp(48px, 7.5vw, 240px);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: 0.01em;
            text-transform: uppercase;
            color: #ffffff;
            white-space: nowrap;
            width: 100%;
            text-shadow:
                0 8px 26px rgba(100, 40, 0, 0.8),
                0 3px 8px rgba(0, 0, 0, 0.55),
                0 0 80px rgba(255, 240, 180, 0.55);
            animation: megaTitleIn 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s both;
            will-change: transform, opacity, letter-spacing;
        }

        @keyframes megaTitleIn {
            0%   { opacity: 0; transform: scale(0.4) translateY(30px); letter-spacing: 0.35em; }
            100% { opacity: 1; transform: scale(1) translateY(0);     letter-spacing: 0.01em; }
        }

        .manufacturer {
            font-size: clamp(13px, 1.9vh, 22px);
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 2px 6px rgba(80, 30, 0, 0.75), 0 1px 2px rgba(0, 0, 0, 0.4);
            text-align: left;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            animation: fadeUp 0.6s ease-out 0.35s both;
        }

        .product-name {
            font-size: clamp(40px, 8.5vh, 100px);
            font-weight: 700;
            line-height: 1.02;
            color: #ffffff;
            text-shadow: 0 3px 10px rgba(80, 30, 0, 0.75), 0 1px 3px rgba(0, 0, 0, 0.45);
            width: 100%;
            text-align: left;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: fadeUp 0.7s ease-out 0.55s both;
        }

        /* ---------- НИЖНІЙ КВАДРАТ ---------- */
        .bottom-square {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            text-align: left;
            gap: clamp(4px, 0.8vh, 12px);
            padding: 1vh 2%;
            position: relative;
        }

        /* Стара закреслена ціна */
        .old-price-old {
            font-size: clamp(36px, 6.5vh, 100px);
            font-weight: 600;
            color: rgba(80, 30, 0, 0.65);
            text-decoration: line-through;
            text-decoration-thickness: clamp(4px, 0.7vh, 8px);
            text-decoration-color: rgba(80, 30, 0, 0.8);
            letter-spacing: 0.01em;
            line-height: 1;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);
            animation: fadeUp 0.5s ease-out 0.35s both;
        }

        .old-price-old.hidden { display: none; }

        /* Акційна ціна — ЯСКРАВИЙ ЧЕРВОНИЙ + підскоки */
        .mega-price {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            flex-wrap: nowrap;
            line-height: 0.85;
            color: #FF0A00;
            white-space: nowrap;
            animation:
                priceIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s both,
                priceJump 10s ease-in-out 1.5s infinite;
            will-change: transform, opacity;
            transform-origin: left center;
        }

        @keyframes priceIn {
            0%   { opacity: 0; transform: scale(0.4) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Два підскоки на 10 секунд — о 10% і о 50% циклу */
        @keyframes priceJump {
            0%, 8%    { transform: scale(1) rotate(0deg); }
            9%        { transform: scale(1.14) rotate(-1deg); }
            11%       { transform: scale(1.04) rotate(0.5deg); }
            13%       { transform: scale(1.1) rotate(-0.5deg); }
            15%, 48%  { transform: scale(1) rotate(0deg); }
            49%       { transform: scale(1.14) rotate(-1deg); }
            51%       { transform: scale(1.04) rotate(0.5deg); }
            53%       { transform: scale(1.1) rotate(-0.5deg); }
            55%, 100% { transform: scale(1) rotate(0deg); }
        }

        .mega-price .price-int {
            font-size: clamp(120px, min(18vw, 38vh), 800px);
            font-weight: 900;
            letter-spacing: -0.055em;
            text-shadow:
                0 4px 14px rgba(200, 0, 0, 0.6),
                0 0 50px rgba(255, 240, 200, 0.65),
                0 0 20px rgba(255, 20, 10, 0.4);
        }

        .mega-price .price-cents-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-top: clamp(8px, 1.6vh, 26px);
            padding-left: 0.4vw;
        }

        .mega-price .price-cents {
            font-size: clamp(52px, min(7vw, 15vh), 300px);
            font-weight: 800;
            line-height: 1;
            text-shadow:
                0 3px 10px rgba(200, 0, 0, 0.55),
                0 0 25px rgba(255, 240, 200, 0.5),
                0 0 12px rgba(255, 20, 10, 0.35);
        }

        .mega-price .price-unit {
            font-size: clamp(12px, 1.9vh, 22px);
            font-weight: 700;
            color: rgba(160, 10, 10, 0.9);
            margin-top: 0.6vh;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           ДАТИ АКЦІЇ — низ-справа
           ============================================================ */
        .promo-dates {
            position: fixed;
            bottom: 2vh;
            right: 2vw;
            background: rgba(0, 0, 0, 0.42);
            color: #ffffff;
            padding: 1vh 2vh;
            border-radius: 30px;
            font-size: clamp(11px, 1.6vh, 16px);
            font-weight: 600;
            letter-spacing: 0.03em;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            z-index: 10;
            animation: fadeUp 0.7s ease-out 1.1s both;
            pointer-events: none;
        }

        /* ============================================================
           АДАПТИВНІСТЬ
           ============================================================ */
        @media (max-width: 900px) {
            .mega-slide {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
            .left-half { padding: 2vh 5vw; }
            .product-area { width: min(85%, 40vh); }

            .right-half {
                padding: 1vh 5vw 6vh;
            }

            .mega-title { font-size: clamp(36px, 9vw, 90px); }
            .mega-price .price-int { font-size: min(22vw, 20vh); }
            .mega-price .price-cents { font-size: min(9vw, 8vh); }
            .mega-price .price-unit { font-size: clamp(10px, 1.5vh, 15px); }
            .product-name { font-size: clamp(28px, 6vh, 56px); -webkit-line-clamp: 3; }
            .old-price-old { font-size: clamp(28px, 5vh, 64px); }
            .promo-dates { font-size: 10px; padding: 6px 12px; bottom: 1vh; right: 2vw; }

            .discount-badge {
                top: -2.5%;
                right: -2.5%;
                font-size: clamp(16px, 2.6vh, 32px);
                padding: 0.8vh 3.5vw;
            }
        }

        @media (max-width: 500px) {
            .mega-title { font-size: clamp(28px, 8.5vw, 52px); }
            .mega-price .price-int { font-size: min(24vw, 18vh); }
            .mega-price .price-cents { font-size: min(10vw, 7vh); }
            .product-name { font-size: clamp(24px, 5vh, 42px); }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01s !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01s !important;
            }
            .product-wrap { animation: none !important; }
            .mega-price { animation: none !important; }
        }
    </style>
</head>
<body>

    <div class="mega-slide" id="megaSlide">

        <!-- ЛІВО -->
        <div class="left-half">
            <div class="product-area">

                <!-- Квадрат, що гойдається -->
                <div class="product-wrap">
                    <div class="product-square">
                        <img src="./images/0.png" alt="Товар" class="product-img" id="productImg"
                             onerror="this.onerror=null; this.src='./images/0.png';">
                    </div>
                </div>

                <!-- Бейдж знижки — статичний, правий верхній кут -->
                <div class="discount-badge" id="discountBadge">
                    <span id="discountValue">−0%</span>
                    <span class="label">ЗНИЖКА</span>
                </div>

            </div>
        </div>

        <!-- ПРАВО -->
        <div class="right-half">

            <div class="top-square">
                <div class="mega-title">МЕГА ЦІНА</div>
                <div class="manufacturer" id="manufacturer"></div>
                <div class="product-name" id="productName"></div>
            </div>

            <div class="bottom-square">
                <div class="old-price-old" id="oldPrice"></div>
                <div class="mega-price">
                    <span class="price-int" id="priceInt">0</span>
                    <span class="price-cents-wrap">
                        <span class="price-cents" id="priceCents">00</span>
                        <span class="price-unit">грн/шт</span>
                    </span>
                </div>
            </div>

        </div>
    </div>

    <!-- ДАТИ АКЦІЇ -->
    <div class="promo-dates" id="promoDates"></div>

    <script>
    (function () {
        'use strict';

        const PLACEHOLDER = './images/0.png';

        function noCache(url) {
            const sep = url.includes('?') ? '&' : '?';
            return url + sep + 't=' + Date.now();
        }

        function priceParts(raw) {
            const num = Number(raw ?? 0);
            const int = Math.floor(num);
            const cents = Math.round((num - int) * 100).toString().padStart(2, '0');
            return { int, cents };
        }

        function isChampagneFraGuli(item) {
            const name = (item.name || '').toLowerCase();
            const man  = (item.manufacturer || '').toLowerCase();
            const both = name + ' ' + man;
            if (both.includes('шампанськ')) return true;
            if (both.includes('фра') && both.includes('гулі')) return true;
            if (both.includes('fra') && both.includes('guli')) return true;
            if (both.includes('fra') && both.includes('gouli')) return true;
            return false;
        }

        function formatDates() {
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth();
            const start = new Date(y, m, 1);
            const end = new Date(y, m + 1, 0);
            const pad = n => String(n).padStart(2, '0');
            const fmt = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
            return `Акційна пропозиція діє з ${fmt(start)} - ${fmt(end)}`;
        }

        document.getElementById('promoDates').textContent = formatDates();

        fetch(noCache('./data/promotions.json'))
            .then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
            .then(data => {
                const raw = (data.items || []).filter(it => {
                    if (it.visible === false) return false;
                    if (it.outOfStock === true) return false;
                    if (isChampagneFraGuli(it)) return false;
                    return true;
                });

                let pool = raw.filter(it => it.bestPrice === true);
                if (pool.length === 0) pool = raw;

                if (pool.length === 0) {
                    showError('Немає товарів для показу');
                    return;
                }

                const item = pool[Math.floor(Math.random() * pool.length)];
                renderItem(item);
            })
            .catch(err => {
                console.error('Помилка завантаження:', err);
                showError('Помилка завантаження');
            });

        function showError(msg) {
            const right = document.querySelector('.right-half');
            if (right) {
                right.innerHTML = `
                    <div style="grid-column:1/-1; display:flex; align-items:center;
                                justify-content:center; text-align:center;
                                color:#fff; font-size:clamp(18px,2.5vh,28px);
                                font-weight:800; padding:40px;
                                text-shadow:0 3px 12px rgba(80,30,0,0.7);">
                        ${msg}
                    </div>`;
            }
        }

        function renderItem(item) {
            const manEl = document.getElementById('manufacturer');
            if (manEl) {
                if (item.manufacturer) {
                    manEl.textContent = item.manufacturer;
                } else {
                    manEl.style.display = 'none';
                }
            }

            const nameEl = document.getElementById('productName');
            if (nameEl) nameEl.textContent = item.name || '';

            const imgEl = document.getElementById('productImg');
            if (imgEl && item.image) {
                imgEl.src = noCache(item.image);
                imgEl.alt = item.name || 'Товар';
            }

            const oldPriceEl = document.getElementById('oldPrice');
            const oldPriceNum = item.oldPrice ? Number(item.oldPrice) : 0;
            const newPriceNum = Number(item.price || 0);

            if (oldPriceEl) {
                if (oldPriceNum > newPriceNum && oldPriceNum > 0) {
                    oldPriceEl.textContent = Math.round(oldPriceNum) + ' ₴';
                } else {
                    oldPriceEl.classList.add('hidden');
                }
            }

            const { int, cents } = priceParts(item.price);
            const intEl = document.getElementById('priceInt');
            const centsEl = document.getElementById('priceCents');
            if (intEl)   intEl.textContent = int;
            if (centsEl) centsEl.textContent = cents;

            const discountValueEl = document.getElementById('discountValue');
            const badgeEl = document.getElementById('discountBadge');
            let discountPercent = 0;

            if (item.discount != null && item.discount !== '') {
                const d = Math.abs(Number(item.discount));
                if (!isNaN(d) && d > 0 && d <= 100) {
                    discountPercent = Math.round(d);
                }
            }

            if (discountPercent === 0 && oldPriceNum > newPriceNum && newPriceNum > 0) {
                discountPercent = Math.round((1 - newPriceNum / oldPriceNum) * 100);
            }

            if (discountPercent > 0 && discountValueEl) {
                discountValueEl.textContent = '−' + discountPercent + '%';
            } else if (badgeEl) {
                badgeEl.classList.add('hidden');
            }
        }

    })();
    </script>
</body>
</html>
