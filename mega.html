<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МЕГА ЦІНА | Ваш ПАРТНЕР</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: #fff;
        }

        /* ============================================================
           СЛАЙД: 50 / 50
           ============================================================ */
        .mega-slide {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(ellipse at 25% 20%, rgba(255, 255, 255, 0.32), transparent 55%),
                radial-gradient(ellipse at 80% 85%, rgba(255, 210, 0, 0.35), transparent 60%),
                linear-gradient(135deg, #FFC91A 0%, #FFA800 55%, #E68400 100%);

            animation: slideIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, transform;
        }

        @keyframes slideIn {
            0%   { opacity: 0; transform: scale(1.06); }
            100% { opacity: 1; transform: scale(1); }
        }

        .mega-slide::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-conic-gradient(
                from -20deg at 100% 50%,
                rgba(255, 255, 255, 0.06) 0deg 5deg,
                transparent 5deg 14deg
            );
            pointer-events: none;
            z-index: 1;
        }

        /* ============================================================
           ЛІВО — білий квадрат з товаром
           ============================================================ */
        .left-half {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4vh 3vw;
            position: relative;
            z-index: 2;
        }

        .product-square {
            width: min(88%, 88vh);
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border-radius: clamp(16px, 2.5vh, 32px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5%;
            position: relative;
            box-shadow:
                0 20px 60px rgba(120, 60, 0, 0.4),
                0 8px 25px rgba(0, 0, 0, 0.25),
                inset 0 0 0 3px rgba(255, 220, 100, 0.55);
            animation: productIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
            will-change: transform, opacity;
        }

        @keyframes productIn {
            0%   { opacity: 0; transform: scale(0.7) rotate(-8deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: productBreath 5s ease-in-out 0.8s infinite;
            will-change: transform;
        }

        @keyframes productBreath {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.04); }
        }

        .best-icon {
            position: absolute;
            top: -6%;
            right: -6%;
            width: 22%;
            height: auto;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.35));
            animation: bestIconPulse 2.6s ease-in-out 1.2s infinite;
            z-index: 3;
            will-change: transform;
        }

        @keyframes bestIconPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50%      { transform: scale(1.1) rotate(-6deg); }
        }

        /* ============================================================
           ПРАВО — 50/50 вертикально
           ============================================================ */
        .right-half {
            display: grid;
            grid-template-rows: 1fr 1fr;
            padding: 3vh 3vw 3vh 1.5vw;
            position: relative;
            z-index: 2;
        }

        /* ---------- ВЕРХНІЙ КВАДРАТ ---------- */
        .top-square {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            text-align: left;
            gap: clamp(6px, 1vh, 14px);
            padding: 1.5vh 2%;
            overflow: hidden;
        }

        /* МЕГА ЦІНА — заповнює ширину блоку */
        .mega-title {
            font-size: clamp(48px, 8vw, 260px);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: 0.01em;
            text-transform: uppercase;
            color: #ffffff;
            white-space: nowrap;
            width: 100%;
            text-shadow:
                0 8px 26px rgba(100, 40, 0, 0.8),
                0 3px 8px rgba(0, 0, 0, 0.55),
                0 0 80px rgba(255, 240, 180, 0.55);
            animation: megaTitleIn 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s both;
            will-change: transform, opacity, letter-spacing;
        }

        @keyframes megaTitleIn {
            0%   { opacity: 0; transform: scale(0.4) translateY(30px); letter-spacing: 0.35em; }
            100% { opacity: 1; transform: scale(1) translateY(0);     letter-spacing: 0.01em; }
        }

        .manufacturer {
            font-size: clamp(13px, 1.9vh, 22px);
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 2px 6px rgba(80, 30, 0, 0.75), 0 1px 2px rgba(0, 0, 0, 0.4);
            text-align: left;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            animation: fadeUp 0.6s ease-out 0.35s both;
        }

        .product-name {
            font-size: clamp(40px, 8.8vh, 108px);
            font-weight: 700;
            line-height: 1.05;
            color: #ffffff;
            text-shadow: 0 3px 10px rgba(80, 30, 0, 0.75), 0 1px 3px rgba(0, 0, 0, 0.45);
            width: 100%;
            text-align: left;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: fadeUp 0.7s ease-out 0.55s both;
        }

        /* ---------- НИЖНІЙ КВАДРАТ ---------- */
        .bottom-square {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            text-align: left;
            gap: clamp(10px, 1.8vh, 24px);
            padding: 1.5vh 2%;
            position: relative;
        }

        .mega-price {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            line-height: 0.85;
            color: #D40000;
            animation: priceIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s both,
                       pricePulse 3.2s ease-in-out 1.6s infinite;
            will-change: transform, opacity;
        }

        @keyframes priceIn {
            0%   { opacity: 0; transform: scale(0.4) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes pricePulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.03); }
        }

        .mega-price .price-int {
            font-size: clamp(120px, 32vh, 360px);
            font-weight: 900;
            letter-spacing: -0.055em;
            text-shadow:
                0 4px 14px rgba(120, 0, 0, 0.55),
                0 0 40px rgba(255, 240, 200, 0.55);
        }

        .mega-price .price-cents-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-top: 1.8vh;
            padding-left: 0.4vw;
        }

        .mega-price .price-cents {
            font-size: clamp(52px, 12vh, 140px);
            font-weight: 800;
            line-height: 1;
            text-shadow:
                0 3px 10px rgba(120, 0, 0, 0.5),
                0 0 25px rgba(255, 240, 200, 0.4);
        }

        .mega-price .price-unit {
            font-size: clamp(12px, 1.9vh, 22px);
            font-weight: 700;
            color: rgba(140, 20, 20, 0.85);
            margin-top: 0.6vh;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .discount-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.7vw;
            background: #D40000;
            color: #ffffff;
            padding: 1.2vh 2.6vw;
            border-radius: 60px;
            font-size: clamp(20px, 3.6vh, 46px);
            font-weight: 900;
            letter-spacing: 0.02em;
            white-space: nowrap;
            box-shadow:
                0 10px 30px rgba(180, 0, 0, 0.55),
                0 4px 12px rgba(0, 0, 0, 0.3),
                inset 0 -3px 8px rgba(0, 0, 0, 0.25),
                inset 0 2px 4px rgba(255, 255, 255, 0.15);
            animation: discountIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.75s both,
                       discountBounce 3s ease-in-out 2.2s infinite;
            will-change: transform, opacity;
        }

        @keyframes discountIn {
            0%   { opacity: 0; transform: scale(0.3) rotate(-15deg); }
            60%  { opacity: 1; transform: scale(1.18) rotate(4deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes discountBounce {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50%      { transform: scale(1.07) rotate(-2deg); }
        }

        .discount-badge .label {
            font-size: 0.58em;
            font-weight: 700;
            letter-spacing: 0.18em;
            opacity: 0.95;
            padding-left: 0.2em;
        }

        .discount-badge.hidden { display: none; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           АДАПТИВНІСТЬ
           ============================================================ */
        @media (max-width: 900px) {
            .mega-slide {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
            .left-half { padding: 2.5vh 6vw; }
            .product-square { width: min(80%, 38vh); }

            .right-half { padding: 1.5vh 5vw 2.5vh; }

            .mega-title { font-size: clamp(40px, 8.5vw, 90px); }
            .mega-price .price-int { font-size: clamp(80px, 17vh, 200px); }
            .mega-price .price-cents { font-size: clamp(36px, 8vh, 80px); }
            .mega-price .price-unit { font-size: clamp(10px, 1.6vh, 16px); }
            .discount-badge { font-size: clamp(18px, 2.8vh, 34px); padding: 1vh 5vw; }
            .product-name { font-size: clamp(30px, 6.5vh, 60px); -webkit-line-clamp: 2; }
        }

        @media (max-width: 500px) {
            .mega-title { font-size: clamp(30px, 8vw, 56px); }
            .mega-price .price-int { font-size: clamp(64px, 15vh, 140px); }
            .mega-price .price-cents { font-size: clamp(28px, 7vh, 60px); }
            .product-name { font-size: clamp(26px, 5.5vh, 48px); }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01s !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01s !important;
            }
        }
    </style>
</head>
<body>

    <div class="mega-slide" id="megaSlide">

        <!-- ЛІВО: білий квадрат з товаром -->
        <div class="left-half">
            <div class="product-square">
                <img src="./images/0.png" alt="Товар" class="product-img" id="productImg"
                     onerror="this.onerror=null; this.src='./images/0.png';">
                <img src="./image_site/photo.png" alt="Найспрайс" class="best-icon"
                     onerror="this.style.display='none';">
            </div>
        </div>

        <!-- ПРАВО: 50/50 -->
        <div class="right-half">

            <!-- ВЕРХНІЙ КВАДРАТ: МЕГА ЦІНА → виробник → назва (всі зліва) -->
            <div class="top-square">
                <div class="mega-title">МЕГА ЦІНА</div>
                <div class="manufacturer" id="manufacturer"></div>
                <div class="product-name" id="productName"></div>
            </div>

            <!-- НИЖНІЙ КВАДРАТ: ціна → знижка (всі зліва) -->
            <div class="bottom-square">
                <div class="mega-price">
                    <span class="price-int" id="priceInt">0</span>
                    <span class="price-cents-wrap">
                        <span class="price-cents" id="priceCents">00</span>
                        <span class="price-unit">грн/шт</span>
                    </span>
                </div>
                <div class="discount-badge" id="discountBadge">
                    <span id="discountValue">−0%</span>
                    <span class="label">ЗНИЖКА</span>
                </div>
            </div>

        </div>
    </div>

    <script>
    (function () {
        'use strict';

        const PLACEHOLDER = './images/0.png';

        function noCache(url) {
            const sep = url.includes('?') ? '&' : '?';
            return url + sep + 't=' + Date.now();
        }

        function priceParts(raw) {
            const num = Number(raw ?? 0);
            const int = Math.floor(num);
            const cents = Math.round((num - int) * 100).toString().padStart(2, '0');
            return { int, cents };
        }

        function isChampagneFraGuli(item) {
            const name = (item.name || '').toLowerCase();
            const man  = (item.manufacturer || '').toLowerCase();
            const both = name + ' ' + man;
            if (both.includes('шампанськ')) return true;
            if (both.includes('фра') && both.includes('гулі')) return true;
            if (both.includes('fra') && both.includes('guli')) return true;
            if (both.includes('fra') && both.includes('gouli')) return true;
            return false;
        }

        /* ============================================================
           ЗАВАНТАЖЕННЯ
           ============================================================ */
        fetch(noCache('./data/promotions.json'))
            .then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
            .then(data => {
                const raw = (data.items || []).filter(it => {
                    if (it.visible === false) return false;
                    if (it.outOfStock === true) return false;
                    if (isChampagneFraGuli(it)) return false;
                    return true;
                });

                // Пріоритет — товари з bestPrice: true
                let pool = raw.filter(it => it.bestPrice === true);
                if (pool.length === 0) pool = raw;

                if (pool.length === 0) {
                    showError('Немає товарів для показу');
                    return;
                }

                const item = pool[Math.floor(Math.random() * pool.length)];
                renderItem(item);
            })
            .catch(err => {
                console.error('Помилка завантаження:', err);
                showError('Помилка завантаження');
            });

        function showError(msg) {
            const right = document.querySelector('.right-half');
            if (right) {
                right.innerHTML = `
                    <div style="grid-column:1/-1; display:flex; align-items:center;
                                justify-content:center; text-align:center;
                                color:#fff; font-size:clamp(18px,2.5vh,28px);
                                font-weight:800; padding:40px;
                                text-shadow:0 3px 12px rgba(80,30,0,0.7);">
                        ${msg}
                    </div>`;
            }
        }

        /* ============================================================
           РЕНДЕР
           ============================================================ */
        function renderItem(item) {
            // Виробник
            const manEl = document.getElementById('manufacturer');
            if (manEl) {
                if (item.manufacturer) {
                    manEl.textContent = item.manufacturer;
                } else {
                    manEl.style.display = 'none';
                }
            }

            // Назва
            const nameEl = document.getElementById('productName');
            if (nameEl) nameEl.textContent = item.name || '';

            // Фото
            const imgEl = document.getElementById('productImg');
            if (imgEl && item.image) {
                imgEl.src = noCache(item.image);
                imgEl.alt = item.name || 'Товар';
            }

            // Ціна
            const { int, cents } = priceParts(item.price);
            const intEl = document.getElementById('priceInt');
            const centsEl = document.getElementById('priceCents');
            if (intEl)   intEl.textContent = int;
            if (centsEl) centsEl.textContent = cents;

            // Знижка
            const discountValueEl = document.getElementById('discountValue');
            const badgeEl = document.getElementById('discountBadge');
            let discountPercent = 0;

            if (item.discount != null && item.discount !== '') {
                const d = Math.abs(Number(item.discount));
                if (!isNaN(d) && d > 0 && d <= 100) {
                    discountPercent = Math.round(d);
                }
            }

            if (discountPercent === 0 && item.oldPrice) {
                const oldP = Number(item.oldPrice);
                const newP = Number(item.price);
                if (oldP > 0 && newP > 0 && oldP > newP) {
                    discountPercent = Math.round((1 - newP / oldP) * 100);
                }
            }

            if (discountPercent > 0 && discountValueEl) {
                discountValueEl.textContent = '−' + discountPercent + '%';
            } else if (badgeEl) {
                badgeEl.classList.add('hidden');
            }
        }

    })();
    </script>
</body>
</html>
