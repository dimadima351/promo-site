<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смачні ціни | Ваш ПАРТНЕР</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            cursor: pointer;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body.is-fullscreen { cursor: default; }

        /* ============================================================
           ШАПКА
           ============================================================ */
        .promo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: clamp(10px, 1.5vh, 20px);
            padding: clamp(8px, 1.2vh, 14px) clamp(20px, 2.5vw, 40px);
            background: linear-gradient(135deg, #ff2b2b, #d90000);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255, 11, 11, 0.25);
            z-index: 100;
            flex-shrink: 0;
        }

        .promo-logo {
            display: flex;
            align-items: center;
            gap: clamp(8px, 1vw, 14px);
            flex-shrink: 1;
            min-width: 0;
        }

        .promo-logo img {
            height: clamp(30px, 4.5vh, 54px);
            width: auto;
            object-fit: contain;
            display: block;
            flex-shrink: 0;
        }

        .promo-logo-text {
            font-size: clamp(16px, 3vh, 28px);
            font-weight: 800;
            letter-spacing: clamp(0.5px, 0.15vw, 2px);
            text-transform: uppercase;
            line-height: 1;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .promo-dates {
            font-size: clamp(11px, 1.6vh, 15px);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.18);
            padding: clamp(5px, 0.9vh, 9px) clamp(10px, 1.4vw, 20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ============================================================
           ОСНОВНА ЧАСТИНА
           ============================================================ */
        .random-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: clamp(6px, 1vh, 16px) clamp(14px, 1.8vw, 32px) clamp(8px, 1.2vh, 20px);
        }

        .random-container {
            width: 100%;
            max-width: 1700px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .random-container.fade-in {
            animation: fadeInCard 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeInCard {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); filter: blur(8px); }
            60% { opacity: 1; filter: blur(0); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .random-loading {
            text-align: center;
            color: #888;
            font-size: clamp(14px, 2.5vh, 20px);
        }

        /* ============================================================
           АНІМАЦІЯ ПІДСКОКУ
           ============================================================ */
        @keyframes priceBounce {
            0%   { transform: scale(1); }
            30%  { transform: scale(1.18); }
            50%  { transform: scale(1.10); }
            70%  { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes priceBounceSmall {
            0%   { transform: scale(1); }
            30%  { transform: scale(1.12); }
            50%  { transform: scale(1.06); }
            70%  { transform: scale(1.10); }
            100% { transform: scale(1); }
        }

        .new-price.bounce-animate {
            animation: priceBounce 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: left bottom;
        }

        .grid-card .new-price.bounce-animate {
            animation: priceBounceSmall 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: left bottom;
        }

        /* ============================================================
           РЕЖИМ A: ОДНА КАРТКА
           ============================================================ */
        .mode-single {
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            gap: clamp(14px, 2.5vh, 36px);
            align-items: center;
            width: 100%;
            height: 100%;
            max-height: 100%;
            background: #fff;
            border: 2px solid #f0f0f0;
            border-radius: clamp(14px, 2vh, 24px);
            padding: clamp(12px, 2vh, 28px) clamp(16px, 2.2vw, 36px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            overflow: visible;
        }

        .mode-single .img-wrap {
            position: relative;
            aspect-ratio: 1 / 1;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(4px, 0.8vh, 12px);
            overflow: visible;
        }

        .mode-single .img-wrap img.main-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: imageBreath 6s ease-in-out infinite;
        }

        @keyframes imageBreath {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.04); }
        }

        .badge {
            position: absolute;
            top: 0;
            left: 0;
            width: clamp(60px, 10vh, 110px);
            height: clamp(60px, 10vh, 110px);
            border-radius: 50%;
            background: linear-gradient(135deg, #ff2b2b, #d90000);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(16px, 2.8vh, 30px);
            font-weight: 800;
            z-index: 10;
            box-shadow: 0 8px 24px rgba(255, 11, 11, 0.45), inset 0 -4px 10px rgba(0, 0, 0, 0.12);
            letter-spacing: -1px;
            animation: badgePop 0.5s ease-out 0.3s backwards,
                       badgePulse 2.4s ease-in-out 0.8s infinite;
            will-change: transform;
        }

        @keyframes badgePop {
            0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
            70%  { transform: scale(1.15) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        @keyframes badgePulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .best-price-icon {
            position: absolute;
            top: 0;
            right: 0;
            width: clamp(48px, 8vh, 90px);
            height: clamp(48px, 8vh, 90px);
            object-fit: contain;
            z-index: 5;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.15));
            animation: bestSpin 0.7s ease-out 0.5s backwards;
        }

        @keyframes bestSpin {
            0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
            70%  { transform: scale(1.1) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .mode-single .info {
            display: flex;
            flex-direction: column;
            gap: clamp(4px, 0.8vh, 12px);
            min-width: 0;
            overflow: visible;
        }

        .manufacturer {
            font-size: clamp(16px, 2.5vh, 30px);
            color: #999;
            text-transform: uppercase;
            letter-spacing: clamp(1px, 0.2vw, 3px);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .name {
            font-size: clamp(34px, 7.5vh, 92px);
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.05;
            letter-spacing: -1px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .prices {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: clamp(2px, 0.5vh, 8px);
            overflow: visible;
        }

        .old-price {
            font-size: clamp(26px, 4.6vh, 62px);
            color: #b0b0b0;
            text-decoration: line-through;
            margin-bottom: 2px;
            font-weight: 400;
        }

        .new-price {
            display: flex;
            align-items: flex-end;
            line-height: 1;
            color: #ff0b0b;
            gap: clamp(2px, 0.4vw, 8px);
            will-change: transform;
        }

        .new-price .price-int {
            font-size: clamp(90px, 23vh, 260px);
            font-weight: 800;
            line-height: 0.85;
            letter-spacing: -5px;
            text-shadow: 0 4px 20px rgba(255, 11, 11, 0.15);
        }

        .new-price .price-cents-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-bottom: clamp(10px, 2vh, 22px);
        }

        .new-price .price-cents {
            font-size: clamp(42px, 10vh, 108px);
            font-weight: 600;
            line-height: 1;
        }

        .new-price .price-unit {
            font-size: clamp(13px, 2.2vh, 26px);
            font-weight: 400;
            color: #999;
            margin-top: 4px;
        }

        /* ============================================================
           РЕЖИМ C: ДВІ ВЕЛИКІ КАРТКИ (нова)
           ============================================================ */
        .mode-double {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(10px, 1.8vh, 24px);
            max-height: 100%;
        }

        .double-card {
            display: grid;
            grid-template-rows: 1.15fr 1fr;   /* фото зверху, текст знизу */
            gap: clamp(6px, 1vh, 14px);
            align-items: center;
            background: #fff;
            border: 2px solid #f0f0f0;
            border-radius: clamp(14px, 2vh, 24px);
            padding: clamp(12px, 1.8vh, 24px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            overflow: visible;
            min-height: 0;
        }

        .double-card .img-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(2px, 0.6vh, 8px);
            overflow: visible;
        }

        .double-card .img-wrap img.main-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .double-card .badge {
            width: clamp(56px, 9vh, 100px);
            height: clamp(56px, 9vh, 100px);
            font-size: clamp(15px, 2.5vh, 26px);
            top: -4px;
            left: -4px;
            animation: badgePop 0.5s ease-out 0.3s backwards,
                       badgePulse 2.4s ease-in-out 0.8s infinite;
        }

        .double-card .best-price-icon {
            width: clamp(44px, 7vh, 78px);
            height: clamp(44px, 7vh, 78px);
            top: -4px;
            right: -4px;
        }

        .double-card .info {
            display: flex;
            flex-direction: column;
            gap: clamp(2px, 0.5vh, 8px);
            min-width: 0;
            overflow: visible;
            align-items: flex-start;
            justify-content: center;
        }

        .double-card .manufacturer {
            font-size: clamp(12px, 1.8vh, 20px);
            letter-spacing: clamp(0.8px, 0.18vw, 2.5px);
            color: #999;
            text-transform: uppercase;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .double-card .name {
            font-size: clamp(22px, 4.2vh, 52px);
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.1;
            letter-spacing: -0.8px;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .double-card .prices {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: clamp(2px, 0.4vh, 6px);
            overflow: visible;
        }

        .double-card .old-price {
            font-size: clamp(20px, 3.2vh, 42px);
            color: #b0b0b0;
            text-decoration: line-through;
            margin-bottom: 2px;
            font-weight: 400;
        }

        .double-card .new-price {
            display: flex;
            align-items: flex-end;
            line-height: 1;
            color: #ff0b0b;
            gap: clamp(2px, 0.35vw, 6px);
            will-change: transform;
        }

        .double-card .new-price .price-int {
            font-size: clamp(76px, 16vh, 180px);
            font-weight: 800;
            line-height: 0.85;
            letter-spacing: -4px;
            text-shadow: 0 4px 20px rgba(255, 11, 11, 0.15);
        }

        .double-card .new-price .price-cents-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-bottom: clamp(8px, 1.6vh, 18px);
        }

        .double-card .new-price .price-cents {
            font-size: clamp(36px, 7.5vh, 84px);
            font-weight: 600;
            line-height: 1;
        }

        .double-card .new-price .price-unit {
            font-size: clamp(12px, 1.9vh, 22px);
            font-weight: 400;
            color: #999;
            margin-top: 3px;
        }

        /* Анімація підскоку для режиму C */
        .double-card .new-price.bounce-animate {
            animation: priceBounce 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: left bottom;
        }

        /* ============================================================
           РЕЖИМ B: 4 КАРТКИ
           ============================================================ */
        .mode-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: clamp(8px, 1.2vh, 16px);
            max-height: 100%;
        }

        .grid-card {
            display: grid;
            grid-template-columns: 0.8fr 1.5fr;
            gap: clamp(8px, 1vw, 16px);
            align-items: center;
            background: #fff;
            border: 2px solid #f0f0f0;
            border-radius: clamp(10px, 1.6vh, 18px);
            padding: clamp(8px, 1.4vh, 16px) clamp(10px, 1.4vw, 20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            min-height: 0;
            overflow: visible;
        }

        .grid-card .img-wrap {
            position: relative;
            aspect-ratio: 1 / 1;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            overflow: visible;
        }

        .grid-card .img-wrap img.main-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .grid-card .badge {
            width: clamp(42px, 6.5vh, 68px);
            height: clamp(42px, 6.5vh, 68px);
            font-size: clamp(12px, 1.8vh, 18px);
            top: -6px;
            left: -6px;
            animation: badgePop 0.5s ease-out 0.3s backwards,
                       badgePulse 2.4s ease-in-out 0.8s infinite;
        }

        .grid-card .best-price-icon {
            width: clamp(32px, 5vh, 52px);
            height: clamp(32px, 5vh, 52px);
            top: -4px;
            right: -4px;
        }

        .grid-card .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            overflow: visible;
        }

        .grid-card .manufacturer {
            font-size: clamp(9px, 1.1vh, 12px);
            letter-spacing: clamp(0.5px, 0.15vw, 1.5px);
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .grid-card .name {
            font-size: clamp(16px, 3.2vh, 38px);
            font-weight: 800;
            color: #2c3e50;
            line-height: 1.1;
            letter-spacing: -0.5px;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .grid-card .prices {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: 2px;
            overflow: visible;
        }

        .grid-card .old-price {
            font-size: clamp(14px, 2.4vh, 30px);
            color: #b0b0b0;
            text-decoration: line-through;
            margin-bottom: 1px;
        }

        .grid-card .new-price {
            display: flex;
            align-items: flex-end;
            line-height: 1;
            color: #ff0b0b;
            gap: 2px;
            will-change: transform;
        }

        .grid-card .new-price .price-int {
            font-size: clamp(58px, 11vh, 130px);
            font-weight: 800;
            line-height: 0.85;
            letter-spacing: -2px;
        }

        .grid-card .new-price .price-cents-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-bottom: clamp(3px, 1vh, 12px);
        }

        .grid-card .new-price .price-cents {
            font-size: clamp(26px, 5vh, 58px);
            font-weight: 600;
            line-height: 1;
        }

        .grid-card .new-price .price-unit {
            font-size: clamp(9px, 1.3vh, 16px);
            font-weight: 400;
            color: #999;
            margin-top: 1px;
        }

        /* ============================================================
           FULLSCREEN ПІДКАЗКА
           ============================================================ */
        .fullscreen-hint {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.9);
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: clamp(10px, 1.4vh, 13px);
            font-weight: 500;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            animation: hintPulse 2s ease-in-out infinite;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        @keyframes hintPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50%      { transform: translateX(-50%) scale(1.05); }
        }

        .fullscreen-hint.hidden { opacity: 0; }
        .fullscreen-hint svg { width: 14px; height: 14px; }

        /* ============================================================
           ДЛЯ ШИРОКИХ ЕКРАНІВ
           ============================================================ */
        @media (min-width: 1600px) {
            .random-container {
                max-width: 1800px;
            }
        }

        /* ============================================================
           ДЛЯ НИЗЬКИХ ЕКРАНІВ
           ============================================================ */
        @media (max-height: 700px) {
            .name {
                font-size: clamp(24px, 5vh, 52px);
            }
            .new-price .price-int {
                font-size: clamp(70px, 17vh, 160px);
            }
            .new-price .price-cents {
                font-size: clamp(30px, 7vh, 72px);
            }
            .old-price {
                font-size: clamp(20px, 3.5vh, 42px);
            }
            .manufacturer {
                font-size: clamp(12px, 1.8vh, 22px);
            }

            .double-card .name {
                font-size: clamp(18px, 3.2vh, 34px);
            }
            .double-card .new-price .price-int {
                font-size: clamp(60px, 13vh, 130px);
            }
            .double-card .new-price .price-cents {
                font-size: clamp(28px, 6vh, 60px);
            }
            .double-card .old-price {
                font-size: clamp(16px, 2.5vh, 30px);
            }

            .grid-card .name {
                font-size: clamp(14px, 2.4vh, 26px);
            }
            .grid-card .new-price .price-int {
                font-size: clamp(44px, 8vh, 88px);
            }
            .grid-card .new-price .price-cents {
                font-size: clamp(20px, 3.6vh, 42px);
            }
            .grid-card .old-price {
                font-size: clamp(11px, 1.8vh, 22px);
            }
        }

        /* ============================================================
           МОБІЛЬНА ВЕРСІЯ
           ============================================================ */
        @media (max-width: 900px) {
            html, body { overflow: auto; cursor: default; }

            .promo-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 10px 14px;
            }

            .promo-logo img { height: 32px; }
            .promo-logo-text { font-size: 18px; letter-spacing: 1px; white-space: normal; }
            .promo-dates { font-size: 11px; padding: 6px 10px; }

            .random-main { padding: 12px 12px 16px; align-items: flex-start; }

            .mode-single {
                grid-template-columns: 1fr;
                gap: 14px;
                padding: 14px;
                border-radius: 14px;
                max-height: none;
                height: auto;
            }

            .mode-single .img-wrap { padding: 8px; max-height: 40vh; }
            .mode-single .img-wrap img.main-img { animation: none; }

            .mode-single .name { font-size: 28px; }
            .mode-single .manufacturer { font-size: 14px; letter-spacing: 1.5px; }
            .mode-single .old-price { font-size: 24px; }
            .mode-single .new-price .price-int { font-size: 88px; letter-spacing: -3px; }
            .mode-single .new-price .price-cents { font-size: 38px; }
            .mode-single .new-price .price-unit { font-size: 13px; }

            .mode-single .badge {
                width: 64px; height: 64px;
                font-size: 17px;
            }

            .mode-single .best-price-icon {
                width: 48px; height: 48px;
            }

            /* Режим C на телефоні */
            .mode-double {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
                gap: 14px;
                height: auto;
            }

            .double-card {
                grid-template-rows: auto auto;
                padding: 14px;
                border-radius: 14px;
                gap: 10px;
            }

            .double-card .name { font-size: 20px; }
            .double-card .new-price .price-int { font-size: 64px; }
            .double-card .new-price .price-cents { font-size: 28px; }
            .double-card .old-price { font-size: 18px; }

            .mode-grid {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(4, auto);
                gap: 12px;
                height: auto;
            }

            .grid-card {
                grid-template-columns: 0.8fr 1.5fr;
                padding: 10px 12px;
                gap: 10px;
                border-radius: 12px;
                min-height: 120px;
            }

            .grid-card .name { font-size: 17px; }
            .grid-card .new-price .price-int { font-size: 58px; letter-spacing: -2px; }
            .grid-card .new-price .price-cents { font-size: 26px; }
            .grid-card .old-price { font-size: 14px; }
            .grid-card .badge { width: 44px; height: 44px; font-size: 13px; }
            .grid-card .best-price-icon { width: 36px; height: 36px; }

            .fullscreen-hint { display: none; }
        }

        @media (max-width: 400px) {
            .mode-single .name { font-size: 24px; }
            .mode-single .new-price .price-int { font-size: 74px; }
            .mode-single .new-price .price-cents { font-size: 32px; }

            .double-card .name { font-size: 17px; }
            .double-card .new-price .price-int { font-size: 54px; }
            .double-card .new-price .price-cents { font-size: 24px; }

            .grid-card .name { font-size: 15px; }
            .grid-card .new-price .price-int { font-size: 48px; }
            .grid-card .new-price .price-cents { font-size: 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .badge, .best-price-icon,
            .mode-single .img-wrap img.main-img,
            .new-price {
                animation: none !important;
            }
        }
    </style>
</head>
<body>

    <header class="promo-header">
        <div class="promo-logo">
            <img src="./image_site/_22.png" alt="Логотип"
                 onerror="this.style.display='none';">
            <div class="promo-logo-text">Смачні ціни</div>
        </div>
        <div class="promo-dates" id="promoDates">Акційна пропозиція діє...</div>
    </header>

    <main class="random-main">
        <div class="random-container" id="randomContainer">
            <p class="random-loading">Завантаження...</p>
        </div>
    </main>

    <div class="fullscreen-hint" id="fullscreenHint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        <span>Клікніть будь-де для повного екрану</span>
    </div>

    <script>
        const PLACEHOLDER = './images/0.png';

        function noCache(url) {
            const separator = url.includes('?') ? '&' : '?';
            return url + separator + 't=' + Date.now();
        }

        let allItems = [];
        let mode = 'single';       // 'single' | 'double' | 'grid'
        let lastSingleId = null;
        let autoTimer = null;
        let bounceTimer = null;

        function isDesktop() {
            return window.innerWidth > 900;
        }

        function formatDates() {
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth();

            const start = new Date(y, m, 1);
            const end = new Date(y, m + 1, 0);

            const pad = n => String(n).padStart(2, '0');
            const fmt = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;

            return `з ${fmt(start)} - ${fmt(end)}`;
        }

        function pickSingle() {
            if (allItems.length === 0) return null;
            let pool = allItems;
            if (allItems.length > 1 && lastSingleId !== null) {
                pool = allItems.filter(it => it.id !== lastSingleId);
            }
            const item = pool[Math.floor(Math.random() * pool.length)];
            lastSingleId = item.id;
            return item;
        }

        /* 2 товари — з однієї категорії, якщо можливо */
        function pickSameCategory2() {
            if (allItems.length < 2) return allItems.slice(0, 2);

            const groups = {};
            allItems.forEach(it => {
                const cat = it.category || 'Інше';
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(it);
            });

            const validCats = Object.keys(groups).filter(c => groups[c].length >= 2);

            if (validCats.length === 0) {
                const shuffled = [...allItems].sort(() => Math.random() - 0.5);
                return shuffled.slice(0, 2);
            }

            const cat = validCats[Math.floor(Math.random() * validCats.length)];
            const pool = [...groups[cat]];

            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            return pool.slice(0, 2);
        }

        function pickSameCategory4() {
            if (allItems.length < 4) return allItems.slice(0, 4);

            const groups = {};
            allItems.forEach(it => {
                const cat = it.category || 'Інше';
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(it);
            });

            const validCats = Object.keys(groups).filter(c => groups[c].length >= 4);

            if (validCats.length === 0) {
                const shuffled = [...allItems].sort(() => Math.random() - 0.5);
                return shuffled.slice(0, 4);
            }

            const cat = validCats[Math.floor(Math.random() * validCats.length)];
            const pool = [...groups[cat]];

            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            return pool.slice(0, 4);
        }

        function priceParts(raw) {
            const num = Number(raw ?? 0);
            const int = Math.floor(num);
            const cents = Math.round((num - int) * 100).toString().padStart(2, '0');
            return { int, cents };
        }

        function renderSingle(item) {
            const { int, cents } = priceParts(item.price);
            const oldPrice = item.oldPrice ? Math.round(Number(item.oldPrice)) : '';
            const imgSrc = noCache(item.image);

            return `
                <div class="mode-single">
                    <div class="img-wrap">
                        ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
                        ${item.bestPrice ? `<img src="./image_site/photo.png" alt="Найспрайс" class="best-price-icon" onerror="this.style.display='none';">` : ''}
                        <img src="${imgSrc}" alt="${item.name}" class="main-img"
                             onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                    </div>
                    <div class="info">
                        ${item.manufacturer ? `<div class="manufacturer">${item.manufacturer}</div>` : ''}
                        <h1 class="name">${item.name}</h1>
                        <div class="prices">
                            ${oldPrice ? `<div class="old-price">${oldPrice} ₴</div>` : ''}
                            <div class="new-price">
                                <span class="price-int">${int}</span>
                                <span class="price-cents-wrap">
                                    <span class="price-cents">${cents}</span>
                                    <span class="price-unit">грн/шт</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDouble(items) {
            return `
                <div class="mode-double">
                    ${items.map(item => {
                        const { int, cents } = priceParts(item.price);
                        const oldPrice = item.oldPrice ? Math.round(Number(item.oldPrice)) : '';
                        const imgSrc = noCache(item.image);
                        return `
                            <div class="double-card">
                                <div class="img-wrap">
                                    ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
                                    ${item.bestPrice ? `<img src="./image_site/photo.png" alt="Найспрайс" class="best-price-icon" onerror="this.style.display='none';">` : ''}
                                    <img src="${imgSrc}" alt="${item.name}" class="main-img"
                                         onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                                </div>
                                <div class="info">
                                    ${item.manufacturer ? `<div class="manufacturer">${item.manufacturer}</div>` : ''}
                                    <div class="name">${item.name}</div>
                                    <div class="prices">
                                        ${oldPrice ? `<div class="old-price">${oldPrice} ₴</div>` : ''}
                                        <div class="new-price">
                                            <span class="price-int">${int}</span>
                                            <span class="price-cents-wrap">
                                                <span class="price-cents">${cents}</span>
                                                <span class="price-unit">грн/шт</span>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderGrid(items) {
            return `
                <div class="mode-grid">
                    ${items.map(item => {
                        const { int, cents } = priceParts(item.price);
                        const oldPrice = item.oldPrice ? Math.round(Number(item.oldPrice)) : '';
                        const imgSrc = noCache(item.image);
                        return `
                            <div class="grid-card">
                                <div class="img-wrap">
                                    ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
                                    ${item.bestPrice ? `<img src="./image_site/photo.png" alt="Найспрайс" class="best-price-icon" onerror="this.style.display='none';">` : ''}
                                    <img src="${imgSrc}" alt="${item.name}" class="main-img"
                                         onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                                </div>
                                <div class="info">
                                    ${item.manufacturer ? `<div class="manufacturer">${item.manufacturer}</div>` : ''}
                                    <div class="name">${item.name}</div>
                                    <div class="prices">
                                        ${oldPrice ? `<div class="old-price">${oldPrice} ₴</div>` : ''}
                                        <div class="new-price">
                                            <span class="price-int">${int}</span>
                                            <span class="price-cents-wrap">
                                                <span class="price-cents">${cents}</span>
                                                <span class="price-unit">грн/шт</span>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function triggerPriceBounce() {
            const priceEls = document.querySelectorAll('.new-price');
            priceEls.forEach(el => {
                el.classList.remove('bounce-animate');
                void el.offsetWidth;
                el.classList.add('bounce-animate');
            });
        }

        function scheduleBounce() {
            if (bounceTimer) clearTimeout(bounceTimer);
            bounceTimer = setTimeout(triggerPriceBounce, 3000);
        }

        /* Логіка послідовності: single → double → grid → single → ... */
        function nextMode(current) {
            if (current === 'single') return 'double';
            if (current === 'double') return 'grid';
            return 'single';
        }

        function updateContent() {
            const container = document.getElementById('randomContainer');

            if (allItems.length === 0) {
                container.innerHTML = '<p class="random-loading">Немає товарів</p>';
                return;
            }

            let html = '';

            if (mode === 'single') {
                const item = pickSingle();
                if (item) html = renderSingle(item);
            } else if (mode === 'double') {
                const items = pickSameCategory2();
                if (items.length) html = renderDouble(items);
            } else {
                const items = pickSameCategory4();
                if (items.length) html = renderGrid(items);
            }

            container.innerHTML = html;

            container.classList.remove('fade-in');
            void container.offsetWidth;
            container.classList.add('fade-in');

            scheduleBounce();

            /* Перемикаємо режим: single → double → grid → single */
            mode = nextMode(mode);
        }

        function startAutoUpdate() {
            if (!isDesktop()) return;
            stopAutoUpdate();
            autoTimer = setInterval(updateContent, 10000);
        }
        function stopAutoUpdate() {
            if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
        }
        window.addEventListener('resize', () => {
            if (isDesktop()) startAutoUpdate(); else stopAutoUpdate();
        });

        function toggleFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement) {
                const req = el.requestFullscreen
                    || el.webkitRequestFullscreen
                    || el.mozRequestFullScreen
                    || el.msRequestFullscreen;
                if (req) {
                    req.call(el).then(() => {
                        document.body.classList.add('is-fullscreen');
                        document.getElementById('fullscreenHint').classList.add('hidden');
                    }).catch(err => console.log('Fullscreen недоступний:', err));
                }
            }
        }
        if (isDesktop()) {
            document.addEventListener('click', function handleFirstClick() {
                if (document.fullscreenElement) return;
                toggleFullscreen();
                document.removeEventListener('click', handleFirstClick);
            }, { once: true });
        }
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('is-fullscreen');
                document.getElementById('fullscreenHint').classList.remove('hidden');
            }
        });

        document.getElementById('promoDates').textContent =
            'Акційна пропозиція діє ' + formatDates();

        fetch(noCache('./data/promotions.json'))
            .then(r => r.ok ? r.json() : Promise.reject('Помилка'))
            .then(data => {
                allItems = (data.items || []).filter(it => {
                    if (it.visible === false) return false;
                    if (it.outOfStock === true) return false;
                    const cat = (it.category || '').toLowerCase();
                    if (cat.includes('ярня')) return false;
                    return true;
                });

                if (allItems.length === 0) {
                    document.getElementById('randomContainer').innerHTML =
                        '<p class="random-loading">Немає товарів для показу</p>';
                    return;
                }

                updateContent();
                startAutoUpdate();
            })
            .catch(err => {
                console.error(err);
                document.getElementById('randomContainer').innerHTML =
                    '<p class="random-loading">Помилка завантаження</p>';
            });
    </script>

</body>
</html>
