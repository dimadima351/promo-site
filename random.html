<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реклама | Ваш ПАРТНЕР</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        /* ============================================================
           БАЗОВІ НАЛАШТУВАННЯ
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            cursor: pointer;   /* показуємо, що можна клікнути */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Коли повноекранний режим увімкнено — курсор звичайний */
        body.is-fullscreen {
            cursor: default;
        }

        .random-container {
            width: 100%;
            max-width: 1500px;
            padding: 40px;
        }

        .random-container.fade-in {
            animation: fadeInCard 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeInCard {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
                filter: blur(8px);
            }
            60% {
                opacity: 1;
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .random-loading {
            text-align: center;
            color: #888;
            font-size: 20px;
        }

        /* ============================================================
           ПІДКАЗКА "КЛІКНІТЬ ДЛЯ ПОВНОГО ЕКРАНУ"
           ============================================================ */
        .fullscreen-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            animation: hintPulse 2s ease-in-out infinite;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        @keyframes hintPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50%      { transform: translateX(-50%) scale(1.05); }
        }

        .fullscreen-hint.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .fullscreen-hint svg {
            width: 18px;
            height: 18px;
        }

        /* ============================================================
           КАРТКА ТОВАРУ — БІЛА РАМКА
           ============================================================ */
        .random-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            background: #ffffff;
            border: 2px solid #f0f0f0;
            border-radius: 24px;
            padding: 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            max-height: 90vh;
        }

        /* ---------- Картинка ---------- */
        .random-image-wrap {
            position: relative;
            aspect-ratio: 1 / 1;
            background: #ffffff;
            border: 1px solid #f5f5f5;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            overflow: hidden;
        }

        .random-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            animation: imageBreath 6s ease-in-out infinite;
        }

        @keyframes imageBreath {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.04); }
        }

        .random-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ff0b0b;
            color: #fff;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 26px;
            font-weight: 700;
            z-index: 5;
            box-shadow: 0 6px 18px rgba(255, 11, 11, 0.35);
            animation: badgePop 0.5s ease-out 0.3s backwards;
        }

        @keyframes badgePop {
            0%   { transform: scale(0.3) rotate(-15deg); opacity: 0; }
            70%  { transform: scale(1.15) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .random-best-price {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 90px;
            height: 90px;
            object-fit: contain;
            z-index: 5;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.15));
            animation: bestSpin 0.7s ease-out 0.5s backwards;
        }

        @keyframes bestSpin {
            0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
            70%  { transform: scale(1.1) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        /* ---------- Інформація ---------- */
        .random-info {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .random-manufacturer {
            font-size: 20px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 500;
            opacity: 0;
            animation: fadeUp 0.6s ease-out 0.2s forwards;
        }

        .random-name {
            font-size: 62px;
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.05;
            margin: 0;
            letter-spacing: -1.5px;
            opacity: 0;
            animation: fadeUp 0.7s ease-out 0.3s forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Ціни ---------- */
        .random-prices {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: 10px;
            opacity: 0;
            animation: fadeUp 0.7s ease-out 0.45s forwards;
        }

        .random-old-price {
            font-size: 38px;
            color: #b0b0b0;
            text-decoration: line-through;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .random-new-price {
            display: flex;
            align-items: flex-end;
            line-height: 1;
            color: #ff0b0b;
            gap: 6px;
        }

        .random-new-price .price-int {
            font-size: 150px;
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -6px;
            text-shadow: 0 4px 20px rgba(255, 11, 11, 0.15);
        }

        .random-new-price .price-cents-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-bottom: 16px;
        }

        .random-new-price .price-cents {
            font-size: 62px;
            font-weight: 600;
            line-height: 1;
        }

        .random-new-price .price-unit {
            font-size: 20px;
            font-weight: 400;
            color: #999;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           МОБІЛЬНА ВЕРСІЯ
           ============================================================ */
        @media (max-width: 900px) {
            html, body {
                overflow: auto;
                cursor: default;
            }

            body {
                align-items: flex-start;
                padding: 16px;
            }

            .random-container {
                padding: 0;
            }

            .random-card {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
                border-radius: 16px;
                max-height: none;
            }

            .random-image-wrap {
                padding: 16px;
                border-radius: 12px;
            }

            .random-image {
                animation: none;
            }

            .random-badge {
                font-size: 18px;
                padding: 8px 14px;
                top: 12px;
                left: 12px;
                border-radius: 6px;
            }

            .random-best-price {
                width: 55px;
                height: 55px;
                top: 12px;
                right: 12px;
            }

            .random-manufacturer {
                font-size: 13px;
                letter-spacing: 1.5px;
            }

            .random-name {
                font-size: 30px;
                letter-spacing: -0.5px;
            }

            .random-old-price {
                font-size: 20px;
            }

            .random-new-price .price-int {
                font-size: 78px;
                letter-spacing: -3px;
            }

            .random-new-price .price-cents {
                font-size: 32px;
            }

            .random-new-price .price-unit {
                font-size: 14px;
            }

            .fullscreen-hint {
                display: none;   /* на телефоні підказку ховаємо */
            }
        }

        @media (max-width: 400px) {
            .random-name {
                font-size: 24px;
            }

            .random-new-price .price-int {
                font-size: 64px;
                letter-spacing: -2px;
            }

            .random-new-price .price-cents {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <div class="random-container" id="randomContainer">
        <p class="random-loading">Завантаження...</p>
    </div>

    <!-- Підказка для повноекранного режиму -->
    <div class="fullscreen-hint" id="fullscreenHint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        <span>Клікніть будь-де для повного екрану</span>
    </div>

    <script>
        const PLACEHOLDER = './images/0.png';

        function noCache(url) {
            const separator = url.includes('?') ? '&' : '?';
            return url + separator + 't=' + Date.now();
        }

        let allItems = [];
        let currentId = null;
        let autoTimer = null;

        // ====== ЧИ ЦЕ КОМП'ЮТЕР? ======
        function isDesktop() {
            return window.innerWidth > 900;
        }

        // ====== ПОВНОЕКРАННИЙ РЕЖИМ ======
        function toggleFullscreen() {
            const el = document.documentElement;   // вся сторінка

            if (!document.fullscreenElement) {
                // Входимо в повноекранний режим
                const request = el.requestFullscreen
                    || el.webkitRequestFullscreen
                    || el.mozRequestFullScreen
                    || el.msRequestFullscreen;

                if (request) {
                    request.call(el).then(() => {
                        document.body.classList.add('is-fullscreen');
                        document.getElementById('fullscreenHint').classList.add('hidden');
                    }).catch((err) => {
                        console.log('Повноекранний режим недоступний:', err);
                    });
                }
            }
        }

        // Слухаємо перший клік будь-де на сторінці
        // (тільки на комп'ютері, і тільки один раз)
        if (isDesktop()) {
            document.addEventListener('click', function handleFirstClick() {
                // Якщо вже в повноекранному режимі — нічого не робимо
                if (document.fullscreenElement) return;

                toggleFullscreen();

                // Більше не слухаємо
                document.removeEventListener('click', handleFirstClick);
            }, { once: true });
        }

        // Якщо користувач вийшов з повноекранного режиму (Escape) —
        // повертаємо підказку
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('is-fullscreen');
                document.getElementById('fullscreenHint').classList.remove('hidden');
            }
        });

        // ====== ВИБІР ВИПАДКОВОГО ТОВАРУ ======
        function pickRandomItem() {
            const available = allItems.filter(it => it.outOfStock !== true);
            if (available.length === 0) return null;

            let pool = available;
            if (available.length > 1 && currentId !== null) {
                pool = available.filter(it => it.id !== currentId);
            }

            const item = pool[Math.floor(Math.random() * pool.length)];
            currentId = item.id;
            return item;
        }

        // ====== РЕНДЕР ТОВАРУ ======
        function renderItem(item) {
            const container = document.getElementById('randomContainer');
            const priceRaw = Number(item.price ?? 0);
            const priceInt = Math.floor(priceRaw);
            const priceCents = Math.round((priceRaw - priceInt) * 100)
                .toString().padStart(2, '0');
            const oldPrice = item.oldPrice ? Math.round(Number(item.oldPrice)) : '';
            const imgSrc = noCache(item.image);

            container.innerHTML = `
                <div class="random-card">
                    <div class="random-image-wrap">
                        ${item.badge ? `<div class="random-badge">${item.badge}</div>` : ''}
                        ${item.bestPrice ? `<img src="./image_site/photo.png" alt="Найспрайс" class="random-best-price" onerror="this.style.display='none';">` : ''}
                        <img src="${imgSrc}" alt="${item.name}" class="random-image"
                             onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                    </div>

                    <div class="random-info">
                        ${item.manufacturer ? `<div class="random-manufacturer">${item.manufacturer}</div>` : ''}

                        <h1 class="random-name">${item.name}</h1>

                        <div class="random-prices">
                            ${oldPrice ? `<div class="random-old-price">${oldPrice} ₴</div>` : ''}
                            <div class="random-new-price">
                                <span class="price-int">${priceInt}</span>
                                <span class="price-cents-wrap">
                                    <span class="price-cents">${priceCents}</span>
                                    <span class="price-unit">грн/шт</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Перезапускаємо анімацію
            container.classList.remove('fade-in');
            void container.offsetWidth;
            container.classList.add('fade-in');
        }

        // ====== ОНОВЛЕННЯ ТОВАРУ ======
        function updateItem() {
            const item = pickRandomItem();
            if (!item) {
                document.getElementById('randomContainer').innerHTML =
                    '<p class="random-loading">Немає товарів у наявності</p>';
                return;
            }
            renderItem(item);
        }

        // ====== ЗАПУСК АВТООНОВЛЕННЯ (тільки комп) ======
        function startAutoUpdate() {
            if (!isDesktop()) return;
            stopAutoUpdate();
            autoTimer = setInterval(updateItem, 10000);
        }

        function stopAutoUpdate() {
            if (autoTimer) {
                clearInterval(autoTimer);
                autoTimer = null;
            }
        }

        window.addEventListener('resize', () => {
            if (isDesktop()) startAutoUpdate();
            else stopAutoUpdate();
        });

        // ====== ЗАВАНТАЖЕННЯ ДАНИХ ======
        fetch(noCache('./data/promotions.json'))
            .then(r => r.ok ? r.json() : Promise.reject('Помилка'))
            .then(data => {
                allItems = (data.items || []).filter(it => it.visible !== false);

                if (allItems.length === 0) {
                    document.getElementById('randomContainer').innerHTML =
                        '<p class="random-loading">Немає товарів</p>';
                    return;
                }

                updateItem();
                startAutoUpdate();
            })
            .catch(err => {
                console.error(err);
                document.getElementById('randomContainer').innerHTML =
                    '<p class="random-loading">Помилка завантаження</p>';
            });
    </script>

</body>
</html>
