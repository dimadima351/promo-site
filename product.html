<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар | Ваш ПАРТНЕР</title>
    <link rel="stylesheet" href="style.css?v=60">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <img src="./image_site/_22.png" alt="Логотип"
                     onerror="this.style.display='none'; this.parentElement.innerHTML='Ваш<span>ПАРТНЕР</span>';">
            </a>

            <button class="burger" id="burgerBtn" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav" id="mainNav">
                <a href="/">Головна</a>
                <a href="promo.html">Акції</a>
                <a href="alcohol.html">Алкоголь</a>
                <a href="coffee.html">Кава та чай</a>
                <a href="#">Контакти</a>
            </nav>
        </div>
    </header>

    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Хлібні крихти -->
    <nav class="breadcrumbs">
        <div class="container">
            <a href="/">Головна</a>
            <span class="sep">›</span>
            <a href="promo.html" id="breadcrumb-parent">Акції</a>
            <span class="sep">›</span>
            <span class="current" id="breadcrumb-name">Товар</span>
        </div>
    </nav>

    <!-- Сторінка товару -->
    <main class="container product-page" id="productContainer">
        <p class="loading">Завантаження...</p>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Ваш ПАРТНЕР. Усі права захищено.</p>
        </div>
    </footer>

    <script>
        const PLACEHOLDER = './images/0.png';

        function noCache(url) {
            const separator = url.includes('?') ? '&' : '?';
            return url + separator + 't=' + Date.now();
        }

        // ====== БУРГЕР-МЕНЮ ======
        const burgerBtn = document.getElementById('burgerBtn');
        const mainNav = document.getElementById('mainNav');
        const menuOverlay = document.getElementById('menuOverlay');

        function toggleMenu() {
            burgerBtn.classList.toggle('active');
            mainNav.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            document.body.classList.toggle('menu-open');
        }
        function closeMenu() {
            burgerBtn.classList.remove('active');
            mainNav.classList.remove('active');
            menuOverlay.classList.remove('active');
            document.body.classList.remove('menu-open');
        }
        burgerBtn.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', closeMenu);
        mainNav.querySelectorAll('a').forEach(l => l.addEventListener('click', closeMenu));

        // ====== ОТРИМАННЯ ID З URL ======
        function getIdFromUrl() {
            return new URLSearchParams(window.location.search).get('id');
        }

        // ====== РЕНДЕР СТОРІНКИ ТОВАРУ ======
        function renderProduct(item) {
            const container = document.getElementById('productContainer');
            const isOut = item.outOfStock === true;

            const priceRaw = Number(item.price ?? 0);
            const priceInt = Math.floor(priceRaw);
            const priceCents = Math.round((priceRaw - priceInt) * 100)
                .toString().padStart(2, '0');
            const oldPrice = item.oldPrice ? Math.round(Number(item.oldPrice)) : '';
            const imgSrc = noCache(item.image);

            // Оновлюємо title
            document.title = item.name + ' | Ваш ПАРТНЕР';
            document.getElementById('breadcrumb-name').textContent = item.name;

            // Хлібні крихти: куди вести "батька"
            const cat = (item.category || '').toLowerCase();
            const parentLink = document.getElementById('breadcrumb-parent');
            if (cat.includes('алкоголь')) {
                parentLink.href = 'alcohol.html';
                parentLink.textContent = 'Алкоголь';
            } else if (cat.includes('ярня')) {
                parentLink.href = 'coffee.html';
                parentLink.textContent = 'Кава та чай';
            } else {
                parentLink.href = 'promo.html';
                parentLink.textContent = 'Акції';
            }

            container.innerHTML = `
                <div class="product-layout ${isOut ? 'is-out-of-stock' : ''}">
                    <div class="product-image-wrap">
                        ${item.badge && !isOut ? `<div class="product-badge">${item.badge}</div>` : ''}
                        ${isOut ? `<div class="product-out-label">НЕМАЄ В НАЯВНОСТІ</div>` : ''}
                        ${item.bestPrice && !isOut ? `<img src="./image_site/photo.png" alt="Найспрайс" class="product-best-price" onerror="this.style.display='none';">` : ''}
                        <img src="${imgSrc}" alt="${item.name}" class="product-main-img"
                             onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                    </div>

                    <div class="product-info">
                        ${item.manufacturer ? `<div class="product-manufacturer">${item.manufacturer}</div>` : ''}
                        <h1 class="product-name">${item.name}</h1>

                        <div class="product-prices">
                            ${oldPrice && !isOut ? `<div class="product-old-price">${oldPrice} ₴</div>` : ''}
                            <div class="product-new-price ${isOut ? 'gray' : ''}">
                                <span class="product-price-int">${priceInt}</span>
                                <span class="product-price-cents-wrap">
                                    <span class="product-price-cents">${priceCents}</span>
                                    <span class="product-price-unit">грн/шт</span>
                                </span>
                            </div>
                        </div>

                        <div class="product-meta">
                            ${item.category ? `
                                <div class="product-meta-row">
                                    <span class="product-meta-label">Категорія:</span>
                                    <span class="product-meta-value">${item.category}</span>
                                </div>
                            ` : ''}
                            ${item.manufacturer ? `
                                <div class="product-meta-row">
                                    <span class="product-meta-label">Виробник:</span>
                                    <span class="product-meta-value">${item.manufacturer}</span>
                                </div>
                            ` : ''}
                            ${item.validUntil && !isOut ? `
                                <div class="product-meta-row product-meta-highlight">
                                    <span class="product-meta-label">Акція діє до:</span>
                                    <span class="product-meta-value">${item.validUntil}</span>
                                </div>
                            ` : ''}
                        </div>

                        ${isOut ? `
                            <div class="product-out-message">
                                На жаль, цей товар тимчасово відсутній.
                                Завітайте пізніше або оберіть інший.
                            </div>
                        ` : ''}

                        <a href="javascript:history.back()" class="product-back-btn">
                            ← Повернутися до списку
                        </a>
                    </div>
                </div>
            `;
        }

        // ====== ЗАВАНТАЖЕННЯ ======
        const productId = getIdFromUrl();
        const container = document.getElementById('productContainer');

        if (!productId) {
            container.innerHTML = `
                <div class="product-error">
                    <h2>Товар не знайдено</h2>
                    <p>Перейдіть на <a href="promo.html">сторінку акцій</a> та виберіть товар.</p>
                </div>
            `;
        } else {
            fetch(noCache('./data/promotions.json'))
                .then(r => r.ok ? r.json() : Promise.reject('Помилка'))
                .then(data => {
                    const items = data.items || [];
                    const item = items.find(it => String(it.id) === String(productId));

                    if (!item) {
                        container.innerHTML = `
                            <div class="product-error">
                                <h2>Товар не знайдено</h2>
                                <p>Можливо, він уже неактуальний. Поверніться до <a href="promo.html">акцій</a>.</p>
                            </div>
                        `;
                        return;
                    }

                    renderProduct(item);
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = `
                        <div class="product-error">
                            <h2>Помилка завантаження</h2>
                            <p>Спробуйте пізніше.</p>
                        </div>
                    `;
                });
        }
    </script>

</body>
</html>
