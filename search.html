<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пошук | Ваш ПАРТНЕР</title>
    <link rel="stylesheet" href="style.css?v=37">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <img src="./image_site/_2.jpg" alt="Логотип" onerror="this.onerror=null; this.style.display='none'; this.parentElement.innerHTML='Ваш<span>ПАРТНЕР</span>';">
            </a>

            <!-- Пошук (той самий код) -->
            <div class="search-box" id="searchBox">
                <input type="text" id="searchInput" class="search-input" placeholder="Пошук товарів..." autocomplete="off">
                <button class="search-clear" id="searchClear" type="button" aria-label="Очистити">×</button>
                <div class="search-results" id="searchResults">
                    <div class="search-results-list" id="searchResultsList"></div>
                    <a href="#" class="search-all-link" id="searchAllLink" style="display:none;">Перейти до всіх результатів →</a>
                </div>
            </div>

            <button class="burger" id="burgerBtn" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav" id="mainNav">
                <a href="/">Головна</a>
                <a href="promo.html">Акції</a>
                <a href="alcohol.html">Алкоголь</a>
                <a href="coffee.html">Кава та чай</a>
                <a href="#">Контакти</a>
            </nav>
        </div>
    </header>

    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Заголовок пошуку -->
    <section class="page-title search-page-title">
        <div class="container">
            <h2 id="page-title">Пошук</h2>
            <p id="search-query-display">Завантаження...</p>
        </div>
    </section>

    <nav class="breadcrumbs">
        <div class="container">
            <a href="/">Головна</a>
            <span class="sep">›</span>
            <span class="current">Пошук</span>
        </div>
    </nav>

    <main class="container" id="promo">
        <div class="grid" id="promo-container">
            <p class="loading">Завантаження...</p>
        </div>
    </main>

    <footer class="site-footer">
        <!-- Футер як у вас -->
    </footer>

    <script>
        const PLACEHOLDER = './images/0.png';

        function noCache(url) {
            const separator = url.includes('?') ? '&' : '?';
            return url + separator + 't=' + Date.now();
        }

        // ====== БУРГЕР-МЕНЮ ======
        const burgerBtn = document.getElementById('burgerBtn');
        const mainNav = document.getElementById('mainNav');
        const menuOverlay = document.getElementById('menuOverlay');
        function toggleMenu() {
            burgerBtn.classList.toggle('active');
            mainNav.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            document.body.classList.toggle('menu-open');
        }
        function closeMenu() {
            burgerBtn.classList.remove('active');
            mainNav.classList.remove('active');
            menuOverlay.classList.remove('active');
            document.body.classList.remove('menu-open');
        }
        burgerBtn.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', closeMenu);
        mainNav.querySelectorAll('a').forEach(l => l.addEventListener('click', closeMenu));

        // ====== ПОШУК (той самий код, що в інших файлах) ======
        const PLACEHOLDER_SEARCH = './images/0.png';
        let searchAllItems = [];
        let searchDebounceTimer = null;
        let searchLoaded = false;

        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const searchResultsList = document.getElementById('searchResultsList');
        const searchAllLink = document.getElementById('searchAllLink');
        const searchClear = document.getElementById('searchClear');

        function loadSearchData() {
            if (searchLoaded) return Promise.resolve(searchAllItems);
            return fetch(noCache('./data/promotions.json'))
                .then(r => r.ok ? r.json() : Promise.reject('Помилка'))
                .then(data => {
                    searchAllItems = (data.items || []).filter(it => it.visible !== false);
                    searchLoaded = true;
                    return searchAllItems;
                })
                .catch(err => { console.error(err); return []; });
        }

        function searchItems(query) {
            const q = query.trim().toLowerCase();
            if (!q) return [];
            return searchAllItems.filter(it => {
                const name = (it.name || '').toLowerCase();
                const manufacturer = (it.manufacturer || '').toLowerCase();
                const category = (it.category || '').toLowerCase();
                return name.includes(q) || manufacturer.includes(q) || category.includes(q);
            });
        }

        function renderSearchResults(results, query) {
            if (results.length === 0) {
                searchResultsList.innerHTML = '<div class="search-empty">Нічого не знайдено</div>';
                searchAllLink.style.display = 'none';
                return;
            }
            const top = results.slice(0, 4);
            searchResultsList.innerHTML = top.map(item => {
                const img = noCache(item.image);
                const price = Number(item.price ?? 0);
                const priceStr = price.toFixed(2).replace('.', ',');
                return `
                    <a href="search.html?q=${encodeURIComponent(query)}" class="search-item">
                        <img src="${img}" alt="${item.name}" class="search-item-img" onerror="this.onerror=null; this.src='${PLACEHOLDER_SEARCH}';">
                        <div class="search-item-info">
                            <div class="search-item-name">${item.name}</div>
                            ${item.manufacturer ? `<div class="search-item-manufacturer">${item.manufacturer}</div>` : ''}
                        </div>
                        <div class="search-item-price">${priceStr} ₴</div>
                    </a>
                `;
            }).join('');
            searchAllLink.style.display = 'block';
            searchAllLink.href = 'search.html?q=' + encodeURIComponent(query);
        }

        function showSearchResults() { searchResults.classList.add('active'); }
        function hideSearchResults() { searchResults.classList.remove('active'); }

        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value;
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(async () => {
                    if (query.trim().length < 2) { hideSearchResults(); return; }
                    await loadSearchData();
                    const results = searchItems(query);
                    renderSearchResults(results, query);
                    showSearchResults();
                }, 150);
            });
            searchInput.addEventListener('focus', () => {
                if (searchInput.value.trim().length >= 2) showSearchResults();
            });
            searchClear.addEventListener('click', () => {
                searchInput.value = '';
                hideSearchResults();
                searchInput.focus();
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-box')) hideSearchResults();
            });
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { hideSearchResults(); searchInput.blur(); }
            });
        }

        // ====== РЕНДЕР СТОРІНКИ ПОШУКУ ======
        function makeCard(item) {
            const card = document.createElement('div');
            card.className = 'card';
            const isOut = item.outOfStock === true;
            if (isOut) card.classList.add('out-of-stock');
            const priceRaw = Number(item.price ?? 0);
            const priceInt = Math.floor(priceRaw);
            const priceCents = Math.round((priceRaw - priceInt) * 100).toString().padStart(2, '0');
            const oldPrice = item.oldPrice ? Math.round(Number(item.oldPrice)) : '';
            const imgSrc = noCache(item.image);
            card.innerHTML = `
                ${item.badge && !isOut ? `<div class="badge">${item.badge}</div>` : ''}
                ${item.bestPrice && !isOut ? `<img src="./image_site/photo.png" alt="Найспрайс" class="best-price-icon" onerror="this.style.display='none';">` : ''}
                <div class="card-image">
                    <img src="${imgSrc}" alt="${item.name}" loading="lazy" onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                </div>
                <div class="card-body">
                    ${isOut ? `<div class="out-of-stock-label">НЕМАЄ В НАЯВНОСТІ</div>` : ''}
                    ${oldPrice && !isOut ? `<div class="old-price">${oldPrice} ₴</div>` : ''}
                    <div class="new-price">
                        <span class="price-int">${priceInt}</span>
                        <span class="price-cents-wrap">
                            <span class="price-cents">${priceCents}</span>
                            <span class="price-unit">грн/шт</span>
                        </span>
                    </div>
                    <h3>${item.name}</h3>
                    ${item.validUntil && !isOut ? `<p class="valid-until">Акція діє до ${item.validUntil}</p>` : ''}
                </div>
            `;
            return card;
        }

        function getQueryFromUrl() {
            return new URLSearchParams(window.location.search).get('q') || '';
        }

        // Ініціалізація сторінки
        async function initSearchPage() {
            const query = getQueryFromUrl();
            const titleEl = document.getElementById('page-title');
            const queryEl = document.getElementById('search-query-display');
            const container = document.getElementById('promo-container');

            if (!query) {
                titleEl.textContent = 'Пошук';
                queryEl.textContent = 'Введіть запит у полі зверху';
                container.innerHTML = '<p class="loading">Нічого не введено</p>';
                return;
            }

            // Заповнюємо поле пошуку
            searchInput.value = query;

            titleEl.textContent = 'Результати пошуку';
            queryEl.textContent = '«' + query + '»';

            await loadSearchData();
            const results = searchItems(query);

            container.innerHTML = '';
            if (results.length === 0) {
                container.innerHTML = '<p class="loading">Нічого не знайдено. Спробуйте інший запит.</p>';
                return;
            }

            results.forEach(it => container.appendChild(makeCard(it)));

            // Додаємо заголовок з кількістю
            queryEl.textContent = '«' + query + '» — знайдено ' + results.length;
        }

        initSearchPage();
    </script>

</body>
</html>
