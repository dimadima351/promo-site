<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результати пошуку | Ваш ПАРТНЕР</title>

    <link rel="icon" type="image/png" href="./image_site/favicon.png">
    <link rel="apple-touch-icon" href="./image_site/favicon.png">

    <link rel="stylesheet" href="style.css?v=60">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <img src="./image_site/_2.jpg" alt="Логотип"
                     onerror="this.style.display='none'; this.parentElement.innerHTML='Ваш<span>ПАРТНЕР</span>';">
            </a>

            <button class="burger" id="burgerBtn" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav" id="mainNav">
                <a href="/">Головна</a>
                <a href="promo.html">Акції</a>
                <a href="alcohol.html">Алкоголь</a>
                <a href="coffee.html">Кавʼярня</a>
                <a href="events.html">Події</a>
                <a href="suppliers.html">Партнерам</a>
            </nav>
        </div>
    </header>

    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- БАНЕР-КАРУСЕЛЬ (як на головній) -->
    <section class="banner-carousel" id="bannerCarousel">
        <img src="./image_site/banner1.jpg" alt="" class="banner-slide active" onerror="this.style.opacity=0.3">
        <img src="./image_site/banner2.jpg" alt="" class="banner-slide" onerror="this.style.opacity=0.3">
        <img src="./image_site/banner3.jpg" alt="" class="banner-slide" onerror="this.style.opacity=0.3">
        <img src="./image_site/banner4.jpg" alt="" class="banner-slide" onerror="this.style.opacity=0.3">
        <img src="./image_site/banner5.jpg" alt="" class="banner-slide" onerror="this.style.opacity=0.3">

        <div class="banner-dots">
            <span class="dot active" data-slide="0"></span>
            <span class="dot" data-slide="1"></span>
            <span class="dot" data-slide="2"></span>
            <span class="dot" data-slide="3"></span>
            <span class="dot" data-slide="4"></span>
        </div>
    </section>

    <!-- ПОШУК + КАТЕГОРІЇ -->
    <section class="search-categories-section">
        <div class="container">
            <div class="search-cat-row">

                <!-- Пошук (без випадаючих результатів — оновлює сторінку) -->
                <div class="search-box-wrap">
                    <div class="search-input-wrap">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="mainSearchInput" class="search-input-main" placeholder="Пошук товарів..." autocomplete="off">
                        <button class="search-clear-btn" id="mainSearchClear" type="button" aria-label="Очистити">×</button>
                    </div>
                </div>

                <!-- Карусель категорій -->
                <div class="categories-carousel" id="categoriesCarousel">

                    <button class="cat-circle" data-cat="Солодощі" type="button">
                        <div class="cat-img-wrap">
                            🍫
                            <img src="./image_site/cat-solodoshchi.png" alt="" onerror="this.remove()">
                        </div>
                        <span class="cat-label">Солодощі</span>
                    </button>

                    <button class="cat-circle" data-cat="Молочні продукти" type="button">
                        <div class="cat-img-wrap">
                            🥛
                            <img src="./image_site/cat-molochni.png" alt="" onerror="this.remove()">
                        </div>
                        <span class="cat-label">Молочні</span>
                    </button>

                    <button class="cat-circle" data-cat="Бакалія" type="button">
                        <div class="cat-img-wrap">
                            🍞
                            <img src="./image_site/cat-bakaliya.png" alt="" onerror="this.remove()">
                        </div>
                        <span class="cat-label">Бакалія</span>
                    </button>

                    <button class="cat-circle" data-cat="Алкоголь" type="button">
                        <div class="cat-img-wrap">
                            🍷
                            <img src="./image_site/cat-alkohol.png" alt="" onerror="this.remove()">
                        </div>
                        <span class="cat-label">Алкоголь</span>
                    </button>

                    <button class="cat-circle" data-cat="Заморожені" type="button">
                        <div class="cat-img-wrap">
                            ❄️
                            <img src="./image_site/cat-zamorozheni.png" alt="" onerror="this.remove()">
                        </div>
                        <span class="cat-label">Заморожені</span>
                    </button>

                    <button class="cat-circle" data-cat="Кава" type="button">
                        <div class="cat-img-wrap">
                            ☕
                            <img src="./image_site/cat-kava.png" alt="" onerror="this.remove()">
                        </div>
                        <span class="cat-label">Кава</span>
                    </button>

                    <button class="cat-circle" data-cat="Дитяче харчування" type="button">
                        <div class="cat-img-wrap">
                            🍼
                            <img src="./image_site/cat-dytiache.png" alt="" onerror="this.remove()">
                        </div>
                        <span class="cat-label">Дитяче</span>
                    </button>

                </div>

            </div>
        </div>
    </section>

    <!-- Заголовок -->
    <section class="page-title" style="padding: 20px 0;">
        <div class="container">
            <h2 id="page-title">Всі товари</h2>
            <p id="page-subtitle">Завантаження...</p>
        </div>
    </section>

    <main class="container" id="promo">
        <div class="grid" id="search-container">
            <p class="loading">Завантаження...</p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Ваш ПАРТНЕР. Усі права захищено.</p>
            </div>
        </div>
    </footer>

    <script>
        const PLACEHOLDER = './images/0.png';

        function noCache(url) {
            const separator = url.includes('?') ? '&' : '?';
            return url + separator + 't=' + Date.now();
        }

        // ====== БУРГЕР-МЕНЮ ======
        const burgerBtn = document.getElementById('burgerBtn');
        const mainNav = document.getElementById('mainNav');
        const menuOverlay = document.getElementById('menuOverlay');

        function toggleMenu() {
            burgerBtn.classList.toggle('active');
            mainNav.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            document.body.classList.toggle('menu-open');
        }
        function closeMenu() {
            burgerBtn.classList.remove('active');
            mainNav.classList.remove('active');
            menuOverlay.classList.remove('active');
            document.body.classList.remove('menu-open');
        }
        burgerBtn.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', closeMenu);
        mainNav.querySelectorAll('a').forEach(l => l.addEventListener('click', closeMenu));

        // ====== БАНЕР-КАРУСЕЛЬ ======
        (function() {
            const slides = document.querySelectorAll('.banner-slide');
            const dots = document.querySelectorAll('.banner-dots .dot');
            if (slides.length === 0) return;

            let current = 0;
            let timer = null;

            function show(i) {
                slides.forEach((s, idx) => s.classList.toggle('active', idx === i));
                dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
                current = i;
            }
            function next() { show((current + 1) % slides.length); }
            function start() { stop(); timer = setInterval(next, 5000); }
            function stop() { if (timer) { clearInterval(timer); timer = null; } }

            show(0);
            start();

            dots.forEach(dot => {
                dot.addEventListener('click', () => {
                    show(parseInt(dot.dataset.slide));
                    start();
                });
            });

            const el = document.getElementById('bannerCarousel');
            if (el) {
                el.addEventListener('mouseenter', stop);
                el.addEventListener('mouseleave', start);
            }
        })();

        // ====== КАРТКА ТОВАРУ ======
        function makeCard(item) {
            const link = document.createElement('a');
            link.href = 'product.html?id=' + item.id;
            link.className = 'card-link';
            link.style.cssText = 'display:block; text-decoration:none; color:inherit; height:100%;';

            const card = document.createElement('div');
            card.className = 'card';
            const isOut = item.outOfStock === true;
            if (isOut) card.classList.add('out-of-stock');

            const priceRaw = Number(item.price ?? 0);
            const priceInt = Math.floor(priceRaw);
            const priceCents = Math.round((priceRaw - priceInt) * 100).toString().padStart(2, '0');
            const oldPrice = item.oldPrice ? Math.round(Number(item.oldPrice)) : '';
            const imgSrc = noCache(item.image);

            card.innerHTML = `
                ${item.badge && !isOut ? `<div class="badge">${item.badge}</div>` : ''}
                ${item.bestPrice && !isOut ? `<img src="./image_site/photo.png" alt="Найспрайс" class="best-price-icon" onerror="this.style.display='none';">` : ''}
                <div class="card-image">
                    <img src="${imgSrc}" alt="${item.name}" loading="lazy"
                         onerror="this.onerror=null; this.src='${PLACEHOLDER}';">
                </div>
                <div class="card-body">
                    ${isOut ? `<div class="out-of-stock-label">НЕМАЄ В НАЯВНОСТІ</div>` : ''}
                    ${oldPrice && !isOut ? `<div class="old-price">${oldPrice} ₴</div>` : ''}
                    <div class="new-price">
                        <span class="price-int">${priceInt}</span>
                        <span class="price-cents-wrap">
                            <span class="price-cents">${priceCents}</span>
                            <span class="price-unit">грн/шт</span>
                        </span>
                    </div>
                    <h3>${item.name}</h3>
                    ${item.validUntil && !isOut ? `<p class="valid-until">Акція діє до ${item.validUntil}</p>` : ''}
                </div>
            `;

            link.appendChild(card);
            return link;
        }

        // ====== СТАН ======
        let allProducts = [];
        const container = document.getElementById('search-container');
        const titleEl = document.getElementById('page-title');
        const subtitleEl = document.getElementById('page-subtitle');
        const searchInput = document.getElementById('mainSearchInput');
        const clearBtn = document.getElementById('mainSearchClear');

        // ====== ФІЛЬТРАЦІЯ ======
        function filterAndRender() {
            const q = searchInput.value.trim().toLowerCase();
            const urlCat = new URLSearchParams(window.location.search).get('cat');

            let items = allProducts.slice();

            // Фільтр по категорії (з кружечка)
            if (urlCat) {
                const c = urlCat.toLowerCase();
                items = items.filter(it => (it.category || '').toLowerCase().includes(c));
            }

            // Фільтр по пошуку
            if (q.length >= 2) {
                items = items.filter(it => {
                    const name = (it.name || '').toLowerCase();
                    const man = (it.manufacturer || '').toLowerCase();
                    const cat = (it.category || '').toLowerCase();
                    return name.includes(q) || man.includes(q) || cat.includes(q);
                });
                titleEl.textContent = 'Пошук: «' + searchInput.value.trim() + '»';
            } else if (urlCat) {
                titleEl.textContent = urlCat;
            } else {
                titleEl.textContent = 'Всі товари';
            }

            subtitleEl.textContent = 'Знайдено товарів: ' + items.length;

            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = '<p class="loading">Нічого не знайдено 😔</p>';
                return;
            }
            items.forEach(it => container.appendChild(makeCard(it)));
        }

        // ====== ОНОВЛЕННЯ URL БЕЗ ПЕРЕЗАВАНТАЖЕННЯ ======
        function updateUrl(params) {
            const url = new URL(window.location);
            url.search = '';
            Object.keys(params).forEach(k => {
                if (params[k]) url.searchParams.set(k, params[k]);
            });
            history.pushState(params, '', url);
        }

        // ====== ПОШУК ======
        searchInput.addEventListener('input', () => {
            const q = searchInput.value.trim();
            // Очищаємо категорію з URL, якщо почали пошук
            updateUrl({ q: q });
            filterAndRender();
        });

        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                updateUrl({});
                filterAndRender();
                searchInput.focus();
            });
        }

        // ====== КЛІК НА КРУЖЕЧОК ======
        document.querySelectorAll('.cat-circle').forEach(btn => {
            btn.addEventListener('click', () => {
                const cat = btn.dataset.cat;
                searchInput.value = '';
                updateUrl({ cat: cat });
                filterAndRender();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });

        // ====== ЗАВАНТАЖЕННЯ ======
        fetch(noCache('./data/promotions.json'))
            .then(r => r.ok ? r.json() : Promise.reject('Помилка'))
            .then(data => {
                allProducts = (data.items || []).filter(it => it.visible !== false);

                // Заповнюємо поле пошуку з URL
                const q = new URLSearchParams(window.location.search).get('q');
                if (q) searchInput.value = q;

                filterAndRender();
            })
            .catch(err => {
                console.error(err);
                container.innerHTML = '<p class="error">Помилка завантаження</p>';
            });
    </script>

</body>
</html>
